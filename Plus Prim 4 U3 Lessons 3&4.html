<head>

<style>
:root {
  --bg: #eef7ff; --card: #ffffff; --accent: #0569b3; --dark: #034a80;

  --row: #f7fbff; --reading: #fffdf2; --glow: #ffd43b; --shadow: rgba(3, 74, 128, 0.16);

* { box-sizing: border-box; }
body {
  font-family: 'Cairo', Arial, sans-serif;
  background: var(--bg);
  margin: 0; padding: 20px; text-align: center; color: var(--text);
}
.container {
  max-width: 1100px; margin: 0 auto 50px; background: var(--card);
  border: 4px solid var(--accent); border-radius: 25px;
  box-shadow: 0 18px 40px var(--shadow); padding: 30px 20px;
}
h1 { color: var(--accent); font-size: 2.2em; margin: 0 0 8px; }
h2 { color: var(--dark); border-bottom: 2px solid var(--border); display: inline-block; padding-bottom: 5px; margin: 0 0 8px; }
.lesson-badge {
  display: inline-block; padding: 6px 18px; border-radius: 20px;
  background: var(--accent); color: #fff; font-weight: 700; margin: 8px 0 12px;
}
h3 {
  background: linear-gradient(135deg, var(--highlight), var(--soft));
  border-right: 7px solid var(--accent); color: var(--dark);
  padding: 12px 16px; border-radius: 10px; margin: 30px 0 12px;
  text-align: right; direction: ltr; font-size: 1.3em;
}
.section-number { color: var(--accent); font-weight: 800; }
.speech-controls {
  background: var(--soft); border: 1px solid var(--border); padding: 15px;
  border-radius: 15px; margin-bottom: 18px; display: flex; flex-wrap: wrap;
  justify-content: center; gap: 15px; align-items: center;
}
.control-group { display: flex; align-items: center; gap: 8px; font-weight: 700; }
#speed-value { min-width: 35px; color: var(--accent); }
select, input[type="range"] { cursor: pointer; }
select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.theme-switcher { display: flex; gap: 8px; align-items: center; }
.theme-dot {
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  border: 2px solid #fff; box-shadow: 0 0 0 1px #999;
}
.theme-dot.active { box-shadow: 0 0 0 2px #111827; }
.table-wrap { width: 100%; overflow-x: auto; margin-top: 12px; }
table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  text-align: right; border-radius: 15px; overflow: hidden;
  box-shadow: 0 5px 14px var(--shadow);
}
th, td { border: 1px solid var(--border); padding: 10px; vertical-align: middle; }
th { background: var(--accent); color: #fff; font-size: 1em; text-align: center; }
td:nth-child(odd) { background: var(--row); }
td:nth-child(even) { background: #fff; }
.english-cell { text-align: left !important; direction: ltr !important; }
.arabic-cell { text-align: right !important; direction: rtl !important; }
.play-btn {
  background: var(--button); color: #17202a; border: 0; padding: 11px 22px;
  border-radius: 12px; cursor: pointer; font-size: 1em; font-weight: 700;
  box-shadow: 0 5px var(--button-shadow); margin: 8px 0 12px; transition: all 0.1s;
}
.play-btn:active { transform: translateY(3px); box-shadow: 0 2px var(--button-shadow); }
.text-play-btn { display: block; margin: 10px auto; }
.vocab-element, .english-sentence, .dialogue-text {
  cursor: pointer; transition: all 0.2s; padding: 4px 8px; border-radius: 5px;
  display: inline-block; font-family: 'Roboto', Arial, sans-serif; font-weight: 700;
  color: #123b68; border: 2px solid transparent; direction: ltr !important; text-align: left;
}
.vocab-element:hover, .english-sentence:hover, .dialogue-text:hover { background: var(--highlight); }
.english-sentence { display: block; margin-bottom: 4px; color: #111827; line-height: 1.5; font-size: 1.05em; }
.speaking-highlight {
  background: var(--speak) !important; color: #fff !important;
  border-color: var(--glow) !important; box-shadow: 0 0 15px var(--glow); transform: scale(1.01);
}
.arabic-translation {
  display: block; text-align: right; direction: rtl !important; color: var(--muted);
  border-bottom: 1px dashed #cbd5e1; margin-bottom: 12px; padding: 3px 8px 6px; font-size: 0.98em; font-weight: 600;
}
.reading-block {
  margin-bottom: 24px; padding: 20px; background: var(--reading);
  border: 1px solid var(--border); border-radius: 12px; text-align: left;
}
.reading-heading {
  color: var(--accent); font-size: 1.3em; font-weight: 700; margin: 0 0 10px;
  text-align: left; direction: ltr; border-bottom: 2px solid var(--border); padding-bottom: 5px;
}
.dialogue-line { margin: 8px 0; text-align: left; direction: ltr; }
.speaker { display: inline-block; min-width: 75px; font-weight: 700; color: var(--accent); }
.speaker.alt { color: #a21caf; }
.floating-stop-btn {

@media (max-width: 700px) {

  h1 { font-size: 1.6em; }

const synth = window.speechSynthesis;
let voices = [], queue = [], playing = false, current = null;

const themes = {
  blue: {a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},
  yellow: {a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},
  purple: {a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}
};

function theme(n) {
  const t = themes[n], r = document.documentElement.style;
  r.setProperty('--accent', t.a); r.setProperty('--dark', t.d);
  r.setProperty('--highlight', t.h); r.setProperty('--speak', t.s);
  r.setProperty('--button', t.b); r.setProperty('--button-shadow', t.bs);
  r.setProperty('--border', t.br); r.setProperty('--bg', t.bg);
  r.setProperty('--soft', t.so); r.setProperty('--row', t.ro);
  r.setProperty('--reading', t.rd); r.setProperty('--glow', t.g);
  r.setProperty('--shadow', t.sh);
}

function lang() { return document.getElementById('voice-select').value || 'en-US'; }
function loadVoices() { voices = synth.getVoices(); }
function clear() { if (current) current.classList.remove('speaking-highlight'); current = null; }
function stop() { synth.cancel(); queue = []; playing = false; clear(); }

function say(text, el) {
  if (!text) return;
  stop();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang();
  const v = voices.find(x => x.lang.toLowerCase() === lang().toLowerCase()) || voices.find(x => x.lang.toLowerCase().startsWith(lang().split('-')[0]));
  if (v) u.voice = v;
  u.rate = parseFloat(document.getElementById('speed-slider').value);
  if (el) {
    el.classList.add('speaking-highlight');
    current = el;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  u.onend = clear; u.onerror = clear;
  synth.speak(u);
}

function play(items) {
  stop();
  if (!items.length) return;
  queue = [...items];
  playing = true;
  let i = 0;
  function next() {
    if (!playing || i >= queue.length) { playing = false; clear(); return; }
    const el = queue[i++], text = el.innerText.trim();
    if (!text) { next(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang();
    const v = voices.find(x => x.lang.toLowerCase() === lang().toLowerCase()) || voices.find(x => x.lang.toLowerCase().startsWith(lang().split('-')[0]));
    if (v) u.voice = v;
    u.rate = parseFloat(document.getElementById('speed-slider').value);
    el.classList.add('speaking-highlight');
    current = el;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    u.onend = () => { clear(); next(); };
    u.onerror = () => { clear(); next(); };
    synth.speak(u);
  }
  next();
}

function cell(text, cls = 'vocab-element') {
  const s = document.createElement('span');
  s.className = cls;
  s.innerText = text;
  s.onclick = () => say(text, s);
  return s;
}

function pairTable(items, headers) {
  const w = document.createElement('div'); w.className = 'table-wrap';
  const t = document.createElement('table'), head = document.createElement('thead'), tr = document.createElement('tr');
  headers.forEach(x => { const th = document.createElement('th'); th.innerText = x; tr.appendChild(th); });
  head.appendChild(tr); t.appendChild(head);
  const body = document.createElement('tbody');
  items.forEach(x => {
    const r = document.createElement('tr');
    const en = document.createElement('td'); en.className = 'english-cell'; en.appendChild(cell(x.en));
    const ar = document.createElement('td'); ar.className = 'arabic-cell'; ar.innerText = x.ar;
    r.append(en, ar); body.appendChild(r);
  });
  t.appendChild(body); w.appendChild(t); return w;
}

  t.appendChild(b); w.appendChild(t); return w;
}

  box.appendChild(title);
  
  const items = [];
  const btn = document.createElement('button'); btn.className = 'play-btn text-play-btn';
  btn.innerText = '▶️ نطق النص كاملًا';
  box.appendChild(btn);

  (x.paragraphs || []).forEach(p => {
    const line = document.createElement('div');
    if (p.heading) {
      const hh = document.createElement('div'); hh.className = 'reading-heading'; hh.innerText = p.heading;
      line.appendChild(hh);
    }
    if (p.en) {
      const en = cell(p.en, 'english-sentence');
      line.appendChild(en);
      items.push(en);
    }
    if (p.ar) {
      const ar = document.createElement('span'); ar.className = 'arabic-translation'; ar.innerText = p.ar;
      line.appendChild(ar);
    }
    box.appendChild(line);
  });

  btn.onclick = () => play(items);
  return box;
}

const labels = {
  key_vocabulary: '📚 Key Vocabulary (الكلمات الأساسية)',
  extra_vocabulary: '➕ Extra Vocabulary (مفردات إضافية)',
  main_points: '🔗 Main Points on Listening and Reading Texts (نقاط هامة)',
  texts: '📖 Listening and Reading Texts (نصوص القراءة)',
  verbs: '🔄 Conjugation of Irregular Verbs (الأفعال)',
  expressions: '🔗 Important Expressions and Prepositions (تعبيرات هامة)'
};

const content = document.getElementById('lesson-content');
let n = 0;

data.section_order.forEach(key => {
  const val = data[key];
  if (!val || !val.length) return;
  const h = document.createElement('h3');
  h.innerHTML = '<span class="section-number">' + (++n) + '.</span> ' + (labels[key] || key);
  content.appendChild(h);

  if (key === 'key_vocabulary' || key === 'extra_vocabulary' || key === 'expressions') {
    content.appendChild(pairTable(val, ['English', 'المعنى']));
  } else if (key === 'main_points') {
    content.appendChild(mainPoints(val));
  } else if (key === 'verbs') {
    content.appendChild(verbs(val));
  } else if (key === 'texts') {
    val.forEach(x => content.appendChild(textBlock(x)));
  }
});

document.getElementById('play-all-vocab-btn').onclick = () => {
  const els = [...document.querySelectorAll('#lesson-content .vocab-element')];
  play(els);
};
document.getElementById('stop-btn').onclick = stop;
document.getElementById('voice-select').onchange = () => localStorage.setItem(lessonId + '_voice', lang());
document.getElementById('speed-slider').oninput = e => {
  document.getElementById('speed-value').innerText = e.target.value + 'x';
  localStorage.setItem(lessonId + '_speed', e.target.value);
};
document.querySelectorAll('.theme-dot').forEach(d => d.onclick = () => {
  document.querySelectorAll('.theme-dot').forEach(x => x.classList.remove('active'));
  d.classList.add('active');
  theme(d.dataset.theme);
  localStorage.setItem(lessonId + '_theme', d.dataset.theme);
});

const savedTheme = localStorage.getItem(lessonId + '_theme') || 'blue';
const savedSpeed = localStorage.getItem(lessonId + '_speed') || '0.9';
const savedVoice = localStorage.getItem(lessonId + '_voice') || 'en-US';

theme(savedTheme);
document.getElementById('speed-slider').value = savedSpeed;
document.getElementById('speed-value').innerText = savedSpeed + 'x';
document.getElementById('voice-select').value = savedVoice;

loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
</script>
</body>
