entence": "The whale shark is the biggest fish in the world."}, {"topic": "Big and small animals", "word": "smallest", "sentence": "The smallest bird is the bee hummingbird."}], "texts": [{"type": "reading", "title": "Did you know...?", "paragraphs": [{"heading": "Animal Species", "en": "A species of animal is a group of animals that are the same or very similar.", "ar": "الفصيلة : هي مجموعة من الحيوانات متشابهة أو متقاربة جدًا في صفاتها."}, {"heading": "Scientific Discovery", "en": "There are millions of species of animals on Earth - and scientists discover new ones every year!", "ar": "يوجد ملايين الفصائل من الحيوانات على كوكب الأرض - ويكتشف العلماء فصائل جديدة كل عام!"}, {"heading": "Ant Strength", "en": "Ants are small, but they are extremely strong!", "ar": "النمل صغير الحجم ولكنه قوى للغاية!"}, {"heading": "Comparison to Humans", "en": "For their size, they are much stronger than humans.", "ar": "بالنسبة لحجمهم فهم اقوى بكثير من البشر."}], "dialogue": []}, {"type": "reading", "title": "Animal Characteristics", "paragraphs": [{"heading": "Mammals", "en": "Mammals have hair or fur. They are warm-blooded. They give birth to their babies. They feed their babies with milk. They live on land but some live in the sea.", "ar": "الثدييات لديها شعر أو فرو. هم من ذوات الدم الحار. يلدون صغارهم. يرضعون صغارهم بالحليب. يعيشون على الأرض ولكن بعضهم يعيش في البحر."}, {"heading": "Reptiles", "en": "Reptiles are cold-blooded. They have scales. They lay eggs. They live on the land but some live in the water.", "ar": "الزواحف من ذوات الدم البارد. لديهم قشور. يضعون البيض. يعيشون على الأرض ولكن بعضهم يعيش في الماء."}, {"heading": "Amphibians", "en": "Amphibians are cold-blooded. They lay eggs in water. They have smooth skin. They live on land and in water.", "ar": "البرمائيات من ذوات الدم البارد. يضعون البيض في الماء. لديهم جلد ناعم. يعيشون على الأرض وفي الماء."}, {"heading": "Fish", "en": "Fish breathe through their gills. They are cold-blooded. They have fins to help them swim. They have scales. They lay eggs.", "ar": "الأسماك تتنفس من خلال خياشيمها. هم من ذوات الدم البارد. لديهم زعانف لمساعدتهم على السباحة. لديهم قشور. يضعون البيض."}, {"heading": "Birds", "en": "Birds have beaks and lay eggs. They eat seeds, nuts and some eat meat. They are warm-blooded. They have feathers and wings.", "ar": "الطيور لديها مناقير وتضع البيض. يأكلون البذور والمكسرات وبعضهم يأكل اللحم. هم من ذوات الدم الحار. لديهم ريش وأجنحة."}], "dialogue": []}, {"type": "reading", "title": "How many types of animals lay eggs?", "paragraphs": [{"heading": "Vertebrates", "en": "There are two types of animals: Vertebrates and invertebrates. Vertebrates are animals with a backbone. There are five types of vertebrates.", "ar": "هناك نوعان من الحيوانات: فقاريات ولافقاريات. الفقاريات هي حيوانات لها عمود فقري. هناك خمسة أنواع من الفقاريات."}, {"heading": "1. Mammals", "en": "Mammals are warm-blooded. They have hair or fur and feed their babies with milk. They give birth to their babies. Humans are mammals. Most mammals live on the land, but some live in the sea like dolphins or whales. Bats are the only mammals that can fly.", "ar": "الثدييات من ذوات الدم الحار. لديهم شعر أو فرو ويرضعون صغارهم بالحليب. هم يلدون صغارهم. البشر من الثدييات. معظم الثدييات تعيش على الأرض، لكن بعضها يعيش في البحر مثل الدلافين أو الحيتان. الخفافيش هي الثدييات الوحيدة التي يمكنها الطيران."}, {"heading": "2. Reptiles", "en": "Reptiles are cold-blooded. They have scales and need the sun to stay warm. Most reptiles live on the land like snakes or lizards, but some live in the water like turtles. All reptiles lay eggs.", "ar": "الزواحف من ذوات الدم البارد. لديهم قشور ويحتاجون للشمس ليبقوا دافئين. معظم الزواحف تعيش على الأرض مثل الثعابين أو السحالي، لكن بعضها يعيش في الماء مثل السلاحف. كل الزواحف تضع البيض."}, {"heading": "3. Amphibians", "en": "Amphibians, like frogs or toads, are cold-blooded. They can live on land and in water. They have smooth skin and not scales. They lay their eggs in water. They need a warm and moist habitat to survive.", "ar": "البرمائيات، مثل الضفادع أو العلاحيم، من ذوات الدم البارد. يمكنهم العيش على الأرض وفي الماء. لديهم جلد ناعم وليس قشور. يضعون بيضهم في الماء. يحتاجون إلى موطن دافئ ورطب للبقاء على قيد الحياة."}, {"heading": "4. Fish", "en": "Fish are cold-blooded and live in water. They have scales and fins to help them swim. They can live in fresh water or sea water. They lay eggs and breathe through their gills.", "ar": "الأسماك من ذوات الدم البارد وتعيش في الماء. لديهم قشور وزعانف لمساعدتهم على السباحة. يمكنهم العيش في المياه العذبة أو مياه البحر. يضعون البيض ويتنفسون من خلال خياشيمهم."}, {"heading": "5. Birds", "en": "Birds are warm-blooded. They have feathers which help them to fly. They have beaks which they use to eat seeds, nuts and some even eat meat. They lay eggs in nests made from sticks and leaves to keep their eggs safe.", "ar": "الطيور من ذوات الدم الحار. لديهم ريش يساعدهم على الطيران. لديهم مناقير يستخدمونها لأكل البذور والمكسرات وبعضهم يأكل اللحم. يضعون البيض في أعشاش مصنوعة من العصي والأوراق للحفاظ على سلامة بيضهم."}], "dialogue": []}, {"type": "reading", "title": "Where does the biggest animal in the world live?", "paragraphs": [{"heading": "Land and Sea Giants", "en": "In the natural world, there are some enormous animals, and some tiny ones! The biggest animal on land is a mammal: the African elephant. The African elephant is bigger than the Asian elephant. The biggest animal in the world is also a mammal, but it lives in the sea. It's the blue whale, and it can be up to 30 meters long. In fact, they are the biggest animals that have ever lived on Earth!", "ar": "في عالم الطبيعة، هناك بعض الحيوانات الضخمة، وبعض الحيوانات الضئيلة! أكبر حيوان على الأرض هو حيوان ثديي: الفيل الأفريقي. الفيل الأفريقي أكبر من الفيل الآسيوي. أكبر حيوان في العالم هو أيضًا حيوان ثديي، لكنه يعيش في البحر. إنه الحوت الأزرق، ويمكن أن يصل طوله إلى ٣٠ مترًا. في الواقع، هي أكبر الحيوانات التي عاشت على الأرض على الإطلاق!"}, {"heading": "Fish and Birds", "en": "The whale shark is the biggest fish in the world. It's smaller than the blue whale, at about 12 meters long. The smallest bird is the bee hummingbird, which is about 5.5 centimeters long. It lives in Cuba. The biggest bird is the ostrich. It can be 2.5 meters tall! Ostriches are faster than leopards, but they can't fly.", "ar": "قرش الحوت هو أكبر سمكة في العالم. إنه أصغر من الحوت الأزرق، حيث يبلغ طوله حوالي ١٢ مترًا. أصغر طائر هو طائر طنان النحل، ويبلغ طوله حوالي ٥.٥ سنتيمتر. يعيش في كوبا. أكبر طائر هو النعامة. يمكن أن يصل طولها إلى ٢.٥ متر! النعام أسرع من الفهود المرقطة، لكنها لا تستطيع الطيران."}, {"heading": "Smallest Reptile and Vertebrate", "en": "In 2012, scientists discovered a tiny chameleon in Madagascar. People think it is the smallest reptile in the world, at just 30 millimeters long! But even that is bigger than a frog in Papua, New Guinea. It's 7 millimeters long, so it is the smallest vertebrate that we have discovered.", "ar": "في عام ٢٠١٢، اكتشف العلماء حرباء ضئيلة في مدغشقر. يعتقد الناس أنه أصغر زاحف في العالم، حيث يبلغ طوله ٣٠ مليمترًا فقط! ولكن حتى ذلك أكبر من ضفدع في بابوا غينيا الجديدة. يبلغ طوله ٧ مليمترات، لذا فهو أصغر فقاري اكتشفناه."}], "dialogue": []}, {"type": "reading", "title": "Language: Comparative and Superlative", "paragraphs": [{"heading": "Comparative Examples", "en": "Ants are smaller than elephants. The horse is bigger than the chameleon. Interesting is more interesting than.", "ar": "النمل أصغر من الفيلة. الحصان أكبر من الحرباء. صفة ممتع تصبح أكثر إمتاعًا من."}, {"heading": "Superlative Examples", "en": "The African elephant is the biggest animal on land. The smallest bird is the bee hummingbird. The biggest bird in the world is the ostrich. Beautiful is the most beautiful.", "ar": "الفيل الأفريقي هو أكبر حيوان على الأرض. أصغر طائر هو طائر طنان النحل. أكبر طائر في العالم هو النعامة. صفة جميل تصبح الأكثر جمالاً."}], "dialogue": []}], "verbs": [{"present": "survive", "past": "survived", "pp": "survived", "ar": "ينجو - يبقى حيًا"}, {"present": "discover", "past": "discovered", "pp": "discovered", "ar": "يكتشف"}, {"present": "breathe", "past": "breathed", "pp": "breathed", "ar": "يتنفس"}, {"present": "feed", "past": "fed", "pp": "fed", "ar": "يطعم"}, {"present": "lay", "past": "laid", "pp": "laid", "ar": "يبيض"}, {"present": "give birth", "past": "gave birth", "pp": "given birth", "ar": "تلد"}], "definitions": [], "expressions": [{"en": "up to 30 meters long", "ar": "يصل طوله إلى ٣٠ متر"}, {"en": "feed their babies with milk", "ar": "تُرضع صغارها"}, {"en": "lay eggs", "ar": "تضع البيض"}, {"en": "live on land", "ar": "يعيش على اليابسة"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading){const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
