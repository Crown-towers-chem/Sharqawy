</style></head><body><div class="container"><div class="lesson-badge">PLUS PRIM 6 • UNIT 4 • Lessons 3&amp;4</div><h1 id="main-title">Amazing David / Can I work with you?</h1><h2 id="sub-title">Unit 4</h2><div class="speech-controls"><div class="control-group"><label>🗣️ اللكنة:</label><select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select></div><div class="control-group"><label>⚡ السرعة:</label><input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1"><span id="speed-value">0.9x</span></div><div class="theme-switcher"><label>🎨</label><span class="theme-dot active" data-theme="blue" style="background:#0569b3" title="Blue"></span><span class="theme-dot" data-theme="yellow" style="background:#d89000" title="Yellow"></span><span class="theme-dot" data-theme="purple" style="background:#9333a8" title="Purple"></span></div></div><button id="play-all-vocab-btn" class="play-btn">▶️ نطق جميع الكلمات والتعبيرات</button><div id="lesson-content"></div></div><button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button><script>
const lessonId="unit4_lessons3_4",data={"lesson_title": "Amazing David / Can I work with you?", "unit_title": "Unit 4", "lessons_label": "Lessons 3&4", "section_order": ["key_vocabulary", "extra_vocabulary", "expressions", "main_points", "texts", "verbs", "definitions"], "key_vocabulary": [{"en": "prosthetic arm", "ar": "ذراع اصطناعية"}, {"en": "comic books", "ar": "مجلة مصورة"}, {"en": "advertisement", "ar": "إعلان"}, {"en": "kindness", "ar": "عطف"}, {"en": "poster", "ar": "ملصق - إعلان"}, {"en": "movable elbow", "ar": "كوع متحرك"}, {"en": "bricks", "ar": "مكعبات - قوالب"}, {"en": "disability", "ar": "إعاقة"}], "activities": [], "extra_vocabulary": [{"en": "drawing", "ar": "الرسم"}, {"en": "Spain", "ar": "أسبانيا"}, {"en": "cheaply", "ar": "بسعر رخيص"}, {"en": "university", "ar": "جامعة"}, {"en": "rainforest", "ar": "غابة مطيرة"}, {"en": "tropical", "ar": "استوائي"}, {"en": "fantastic", "ar": "رائع"}, {"en": "emotions", "ar": "مشاعر"}, {"en": "prices", "ar": "الأسعار"}, {"en": "bus ride", "ar": "رحلة بالحافلة"}, {"en": "TV channel", "ar": "قناة تلفزيونية"}, {"en": "confident", "ar": "واثق"}, {"en": "amazing", "ar": "مدهش - مذهل"}, {"en": "website", "ar": "موقع إلكتروني"}, {"en": "lovely", "ar": "جميل"}, {"en": "bakery", "ar": "مخبز"}, {"en": "agreement", "ar": "اتفاق"}, {"en": "entertainment", "ar": "تسلية"}, {"en": "improvement", "ar": "تحسين - تنمية"}, {"en": "ill", "ar": "مريض"}, {"en": "illness", "ar": "المرض"}, {"en": "happy", "ar": "سعيد"}, {"en": "happiness", "ar": "السعادة"}, {"en": "sad", "ar": "حزين"}, {"en": "sadness", "ar": "حزن"}, {"en": "information", "ar": "معلومات"}, {"en": "relaxation", "ar": "استرخاء"}, {"en": "transformation", "ar": "تحويل"}, {"en": "creation", "ar": "ابتكار - إبداع"}, {"en": "transportation", "ar": "وسائل النقل"}], "main_points": [{"topic": "Amazing David", "word": "prosthetic arm", "sentence": "David built a prosthetic arm with plastic bricks."}, {"topic": "Amazing David", "word": "movable elbow", "sentence": "He designed it with a movable elbow."}, {"topic": "Amazing David", "word": "comic book", "sentence": "David's dad wrote a comic book about David."}, {"topic": "Amazing David", "word": "disabilities", "sentence": "It helps people understand more about disabilities."}], "texts": [{"type": "reading", "title": "Amazing David!", "paragraphs": [{"heading": "", "en": "David Aguilar Amphoux is from Spain.", "ar": "ديفيد أغيلار أمفو هو من إسبانيا."}, {"heading": "", "en": "When he was 18, he built a prosthetic arm with plastic bricks because he only had one arm.", "ar": "عندما كان في الثامنة عشرة من عمره، بنى ذراعًا اصطناعية بقوالب بلاستيكية لأنه كان يملك ذراعًا واحدة فقط."}, {"heading": "", "en": "He designed it with a movable elbow and a hand to pick things up.", "ar": "صممه بكوع متحرك ويد لالتقاط الأشياء."}, {"heading": "", "en": "David's dad has written a comic book about David.", "ar": "كتب والد ديفيد مجلة مصورة عن ديفيد."}, {"heading": "", "en": "Everyone thinks this is great because it helps people understand more about disabilities.", "ar": "يعتقد الجميع أن هذا أمر رائع لأنه يساعد الناس على فهم المزيد عن الإعاقات."}, {"heading": "", "en": "Prosthetic arms and legs can be difficult to make, but David made his cheaply with plastic bricks.", "ar": "يمكن أن يكون صنع الأذرع والأرجل الاصطناعية أمرًا صعبًا، لكن ديفيد صنع أذرعه بسعر رخيص باستخدام القوالب البلاستيكية."}, {"heading": "", "en": "After university, he wants to create cheap prosthetic arms and legs for people.", "ar": "بعد الجامعة، يريد إنشاء أذرع وأرجل اصطناعية رخيصة للناس."}], "dialogue": []}, {"type": "dialogue", "title": "Grade 6 children working on a poster", "paragraphs": [], "dialogue": [{"speaker": "Mrs Parker", "en": "OK, everyone, I want you to get into groups to make posters about animals that live in tropical rainforests.", "ar": "حسناً يا رفاق، أريدكم أن تنقسموا إلى مجموعات لعمل ملصقات عن الحيوانات التي تعيش في الغابات الاستوائية المطيرة."}, {"speaker": "Mrs Parker", "en": "It should be an advertisement for the rainforest.", "ar": "يجب أن يكون إعلاناً عن الغابة المطيرة."}, {"speaker": "Mrs Parker", "en": "I would like colorful posters with lots of interesting information.", "ar": "أود الحصول على ملصقات ملونة تحتوي على الكثير من المعلومات المثيرة للاهتمام."}, {"speaker": "Mrs Parker", "en": "You can get in your groups now.", "ar": "يمكنكم الانضمام إلى مجموعاتكم الآن."}, {"speaker": "Mrs Parker", "en": "I'd like everyone to work together and don't forget - kindness is important.", "ar": "أود أن يعمل الجميع معاً ولا تنسوا - العطف مهم."}, {"speaker": "Tyler", "en": "Lewis, Alice, Logan, can I work with you?", "ar": "لويس، أليس، لوجان، هل يمكنني العمل معكم؟"}, {"speaker": "Lewis", "en": "Oh no, sorry. We're already working with Ryan. Ryan, come here!", "ar": "أوه لا، آسف. نحن نعمل بالفعل مع رايان. رايان، تعال إلى هنا!"}, {"speaker": "Ryan", "en": "I'm coming!", "ar": "أنا قادم!"}, {"speaker": "Tyler", "en": "Lucas and Paige, can I work with you?", "ar": "لوكاس وبيج، هل يمكنني العمل معكما؟"}, {"speaker": "Lucas", "en": "No, we're working with Matilda.", "ar": "لا، نحن نعمل مع ماتيلدا."}, {"speaker": "Narrator", "en": "Tyler starts to feel a bit sad and goes to talk to Mrs Parker.", "ar": "بدأ تايلر يشعر بالحزن قليلاً وذهب ليتحدث إلى السيدة باركر."}, {"speaker": "Tyler", "en": "I can't find a group to work with, Mrs Parker. Everyone has their group.", "ar": "لا أستطيع العثور على مجموعة للعمل معها، يا سيدة باركر. الجميع لديهم مجموعاتهم."}, {"speaker": "Mrs Parker", "en": "Oh dear! Of course we can find you someone. Let's go and talk to Eliza. Eliza, who are you working with in your group?", "ar": "يا عزيزي! بالطبع يمكننا أن نجد لك أحداً. دعنا نذهب ونتحدث إلى إليزا. إليزا، مع من تعملين في مجموعتك؟"}, {"speaker": "Eliza", "en": "I'm working with Owen and Jane, but we need someone else.", "ar": "أنا أعمل مع أوين وجين، لكننا بحاجة إلى شخص آخر."}, {"speaker": "Mrs Parker", "en": "Excellent! Here's Tyler!", "ar": "ممتاز! إليك تايلر!"}, {"speaker": "Eliza", "en": "Hi, Tyler! What would you like to do for the poster?", "ar": "مرحباً يا تايلر! ماذا تود أن تفعل للملصق؟"}, {"speaker": "Tyler", "en": "I'd love to draw the pictures!", "ar": "أحب أن أرسم الصور!"}, {"speaker": "Eliza", "en": "That's fantastic! I'm good at writing, Owen is good at design, and Jane is great at researching information and finding photos. If you can draw pictures, then we will make a very good team!", "ar": "هذا رائع! أنا جيدة في الكتابة، وأوين جيد في التصميم، وجين رائعة في البحث عن المعلومات والعثور على الصور. إذا كان بإمكانك رسم الصور، فسنكون فريقاً جيداً جداً!"}, {"speaker": "Narrator", "en": "A little later.....", "ar": "بعد قليل....."}, {"speaker": "Mrs Parker", "en": "These posters are beautiful. Who did these lovely pictures?", "ar": "هذه الملصقات جميلة. من الذي رسم هذه الصور الجميلة؟"}, {"speaker": "Owen", "en": "That was Tyler, Mrs Parker - he really worked hard to make our poster.", "ar": "كان ذلك تايلر، يا سيدة باركر - لقد عمل بجد حقاً لعمل ملصقنا."}, {"speaker": "Narrator", "en": "Tyler smiles and looks very proud.", "ar": "يبتسم تايلر ويبدو فخوراً جداً."}]}, {"type": "dialogue", "title": "Shopping for a present", "paragraphs": [], "dialogue": [{"speaker": "Reem", "en": "Would you both like to come shopping with me? I want to buy a present for my mom.", "ar": "هل تودان المجيء للتسوق معي؟ أريد شراء هدية لأمي."}, {"speaker": "Mazen", "en": "Oh, that's nice, Reem. Is it her birthday?", "ar": "أوه، هذا لطيف يا ريم. هل هو عيد ميلادها؟"}, {"speaker": "Reem", "en": "No, it isn't. I just want to buy her a present for being the best mom. I'm going to use my birthday money from last month.", "ar": "لا، ليس كذلك. أريد فقط أن أشتري لها هدية لكونها أفضل أم. سأستخدم مال عيد ميلادي من الشهر الماضي."}, {"speaker": "Talia", "en": "That's a great idea. My mom always says, \"kindness is important\", and that's a kind thing to do. Your mom will love a present. What do you want to buy her?", "ar": "هذه فكرة رائعة. تقول أمي دائماً \"العطف مهم\"، وهذا عمل طيب. ستحب والدتك الهدية. ماذا تريدين أن تشتري لها؟"}, {"speaker": "Reem", "en": "I was thinking of buying her some special cookies, or cakes. I saw an advertisement for the new bakery in town. They make really special cakes and cookies. They put them in a white box with some pretty paper.", "ar": "كنت أفكر في شراء بعض البسكويت الخاص أو الكعك لها. رأيت إعلاناً عن المخبز الجديد في المدينة. إنهم يصنعون كعكاً وبسكويتاً مميزاً حقاً. يضعونها في صندوق أبيض مع بعض الورق الجميل."}, {"speaker": "Mazen", "en": "That would be a great present, Reem. Where's the bakery? Let's go there now.", "ar": "سيكون ذلك هدية رائعة يا ريم. أين المخبز؟ لنذهب إلى هناك الآن."}, {"speaker": "Reem", "en": "Hmm ... I'm not sure. It's called Cake Creations. They probably have a website.", "ar": "همم... لست متأكدة. يطلق عليه \"إبداعات الكيك\". ربما لديهم موقع إلكتروني."}, {"speaker": "Talia", "en": "OK. If we look at their website, we could get their address and some more information - like what kind of cakes they make and the prices.", "ar": "حسناً. إذا نظرنا إلى موقعهم الإلكتروني، يمكننا الحصول على عنوانهم وبعض المعلومات الإضافية - مثل نوع الكعك الذي يصنعونه والأسعار."}, {"speaker": "Mazen", "en": "Great. I'll look at my phone and find the website.", "ar": "رائع. سأبحث في هاتفي وأجد الموقع الإلكتروني."}, {"speaker": "Reem", "en": "Thanks Mazen.", "ar": "شكراً يا مازن."}]}], "verbs": [{"present": "advertise", "past": "advertised", "pp": "advertised", "ar": "يعلن"}, {"present": "agree", "past": "agreed", "pp": "agreed", "ar": "يوافق"}, {"present": "entertain", "past": "entertained", "pp": "entertained", "ar": "يسلي"}, {"present": "improve", "past": "improved", "pp": "improved", "ar": "يحسن"}, {"present": "inform", "past": "informed", "pp": "informed", "ar": "يخبر - يعلم"}, {"present": "relax", "past": "relaxed", "pp": "relaxed", "ar": "يسترخي"}, {"present": "transform", "past": "transformed", "pp": "transformed", "ar": "يحول"}, {"present": "create", "past": "created", "pp": "created", "ar": "يبدع - يبتكر"}, {"present": "transport", "past": "transported", "pp": "transported", "ar": "ينقل"}], "definitions": [{"word": "suffix", "definition": "The suffix is a letter or group of letters added at the end of a word to make a new word."}], "expressions": [{"en": "make animations", "ar": "يصنع رسوم متحركة"}, {"en": "work with", "ar": "يعمل مع"}, {"en": "good at + [n. /inf. + ing]", "ar": "جيد في"}, {"en": "get into groups", "ar": "ينقسم إلى مجموعات"}, {"en": "researching information", "ar": "البحث عن معلومات"}, {"en": "find out", "ar": "يكتشف"}, {"en": "What do you think about ...?", "ar": "ما رأيك في ...؟"}, {"en": "What about .... + [noun/inf. + ing]?", "ar": "ماذا عن ...؟"}, {"en": "What do you think ...?", "ar": "ماذا تعتقد ...؟"}, {"en": "In my opinion, ....", "ar": "في رأيي ...."}, {"en": "To me, ....", "ar": "بالنسبة لي ...."}, {"en": "I think that ....", "ar": "أعتقد أن ...."}, {"en": "What do you think about reading comic books?", "ar": "ما رأيك في قراءة المجلات المصورة؟"}, {"en": "In my opinion, it is interesting.", "ar": "أعتقد أنها شيقة."}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;

function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
