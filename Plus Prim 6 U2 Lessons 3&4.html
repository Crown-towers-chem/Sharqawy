</style></head><body><div class="container"><div class="lesson-badge">PLUS PRIM 6 • UNIT 2 • Lessons 3&amp;4</div><h1 id="main-title">Explaining your opinion / Story : The Day the Bills broke down</h1><h2 id="sub-title">Unit 2</h2><div class="speech-controls"><div class="control-group"><label>🗣️ اللكنة:</label><select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select></div><div class="control-group"><label>⚡ السرعة:</label><input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1"><span id="speed-value">0.9x</span></div><div class="theme-switcher"><label>🎨</label><span class="theme-dot active" data-theme="blue" style="background:#0569b3" title="Blue"></span><span class="theme-dot" data-theme="yellow" style="background:#d89000" title="Yellow"></span><span class="theme-dot" data-theme="purple" style="background:#9333a8" title="Purple"></span></div></div><button id="play-all-vocab-btn" class="play-btn">▶️ نطق جميع الكلمات والتعبيرات</button><div id="lesson-content"></div></div><button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button><script>
const lessonId="unit2_lessons3_4",data={"lesson_title": "Explaining your opinion / Story : The Day the Bills broke down", "unit_title": "Unit 2", "lessons_label": "Lessons 3&4", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "expressions", "main_points", "texts"], "key_vocabulary": [{"en": "power socket", "ar": "مقبس التيار الكهربي"}, {"en": "extension cable", "ar": "وصلة سلك (كابل)"}, {"en": "interactive whiteboard", "ar": "السبورة التفاعلية"}, {"en": "electricity", "ar": "الكهرباء"}, {"en": "break down", "ar": "يتعطل"}, {"en": "shocked", "ar": "مروع / مصدوم"}, {"en": "terrible", "ar": "سيئ"}, {"en": "power outage = power cut", "ar": "انقطاع التيار الكهربي"}, {"en": "lighting", "ar": "إضاءة"}, {"en": "programme", "ar": "يُبرمج / برنامج"}, {"en": "battery", "ar": "بطارية"}, {"en": "robot", "ar": "إنسان آلي"}, {"en": "chores", "ar": "الأعمال المنزلية"}], "activities": [], "extra_vocabulary": [{"en": "strange", "ar": "غريب"}, {"en": "suddenly", "ar": "فجأة"}, {"en": "useful", "ar": "مفيد"}, {"en": "microwave", "ar": "فرن الميكروويف"}, {"en": "normally", "ar": "بصورة طبيعية"}, {"en": "quietly", "ar": "بهدوء"}, {"en": "transportation", "ar": "النقل والمواصلات"}, {"en": "plan", "ar": "يخطط"}, {"en": "airport", "ar": "مطار"}, {"en": "discussion", "ar": "مناقشة"}, {"en": "electric", "ar": "كهربي"}, {"en": "pants", "ar": "بنطلون"}, {"en": "daughter", "ar": "ابنة"}, {"en": "complicated", "ar": "معقد"}, {"en": "refrigerator", "ar": "ثلاجة"}, {"en": "bus stations", "ar": "محطات أتوبيس"}, {"en": "traveling", "ar": "السفر"}, {"en": "free time", "ar": "وقت الفراغ"}, {"en": "busily", "ar": "بنشاط / بهمة"}, {"en": "fix", "ar": "يصلح"}, {"en": "iron", "ar": "يكوى"}], "main_points": [{"topic": "Ruby's day at school", "word": "power outage", "sentence": "Ruby had a strange day at school because they had a power outage."}, {"topic": "Ruby's day at school", "word": "interactive", "sentence": "They were looking at the interactive whiteboard and suddenly all the information disappeared."}, {"topic": "Ruby's day at school", "word": "power socket", "sentence": "The teacher tried a different power socket."}, {"topic": "Ruby's day at school", "word": "electricity", "sentence": "They sat in a circle and talked about why electricity is important."}, {"topic": "Why electricity is important in our lives", "word": "free time", "sentence": "We need electricity to use laptops, play video games or watch TV in our free time."}, {"topic": "Why electricity is important in our lives", "word": "light", "sentence": "Electricity is most important for lighting as we need lights in the evening."}, {"topic": "Why electricity is important in our lives", "word": "blender - electricity", "sentence": "We can't use our electric kettle, blender and refrigerator without electricity."}, {"topic": "Why electricity is important in our lives", "word": "stations - electricity", "sentence": "Bus stations and airports all use electricity."}], "texts": [{"type": "dialogue", "title": "Ruby's day at school", "paragraphs": [], "dialogue": [{"speaker": "Mom", "en": "Hi Ruby, how was your day?", "ar": "مرحباً روبي، كيف كان يومك؟"}, {"speaker": "Ruby", "en": "Oh, hi Mom! It was a strange day, actually. We had a power outage!", "ar": "أوه، مرحباً أمي! لقد كان يوماً غريباً في الواقع. لقد حدث انقطاع في التيار الكهربائي!"}, {"speaker": "Ruby", "en": "My class and I were looking at the interactive whiteboard, when suddenly all the information disappeared.", "ar": "كنت أنا وفصلي ننظر إلى السبورة التفاعلية، عندما اختفت فجأة كل المعلومات."}, {"speaker": "Mom", "en": "Really? That is strange! What did Miss Anderson do?", "ar": "حقاً؟ هذا غريب! ماذا فعلت الآنسة أندرسون؟"}, {"speaker": "Ruby", "en": "Well, first she got an extension cable and tried a different power socket, but that wasn't working either.", "ar": "حسناً، أولاً أحضرت وصلة سلك وجربت مقبس طاقة مختلفاً، لكن ذلك لم ينجح أيضاً."}, {"speaker": "Mom", "en": "Oh no! So, there was no electricity! What happened?", "ar": "أوه لا! إذاً، لم يكن هناك كهرباء! ماذا حدث؟"}, {"speaker": "Ruby", "en": "We couldn't do the lesson Miss Anderson planned.", "ar": "لم نتمكن من أداء الدرس الذي خططت له الآنسة أندرسون."}, {"speaker": "Ruby", "en": "So she asked us all to sit in a circle and talk about why electricity is important in our lives.", "ar": "لذا طلبت منا جميعاً الجلوس في دائرة والتحدث عن سبب أهمية الكهرباء في حياتنا."}, {"speaker": "Mom", "en": "Let me guess - everyone thought it was important for computer games!", "ar": "دعيني أحزر - اعتقد الجميع أنها مهمة لألعاب الكمبيوتر!"}, {"speaker": "Ruby", "en": "Ha ha! Actually, no. We all had lots of different ideas. It was a really interesting discussion.", "ar": "ها ها! في الواقع، لا. كان لدينا جميعاً الكثير من الأفكار المختلفة. لقد كانت مناقشة ممتعة حقاً."}]}, {"type": "reading", "title": "Whose opinion do you agree with most ?", "paragraphs": [{"heading": "Morgan", "en": "In my opinion, electricity is most useful in our free time. I love my laptop!", "ar": "في رأيي، الكهرباء هي الأكثر فائدة في وقت فراغنا. أنا أحب الكمبيوتر المحمول الخاص بي!"}, {"heading": "Morgan", "en": "I do my homework on it, then I play video games with my brother. I love to watch television with my grandma in the evening, too.", "ar": "أقوم بأداء واجبي المنزلي عليه، ثم ألعب ألعاب الفيديو مع أخي. أحب مشاهدة التلفزيون مع جدتي في المساء أيضاً."}, {"heading": "Tom", "en": "I know what you mean, but I think electricity is most important for lighting.", "ar": "أنا أفهم ما تقصده، لكني أعتقد أن الكهرباء هي الأكثر أهمية للإضاءة."}, {"heading": "Tom", "en": "I don't like the dark, and we need lights in the evening.", "ar": "أنا لا أحب الظلام، ونحن بحاجة إلى الأضواء في المساء."}, {"heading": "Sara", "en": "I don't agree. I think it's more important in the kitchen.", "ar": "أنا لا أتفق. أعتقد أنها أكثر أهمية في المطبخ."}, {"heading": "Sara", "en": "We couldn't use our electric kettle without electricity, or our blender - or our refrigerator!", "ar": "لا يمكننا استخدام غلايتنا الكهربائية بدون كهرباء، أو خلاطنا - أو ثلاجتنا!"}, {"heading": "Lewis", "en": "What about transportation? Some people have electric cars.", "ar": "ماذا عن وسائل النقل؟ بعض الناس لديهم سيارات كهربائية."}, {"heading": "Lewis", "en": "And bus stations and airports all need electricity, too.", "ar": "ومحطات الحافلات والمطارات كلها تحتاج إلى الكهرباء أيضاً."}], "dialogue": []}, {"type": "reading", "title": "The Day the Bills broke down !", "paragraphs": [{"heading": "Introduction", "en": "It's the Year 2089, and life on Earth is sweet! Every family has a Bill robot.", "ar": "إنه عام 2089، والحياة على الأرض حلوة! كل عائلة لديها روبوت بيل."}, {"heading": "Introduction", "en": "The Bill robots do all the chores. However, a year ago, something terrible happened.", "ar": "روبوتات بيل تقوم بجميع الأعمال المنزلية. ومع ذلك، قبل عام، حدث شيء فظيع."}, {"heading": "The Breakdown", "en": "The day started normally. In Australia, some Bills were ironing clothes.", "ar": "بدأ اليوم بشكل طبيعي. في أستراليا، كان بعض روبوتات بيل يكوي الملابس."}, {"heading": "The Breakdown", "en": "In Italy, some Bills were quietly making milkshakes, others were fixing cars. In Canada, the Bills were making sandwiches.", "ar": "في إيطاليا، كان بعض روبوتات بيل يصنعون مخفوق الحليب بهدوء، والبعض الآخر كان يصلح السيارات. في كندا، كان روبوتات بيل يصنعون السندويشات."}, {"heading": "The Breakdown", "en": "But then, all over the world, the robots suddenly broke down. They fell to the ground, and their lights went out.", "ar": "ولكن بعد ذلك، في جميع أنحاء العالم، تعطلت الروبوتات فجأة. سقطوا على الأرض، وانطفأت أضواؤهم."}, {"heading": "A Shocked Family", "en": "One shocked family in Toronto tried to wake up their robot. \"Bill!\" said Mom, \"What happened? We need our sandwiches!\"", "ar": "حاولت إحدى العائلات المصدومة في تورنتو إيقاظ الروبوت الخاص بها. قالت الأم: \"بيل! ماذا حدث؟ نحن بحاجة إلى سندويشاتنا!\""}, {"heading": "A Shocked Family", "en": "Bill said nothing. Cody, the young son, started crying, \"Who is going to iron my school pants?\"", "ar": "لم يقل بيل شيئاً. بدأ كودي، الابن الصغير، بالبكاء: \"من سيقوم بكي بنطال مدرستي؟\""}, {"heading": "A Shocked Family", "en": "\"I programmed Bill to fix my car and change the battery. What am I going to do?\" Dad said.", "ar": "قال الأب: \"لقد برمجت بيل لإصلاح سيارتي وتغيير البطارية. ماذا سأفعل؟\""}, {"heading": "Learning to Cope", "en": "Everyone looked worried, but the daughter, Laura, said, \"We'll go on the internet and learn how to do the chores ourselves, like Grandad used to do.\"", "ar": "بدا الجميع قلقين، لكن الابنة، لورا، قالت: \"سوف ندخل على الإنترنت ونتعلم كيفية القيام بالأعمال المنزلية بأنفسنا، كما كان يفعل الجد.\""}, {"heading": "Learning to Cope", "en": "The family started watching videos. They learned how to use a blender and had milkshakes.", "ar": "بدأت العائلة في مشاهدة مقاطع الفيديو. تعلموا كيفية استخدام الخلاط وتناولوا مخفوق الحليب."}, {"heading": "Learning to Cope", "en": "Mom learned how to use the microwave to heat some food. Dad tried to learn how to fix his car, but it was too difficult.", "ar": "تعلمت الأم كيفية استخدام الميكروويف لتسخين بعض الطعام. حاول الأب أن يتعلم كيفية إصلاح سيارته، لكن الأمر كان صعباً للغاية."}, {"heading": "Learning to Cope", "en": "And he certainly didn't understand how to change the car battery - that was very complicated. Cody quickly learned how to iron his own clothes!", "ar": "وبالتأكيد لم يفهم كيفية تغيير بطارية السيارة - كان ذلك معقداً للغاية. تعلم كودي بسرعة كيفية كي ملابسه الخاصة!"}, {"heading": "Resolution", "en": "Luckily, a computer engineer quickly solved the problem, and all the Bills started working again.", "ar": "لحسن الحظ، قام مهندس كمبيوتر بحل المشكلة بسرعة، وبدأت جميع روبوتات بيل في العمل مرة أخرى."}, {"heading": "Resolution", "en": "The Bills in Canada were busily cleaning cars. Life was normal again.", "ar": "كانت روبوتات بيل في كندا تنظف السيارات بنشاط. عادت الحياة طبيعية مرة أخرى."}, {"heading": "Resolution", "en": "However, the humans know what to do if the Bills break down again.", "ar": "ومع ذلك، يعرف البشر ماذا يفعلون إذا تعطلت روبوتات بيل مرة أخرى."}], "dialogue": []}], "verbs": [{"present": "mean", "past": "meant", "pp": "meant", "ar": "يعني / يقصد"}, {"present": "teach", "past": "taught", "pp": "taught", "ar": "يُدرس"}, {"present": "fall", "past": "fell", "pp": "fallen", "ar": "يقع - يسقط"}, {"present": "hit", "past": "hit", "pp": "hit", "ar": "يصدم"}], "definitions": [], "expressions": [{"en": "I know what you mean", "ar": "أفهم ما تقصده"}, {"en": "In my opinion", "ar": "في رأيي"}, {"en": "learn how to", "ar": "يتعلم كيف يقوم بـ"}, {"en": "I don't agree .", "ar": "لا أتفق معك."}, {"en": "fill... with", "ar": "يملأ .... بـ"}, {"en": "do the chores", "ar": "يقوم بأداء الأعمال المنزلية"}, {"en": "sit in a circle", "ar": "يجلس في دائرة"}, {"en": "look for information", "ar": "يبحث عن معلومات"}, {"en": "go on the internet", "ar": "يتصل بـالإنترنت"}, {"en": "at midnight", "ar": "في منتصف الليل"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
