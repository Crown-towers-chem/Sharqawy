    ["take too long to", "يستغرق وقتاً طويلاً لـ"],
    ["the hardest part of", "جزء الأصعب من"],
    ["interested in", "مهتم بـ"],
    ["test with", "يجري اختبار على"],
    ["designed for", "مصمم من أجل"]
];

// ===================== دوال HTML المساعدة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

// ===================== بناء الواجهة =====================
function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, storyData) {
        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:10px;">${title}</div>
            ${storyData.map((s,i) => {
                const id = `secStory_${title.replace(/\s/g,'')}_${i}`;
                let enText = s.en;
                let speaker = '';
                let dialogueText = enText;

                const colonIndex = enText.indexOf(': ');
                if (colonIndex > 0) {
                    speaker = enText.substring(0, colonIndex);
                    dialogueText = enText.substring(colonIndex + 2);
                }

                const emoji = speaker ? '💬' : '📖';
                const wordHtml = makeWordSpans(dialogueText);
                
                let speakerHtml = '';
                if (speaker) {
                    speakerHtml = `<span class="speaker-label">${emoji} ${speaker}</span> `;
                }

                return `<div class="sentence" id="${id}" data-speak="${s.en}" onclick="playOne('${id}')">
                    ${speakerHtml} ${wordHtml}
                </div> `;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    const sections = [];

    // 1. Key Vocabulary (Lessons 1 & 2)
    if (typeof keyVocabL1L2 !== 'undefined' && keyVocabL1L2.length > 0) {
        sections.push({ title:"🔑 Key Vocabulary (Lessons 1 & 2)", id:"secKeyL1L2", content: `<div class="info-box"><div class="info-title">Key Vocabulary (Lessons 1 & 2)</div><div class="vocab">${makePills(keyVocabL1L2, "secKeyL1L2")}</div></div>` });
    }

    // 2. Vocabulary on Reading (Lesson 1)
    if (typeof l1Vocab !== 'undefined' && l1Vocab.length > 0) {
        sections.push({ title:"📚 Vocabulary on Reading (Lesson 1)", id:"secL1", content: `<div class="info-box"><div class="info-title">Vocabulary on Reading (Lesson 1)</div><div class="vocab">${makePills(l1Vocab, "secL1")}</div></div>` });
    }

    // 3. Vocabulary on Reading (Lesson 2)
    if (typeof l2Vocab !== 'undefined' && l2Vocab.length > 0) {
        sections.push({ title:"📚 Vocabulary on Reading (Lesson 2)", id:"secL2", content: `<div class="info-box"><div class="info-title">Vocabulary on Reading (Lesson 2)</div><div class="vocab">${makePills(l2Vocab, "secL2")}</div></div>` });
    }

    // 4. Definitions (Lessons 1 & 2)
    if (typeof defsData !== 'undefined' && defsData.length > 0) {
        sections.push({ title:"📝 Definitions (Lessons 1 & 2)", id:"secDefs", content: `<div class="rules-grid">${defsData.map((d,i) => {
            const speakText = cleanForSpeech(d.word) + " | " + d.def;
            return makeRuleItem('📖', 'secDefs', i, speakText, d.def, d.word);
        }).join('')}</div>` });
    }

    // 5. Collocations (Lessons 1 & 2)
    if (typeof collocationsData !== 'undefined' && collocationsData.length > 0) {
        sections.push({ title:"🤝 Collocations (Lessons 1 & 2)", id:"secCollocations", content: `<div class="rules-grid">${collocationsData.map((c,i) => makeRuleItem('🔗', 'secCollocations', i, c[0], c[1], c[0])).join('')}</div>` });
    }

    // 6. Synonyms and Antonyms (Lessons 1 & 2)
    if (typeof synData !== 'undefined' && synData.length > 0) {
        sections.push({ title:"🔄 Synonyms (Lessons 1 & 2)", id:"secSyn", content: `<div class="rules-grid">${synData.map((s,i) => makeRuleItem('↔️', 'secSyn', i, s.word + " | " + s.syn, s.syn, s.word)).join('')}</div>` });
    }

    if (typeof antData !== 'undefined' && antData.length > 0) {
        sections.push({ title:"🚫 Antonyms (Lessons 1 & 2)", id:"secAnt", content: `<div class="rules-grid">${antData.map((a,i) => makeRuleItem('🛑', 'secAnt', i, a.word + " | " + a.ant, a.ant, a.word)).join('')}</div>` });
    }

    // 7. Prefixes and Suffixes (Lessons 1 & 2)
    if (typeof morphData !== 'undefined' && morphData.length > 0) {
        sections.push({ title:"🔚 Prefixes and Suffixes (Lessons 1 & 2)", id:"secMorph", content: `<div class="rules-grid">${morphData.map((p,i) => {
            const speakText = cleanForSpeech(p.word) + " | " + p.affix;
            return makeRuleItem('🔤', 'secMorph', i, speakText, p.affix + " " + p.func, p.word);
        }).join('')}</div>` });
    }

    // 8. Conjugation of Irregular Verbs (Lessons 1 & 2)
    if (typeof conjData !== 'undefined' && conjData.length > 0) {
        sections.push({ title:"⏳ Conjugation of Irregular Verbs (Lessons 1 & 2)", id:"secConj", content: `<div class="rules-grid">${conjData.map((c,i) => {
            const speakText = c.present + " | " + c.past + " | " + c.pp;
            return makeRuleItem('🕒', 'secConj', i, speakText, 'مضارع / ماضي / تصريف ثالث', c.present + " → " + c.past + " → " + c.pp);
        }).join('')}</div>` });
    }

    // 9. Reading Text (Lesson 1)
    if (typeof readingTextL1 !== 'undefined' && readingTextL1.length > 0) {
        sections.push({ title:"📖 Reading Text (Lesson 1)", id:"secReadL1", content: makeStorySection("Think Like a Designer", readingTextL1) });
    }

    // 10. Listening Text (Lesson 2)
    if (typeof listeningTextL2 !== 'undefined' && listeningTextL2.length > 0) {
        sections.push({ title:"🎧 Listening Text (Lesson 2)", id:"secListenL2", content: makeStorySection("Design Sprint (Sarah's Talk)", listeningTextL2) });
    }

    // 11. Important Expressions & Prepositions (Lessons 1 & 2)
    if (typeof expPrepData !== 'undefined' && expPrepData.length > 0) {
        sections.push({ title:"💬 Important Expressions & Prepositions (Lessons 1 & 2)", id:"secExpPrep", content: `<div class="rules-grid">${expPrepData.map((e,i) => makeRuleItem('💡', 'secExpPrep', i, e[0], e[1], e[0])).join('')}</div>` });
    }

    let html = '';
    sections.forEach(sec => {
        html += `<div class="section-block" id="${sec.id}">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-body">
                ${playBar(sec.id)}
                ${sec.content}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// ===================== نظام الصوت ومحرك النطق =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}

function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    const allVoices = voices;
    if (!allVoices.length) return;

    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');

    const usVoice = allVoices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = allVoices.find(v => isLangMatch(v.lang, 'en-GB'));

    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 American', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 British', uri: gbVoice.voiceURI });
    if (!options.length) {
        note.textContent = '⚠️ No US/UK voice found.';
        const anyEn = allVoices.filter(v => v.lang.startsWith('en')).slice(0,2);
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    } else {
        note.textContent = '';
    }

    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) vs.value = savedURI;
}

document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || null;
}

window._q = []; 
window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}

function showFab(show) {
    if (show) fabPause.classList.add('show');
    else fabPause.classList.remove('show');
}

function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        fabPause.innerHTML = '⏸️';
    } else if (window.speechSynthesis.paused) {
        fabPause.innerHTML = '▶️';
    } else {
        fabPause.innerHTML = '⏯️';
    }
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights();
        showFab(false);
        return;
    }
    const item = window._q[window._qi];
    
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }

    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => {
        showFab(true);
        updateFabIcon();
    };

    u.onend = function() {
        window._qi++;
        playQueue();
    };

    u.onerror = function(e) {
        console.warn('Speech error', e);
        window._qi++;
        playQueue();
    };

    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => {
        const trimmed = p.trim();
        if (trimmed) {
            window._q.push({id: id, text: trimmed});
        }
    });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        updateFabIcon();
    }
}

function stopAll() {
    window._q = []; 
    window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
    showFab(false);
}

function toggleFabPause() {
    pauseAll();
}

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
