ture", "sentence": "Tall Tree and the Eye is a famous sculpture."}, {"topic": "Anish Kapoor's sculptures", "word": "Cloud Gate", "sentence": "Cloud Gate in Chicago is one of Kapoor's sculptures."}, {"topic": "Anish Kapoor's sculptures", "word": "reflect", "sentence": "It's made of metal and is like a huge mirror, which reflects the sky."}, {"topic": "Anish Kapoor's sculptures", "word": "popular", "sentence": "Cloud Gate is a very popular sight to visit."}], "texts": [{"type": "reading", "title": "A Night of Colors", "paragraphs": [{"heading": "", "en": "We stand together in the cold, black night, The sky is dark and far away.", "ar": "نحن نقف معًا في الليلة السوداء الباردة، السماء مظلمة وبعيدة."}, {"heading": "", "en": "Everything is quiet and still, until - BANG!", "ar": "كل شيء هادئ وساكن، حتى - بوم!"}, {"heading": "", "en": "The lights make the sky as bright as day.", "ar": "الأضواء تجعل السماء مشرقة مثل النهار."}, {"heading": "", "en": "Rockets shoot up into the air, We shout and cheer, watching them fly.", "ar": "تنطلق الصواريخ في الهواء، نحن نصرخ ونهتف، ونشاهدهم يطيرون."}, {"heading": "", "en": "Colors burn brilliantly against the black, We see them dance happily through the sky.", "ar": "تحترق الألوان بتألق مقابل السواد، نراهم يرقصون بسعادة عبر السماء."}, {"heading": "", "en": "The sound fills my ears, as each rocket takes off, Exploding noisily with flashes of light.", "ar": "يملأ الصوت أذني، بينما ينطلق كل صاروخ، وينفجر بصخب مع ومضات من الضوء."}, {"heading": "", "en": "Beads of red, yellow, silver, and gold, Are beautiful jewels in the black night.", "ar": "خرز من الأحمر والأصفر والفضي والذهبي، هي جواهر جميلة في الليلة السوداء."}, {"heading": "", "en": "With blasts so loud and rockets up high, A colorful fire against the stars.", "ar": "مع انفجارات عالية جداً وصواريخ في الأعالي، نار ملونة مقابل النجوم."}, {"heading": "", "en": "The sky shines brightly with light and color, We hold our breath, looking out far.", "ar": "تشرق السماء ببراعة بالضوء واللون، نحن نحبس أنفاسنا، وننظر بعيداً."}, {"heading": "Tip", "en": "In a poem, the poet sometimes uses words or something that is not real to help the reader imagine the way something real looks.", "ar": "في القصيدة، يستخدم الشاعر أحيانًا كلمات أو أشياء غير حقيقية ليساعد القارئ على تخيل شكل شيء حقيقي."}, {"heading": "Tip", "en": "For example, the fireworks in the sky are not really jewels, but they are so beautiful that they look like jewels.", "ar": "على سبيل المثال، الألعاب النارية في السماء ليست جواهر حقيقية لكنها من شدة جمالها تبدو كالجواهر."}], "dialogue": []}, {"type": "reading", "title": "Anish Kapoor's sculptures", "paragraphs": [{"heading": "", "en": "Anish Kapoor is a sculptor. He was born in India in 1954, and moved to London, UK, to study art in 1973.", "ar": "أنيش كابور هو نحات. ولد في الهند عام 1954، وانتقل إلى لندن، المملكة المتحدة، لدراسة الفن عام 1973."}, {"heading": "", "en": "He likes to use new and interesting shapes and materials. Kapoor makes large pieces of art for public places all over the world.", "ar": "يحب استخدام أشكال ومواد جديدة ومثيرة للاهتمام. يصنع كابور قطعاً فنية كبيرة للأماكن العامة في جميع أنحاء العالم."}, {"heading": "", "en": "Tall Tree and the Eye is a famous sculpture by Kapoor. You can see it outside the Guggenheim Museum in Bilbao, Spain.", "ar": "شجرة طويلة والعين هو تمثال منحوت مشهور لكابور. يمكنك رؤيته خارج متحف غوغنهايم في بلباو، إسبانيا."}, {"heading": "", "en": "This sculpture is about 13 meters tall. It is made of 73 metal balls.", "ar": "يبلغ طول هذا التمثال حوالي 13 متراً. وهو مصنوع من 73 كرة معدنية."}, {"heading": "", "en": "The metal is very shiny, so when you look at Tall Tree and the Eye, you can see your own face many times. The balls look like bubbles which are floating!", "ar": "المعدن لامع جداً، لذا عندما تنظر إلى \"شجرة طويلة والعين\"، يمكنك رؤية وجهك عدة مرات. تبدو الكرات مثل الفقاعات التي تطفو!"}, {"heading": "", "en": "Kapoor is a great artist. He understands math and how materials work. This means he can make sculptures that will stay in place for a long time.", "ar": "كابور فنان عظيم. هو يفهم الرياضيات وكيفية عمل المواد. وهذا يعني أنه يستطيع صنع منحوتات تبقى في مكانها لفترة طويلة."}, {"heading": "", "en": "For example, in Tall Tree and the Eye, Kapoor uses metal because it is a strong material. It's very good for outdoor sculptures because bad weather doesn't damage it.", "ar": "على سبيل المثال، في \"شجرة طويلة والعين\"، يستخدم كابور المعدن لأنه مادة قوية. إنه جيد جداً للمنحوتات الخارجية لأن الطقس السيئ لا يتلفه."}, {"heading": "", "en": "Over the years, Kapoor has made many other famous sculptures. Another famous Kapoor's sculpture is Cloud Gate, in Chicago, USA.", "ar": "على مر السنين، صنع كابور العديد من المنحوتات الشهيرة الأخرى. منحوتة أخرى مشهورة لكابور هي \"بوابة السحاب\"، في شيكاغو، الولايات المتحدة الأمريكية."}, {"heading": "", "en": "Cloud Gate is very high - people can walk under it! It is made of metal and is like a huge mirror, which reflects the sky, buildings, and the people around it.", "ar": "بوابة السحاب عالية جداً - يمكن للناس المشي تحتها! وهي مصنوعة من المعدن وتشبه مرآة ضخمة تعكس السماء والمباني والأشخاص المحيطين بها."}, {"heading": "", "en": "It is a very popular sight to visit in Chicago.", "ar": "إنه معلم مشهور جداً للزيارة في شيكاغو."}], "dialogue": []}, {"type": "reading", "title": "The Sibelius monument", "paragraphs": [{"heading": "", "en": "The Sibelius monument was built in 1967 to celebrate the famous musician Jean Sibelius, who died in 1957.", "ar": "تم بناء نصب سيبيليوس التذكاري في عام 1967 للاحتفال بالموسيقار الشهير جان سيبيليوس، الذي توفي في عام 1957."}, {"heading": "", "en": "Sibelius was from Finland, a country in northern Europe. Sibelius's work is still popular today and played at concerts and in theaters all around the world.", "ar": "كان سيبيليوس من فنلندا، وهي دولة في شمال أوروبا. لا يزال عمل سيبيليوس شائعاً اليوم ويُعزف في الحفلات الموسيقية والمسارح في جميع أنحاء العالم."}, {"heading": "", "en": "The sculpture was created by the female artist Eila Hiltunen, who was also from Finland. The sculpture has 600 steel pipes of different sizes in an irregular shape.", "ar": "تم إنشاء التمثال من قبل الفنانة إيلا هيلتونين، التي كانت أيضاً من فنلندا. يحتوي التمثال على 600 أنبوب فولاذي بأحجام مختلفة في شكل غير منتظم."}, {"heading": "", "en": "It is 8.5 meters high and 10.5 meters wide. Hiltunen wanted the sculpture to look like the way Sibelius's music sounds.", "ar": "يبلغ ارتفاعه 8.5 متر وعرضه 10.5 متر. أرادت هيلتونين أن يبدو التمثال مثل الطريقة التي تبدو بها موسيقى سيبيليوس."}, {"heading": "", "en": "You can see this sculpture in the Sibelius Park, in Helsinki, the capital city of Finland.", "ar": "يمكنك رؤية هذا التمثال في منتزه سيبيليوس، في هلسنكي، عاصمة فنلندا."}], "dialogue": []}, {"type": "reading", "title": "Mahmoud Mukhtar", "paragraphs": [{"heading": "", "en": "Mahmoud Mukhtar was an Egyptian sculptor in the early 20th century.", "ar": "كان محمود مختار نحاتاً مصرياً في أوائل القرن العشرين."}, {"heading": "", "en": "One of his most famous sculptures is Nahdet Misr, which was first displayed in 1928.", "ar": "من أشهر تماثيله تمثال نهضة مصر، الذي عُرض لأول مرة عام 1928."}], "dialogue": []}], "verbs": [{"present": "shine", "past": "shone", "pp": "shone", "ar": "تشرق - تبرق"}, {"present": "understand", "past": "understood", "pp": "understood", "ar": "يفهم"}], "definitions": [{"word": "verse", "definition": "a part of the poem"}, {"word": "rhyme", "definition": "when two words sound the same at the end of the word"}, {"word": "bubble", "definition": "a liquid ball full of air"}, {"word": "reflect", "definition": "when a mirror shows an image"}, {"word": "material", "definition": "what something is made from , for example , gold , clay , wood"}, {"word": "sculptor", "definition": "a person who makes sculptures"}], "expressions": [{"en": "as bright as day", "ar": "مشرقة مثل النهار"}, {"en": "shoot up into the air", "ar": "ينطلق في الهواء"}, {"en": "take off", "ar": "يقلع / ينطلق [مثل الصاروخ]"}, {"en": function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}

function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
