const lessonId="unit4_lessons5_6",data={"lesson_title": "Language & Literature Corner", "unit_title": "Unit 4", "lessons_label": "Lessons 5 & 6", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "definitions", "expressions", "main_points", "texts"], "key_vocabulary": [{"en": "herd", "ar": "قطيع"}, {"en": "leader", "ar": "قائد"}, {"en": "route", "ar": "مسار / طريق"}, {"en": "hunter", "ar": "صياد"}, {"en": "roar", "ar": "يزأر (يصدر صوتاً عالياً)"}, {"en": "praise", "ar": "يمدح"}, {"en": "net", "ar": "شبكة"}, {"en": "glider", "ar": "طائرة شراعية"}, {"en": "crack", "ar": "يتشقق / يتصدع"}, {"en": "air traffic control", "ar": "مراقبة الحركة الجوية"}, {"en": "hero", "ar": "بطل"}, {"en": "co-pilot", "ar": "مساعد طيار"}], "activities": [], "extra_vocabulary": [{"en": "needs", "ar": "احتياجات"}, {"en": "empty", "ar": "فارغ"}, {"en": "engines", "ar": "مُحركات"}, {"en": "flying", "ar": "طيران"}, {"en": "shocked", "ar": "مصدوم"}, {"en": "injured", "ar": "مُصاب"}, {"en": "passengers", "ar": "ركاب"}, {"en": "powerful", "ar": "قوى"}, {"en": "power", "ar": "قوة / طاقة"}, {"en": "land", "ar": "يهبط"}, {"en": "flock", "ar": "سرب / مجموعة"}, {"en": "enormous", "ar": "ضخم جدًا"}, {"en": "rescue", "ar": "ينقذ"}], "main_points": [{"topic": "The elephants and the mice", "word": "near a lake", "sentence": "A herd of elephants and hundreds of mice lived happily together."}, {"topic": "The elephants and the mice", "word": "route", "sentence": "The elephants changed their route to the lake and hurt many mice."}, {"topic": "The elephants and the mice", "word": "got caught", "sentence": "A few weeks later, the elephants got caught in nets left by hunters and could not move."}, {"topic": "The elephants and the mice", "word": "mice - net", "sentence": "The mice bit through the nets until the elephants could get out."}, {"topic": "The elephants and the mice", "word": "difference", "sentence": "The elephant queen thanked the mouse king and learned that everyone can make a difference."}, {"topic": "The Hero of the Hudson", "word": "land", "sentence": "He decided to land on the Hudson River."}, {"topic": "The Hero of the Hudson", "word": "passengers", "sentence": "Sully told the passengers to climb onto the plane's wings."}, {"topic": "The Hero of the Hudson", "word": "boats - rescue", "sentence": "Boats arrived to rescue the passengers."}, {"topic": "The Hero of the Hudson", "word": "hero - water", "sentence": "Sully was a hero for landing the plane on water."}, {"topic": "The Hero of the Hudson", "word": "praised-hero", "sentence": "Sully was praised for staying on the plane until every passenger was safe."}], "texts": [{"type": "reading", "title": "The elephants and the mice", "paragraphs": [{"heading": "The elephants and the mice", "en": "Many years ago, a herd of elephants lived in India.", "ar": "منذ سنوات عديدة، عاش قطيع من الفيلة في الهند."}, {"heading": "The elephants and the mice", "en": "Their leader, the queen, was the kindest and best of the elephants.", "ar": "كانت قائدتهم، الملكة، ألطف وأفضل الفيلة."}, {"heading": "The elephants and the mice", "en": "During the day, the elephants liked to swim in the lake.", "ar": "خلال النهار، كانت الفيلة تحب السباحة في البحيرة."}, {"heading": "The elephants and the mice", "en": "Hundreds of mice lived in an old, empty village near the lake.", "ar": "عاشت مئات الفئران في قرية قديمة وفارغة بالقرب من البحيرة."}, {"heading": "The elephants and the mice", "en": "Their leader, the king, was kind.", "ar": "كان قائدهم، الملك، طيباً."}, {"heading": "The elephants and the mice", "en": "The elephants and the mice lived happily together.", "ar": "عاشت الفيلة والفئران معاً بسعادة."}, {"heading": "The elephants and the mice", "en": "But, one day, the elephants changed their route to the lake.", "ar": "لكن، في أحد الأيام، غيرت الفيلة طريقها إلى البحيرة."}, {"heading": "The elephants and the mice", "en": "Now they walked on a path too close to the mice.", "ar": "الآن كانوا يمشون في ممر قريب جداً من الفئران."}, {"heading": "The elephants and the mice", "en": "Many elephants didn't see the mice.", "ar": "كثير من الفيلة لم يروا الفئران."}, {"heading": "The elephants and the mice", "en": "They walked on them and hurt them.", "ar": "مشوا عليهم وآذوهم."}, {"heading": "The elephants and the mice", "en": "The mouse king decided to meet the elephant queen.", "ar": "قرر ملك الفئران مقابلة ملكة الفيلة."}, {"heading": "The elephants and the mice", "en": "When he explained the problem to her, she was shocked and agreed to use a different route.", "ar": "عندما شرح لها المشكلة، صُدمت ووافقت على استخدام طريق مختلف."}, {"heading": "The elephants and the mice", "en": "\"Thank you for respecting our needs,\" said the mouse king.", "ar": "\"شكراً لكِ على احترام احتياجاتنا،\" قال ملك الفئران."}, {"heading": "The elephants and the mice", "en": "\"One day, I hope we can help you if you need it.\"", "ar": "\"يوماً ما، آمل أن نتمكن من مساعدتكِ إذا احتجتِ إلى ذلك.\""}, {"heading": "The elephants and the mice", "en": "The elephant queen smiled, but thought, \"Why would powerful animals like elephants need help from little mice?\"", "ar": "ابتسمت ملكة الفيلة، لكنها فكرت، \"لماذا تحتاج حيوانات قوية مثل الفيلة إلى مساعدة من فئران صغيرة؟\""}, {"heading": "The elephants and the mice", "en": "A few weeks later, some hunters left nets for the elephants.", "ar": "بعد بضعة أسابيع، ترك بعض الصيادين شباكاً للفيلة."}, {"heading": "The elephants and the mice", "en": "The next day, when the elephants went to the lake, they got caught in the nets.", "ar": "في اليوم التالي، عندما ذهبت الفيلة إلى البحيرة، علقت في الشباك."}, {"heading": "The elephants and the mice", "en": "They couldn't move, and they roared loudly!", "ar": "لم يتمكنوا من الحركة، وزأروا بصوت عالٍ!"}, {"heading": "The elephants and the mice", "en": "The mice heard the noise and came running.", "ar": "سمعت الفئران الضوضاء وجاءت راكضة."}, {"heading": "The elephants and the mice", "en": "They bit through the nets until the elephants could get out!", "ar": "قضموا الشباك حتى تمكنت الفيلة من الخروج!"}, {"heading": "The elephants and the mice", "en": "The next day, the elephant queen visited the mouse king and said, \"Thank you so much!\"", "ar": "في اليوم التالي، زارت ملكة الفيلة ملك الفئران وقالت، \"شكراً جزيلاً لك!\""}, {"heading": "The elephants and the mice", "en": "\"You saved our elephants from the hunters!\"", "ar": "\"لقد أنقذت فيلتنا من الصيادين!\""}, {"heading": "The elephants and the mice", "en": "\"You showed us that everyone, from the biggest to the smallest, can make a difference.\"", "ar": "\"لقد أظهرت لنا أن الجميع، من الأكبر إلى الأصغر، يمكنهم إحداث فرق.\""}, {"heading": "The elephants and the mice", "en": "The mouse king was the happiest and proudest mouse in the village.", "ar": "كان ملك الفئران هو الفأر الأكثر سعادة وفخراً في القرية."}], "dialogue": []}, {"type": "reading", "title": "The Hero of the Hudson", "paragraphs": [{"heading": "The Hero of the Hudson", "en": "Flying is probably the safest way to travel.", "ar": "ربما يكون الطيران هو الطريقة الأكثر أماناً للسفر."}, {"heading": "The Hero of the Hudson", "en": "But what happens when something goes wrong?", "ar": "ولكن ماذا يحدث عندما يحدث خطأ ما؟"}, {"heading": "The Hero of the Hudson", "en": "In 2009, a plane took off from LaGuardia airport in New York on a cold January afternoon.", "ar": "في عام 2009، أقلعت طائرة من مطار لاغوارديا في نيويورك في بعد ظهر يوم بارد من شهر يناير."}, {"heading": "The Hero of the Hudson", "en": "Just three minutes later, a flock of large birds hit both engines.", "ar": "بعد ثلاث دقائق فقط، اصطدم سرب من الطيور الكبيرة بكلا المحركين."}, {"heading": "The Hero of the Hudson", "en": "The engines stopped.", "ar": "توقفت المحركات."}, {"heading": "The Hero of the Hudson", "en": "At the time, the co-pilot, Jeff Skiles, was controlling the plane.", "ar": "في ذلك الوقت، كان مساعد الطيار، جيف سكايلز، يتحكم في الطائرة."}, {"heading": "The Hero of the Hudson", "en": "He had only just finished training to fly this kind of plane.", "ar": "كان قد انتهى للتو من التدريب على قيادة هذا النوع من الطائرات."}, {"heading": "The Hero of the Hudson", "en": "The main pilot, Sully Sullenberger, tried to restart the engines.", "ar": "حاول الطيار الرئيسي، سولي سولينبرجر، إعادة تشغيل المحركات."}, {"heading": "The Hero of the Hudson", "en": "When he couldn't do this, he took control of the plane.", "ar": "عندما لم يستطع فعل ذلك، تولى السيطرة على الطائرة."}, {"heading": "The Hero of the Hudson", "en": "Sully called air traffic control and told them that he wanted to return to LaGuardia airport.", "ar": "اتصل سولي بمراقبة الحركة الجوية وأخبرهم أنه يريد العودة إلى مطار لاغوارديا."}, {"heading": "The Hero of the Hudson", "en": "Then he decided that the engines did not have enough power to turn the plane around.", "ar": "ثم قرر أن المحركات ليس لديها طاقة كافية لتدوير الطائرة."}, {"heading": "The Hero of the Hudson", "en": "Air traffic control told Sully to fly the plane to a nearer airport.", "ar": "أخبرت مراقبة الحركة الجوية سولي أن يطير بالطائرة إلى مطار أقرب."}, {"heading": "The Hero of the Hudson", "en": "They were very surprised by his reply: \"We're going to be in the Hudson\".", "ar": "لقد فوجئوا جداً برده: \"سنكون في الهدسون\"."}, {"heading": "The Hero of the Hudson", "en": "The Hudson is the name of the river which runs through New York.", "ar": "الهدسون هو اسم النهر الذي يمر عبر نيويورك."}, {"heading": "The Hero of the Hudson", "en": "The plane was flying above an enormous city and Sully was worried it would crash before it reached the airport.", "ar": "كانت الطائرة تحلق فوق مدينة ضخمة وكان سولي قلقاً من أنها قد تتحطم قبل وصولها إلى المطار."}, {"heading": "The Hero of the Hudson", "en": "Without power in the engines, Sully had to fly the plane like a glider towards the river.", "ar": "بدون طاقة في المحركات، اضطر سولي إلى قيادة الطائرة مثل الطائرة الشراعية نحو النهر."}, {"heading": "The Hero of the Hudson", "en": "The plane landed on the Hudson River at about 240 kilometres an hour.", "ar": "هبطت الطائرة في نهر هدسون بسرعة حوالي 240 كيلومتراً في الساعة."}, {"heading": "The Hero of the Hudson", "en": "It landed so hard that many of the plane's windows cracked.", "ar": "هبطت بقوة لدرجة أن العديد من نوافذ الطائرة تشققت."}, {"heading": "The Hero of the Hudson", "en": "Amazingly, they had landed safely, but the plane started to fill with extremely cold water.", "ar": "من المدهش أنهم هبطوا بسلام، لكن الطائرة بدأت تمتلئ بالماء شديد البرودة."}, {"heading": "The Hero of the Hudson", "en": "Sully told the passengers to climb onto the plane's wings.", "ar": "أخبر سولي الركاب بالصعود على أجنحة الطائرة."}, {"heading": "The Hero of the Hudson", "en": "Just four minutes later, boats arrived to rescue the passengers.", "ar": "بعد أربع دقائق فقط، وصلت القوارب لإنقاذ الركاب."}, {"heading": "The Hero of the Hudson", "en": "Seventy-eight people were injured, but incredibly, no one was seriously hurt.", "ar": "أصيب ثمانية وسبعون شخصاً، ولكن بشكل لا يصدق، لم يصب أحد بجروح خطيرة."}, {"heading": "The Hero of the Hudson", "en": "Everyone said that Sully was a hero for landing the plane on water.", "ar": "قال الجميع إن سولي كان بطلاً لهبوطه بالطائرة على الماء."}, {"heading": "The Hero of the Hudson", "en": "This is not something that pilots are trained to do.", "ar": "هذا ليس شيئاً يتدرب الطيارون على القيام به."}, {"heading": "The Hero of the Hudson", "en": "His experience probably saved the lives of everyone on board.", "ar": "ربما أنقذت خبرته حياة كل من كان على متنها."}, {"heading": "The Hero of the Hudson", "en": "He was also praised for staying on the plane until every passenger was safe.", "ar": "كما تم مدحه لبقائه على متن الطائرة حتى أصبح كل راكب في أمان."}], "dialogue": []}], "verbs": [{"present": "leave", "past": "left", "pp": "left", "ar": "يترك"}, {"present": "fly", "past": "flew", "pp": "flown", "ar": "يطير"}, {"present": "hit", "past": "hit", "pp": "hit", "ar": "يضرب / يصطدم بـ"}, {"present": "take off", "past": "took off", "pp": "taken off", "ar": "تقلع (الطائرة)"}], "definitions": [{"word": "leader", "definition": "the most powerful person or animal in a group / the most important person or animal in a group, who controls the others"}, {"word": "herd", "definition": "a group of animals that live together, such as horses, cows, deer, or elephants"}, {"word": "hunter", "definition": "a person who tries to catch or kill wild animals / a person that kills animals for food or sport"}, {"word": "roar", "definition": "to make a very loud noise / a loud sound made by lions and other large animals"}, {"word": "route", "definition": "a path or a way to go somewhere / a way that you follow to get from one place to another"}, {"word": "praise", "definition": "positive words you use to show you think someone has done something good"}, {"word": "air traffic control", "definition": "a service which gives information to pilots while they are flying"}, {"word": "glider", "definition": "something a person can fly in which doesn't have an engine"}, {"word": "crack", "definition": "when something breaks along thin lines"}, {"word": "co-pilot", "definition": "a second pilot who helps the pilot to fly a plane"}], "expressions": [{"en": "get caught in nets", "ar": "يقع في الشباك"}, {"en": "a flock of birds", "ar": "سرب من الطيور"}, {"en": "a herd of", "ar": "قطيع من"}, {"en": "take control of", "ar": "يتولى السيطرة على"}, {"en": "climb onto", "ar": "يصعد إلى"}, {"en": "on board", "ar": "على متن الطائرة"}, {"en": "fast -> the fastest", "ar": "الأسرع"}, {"en": "old -> the oldest", "ar": "الأقدم"}, {"en": "large -> the largest", "ar": "الأكبر"}, {"en": "close -> the closest", "ar": "الأقرب"}, {"en": "big -> the biggest", "ar": "الأكبر حجماً"}, {"en": "thin -> the thinnest", "ar": "الأنحف"}, {"en": "happy -> the happiest", "ar": "الأكثر سعادة"}, {"en": "beautiful -> the most beautiful", "ar": "الأكثر جمالاً"}, {"en": "bad -> the worst", "ar": "الأسوأ"}, {"en": "good -> the best", "ar": "الأفضل"}, {"en": "little -> the least", "ar": "الأقل"}, {"en": "more + adj. -> the most + adj.", "ar": "الأكثر"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
