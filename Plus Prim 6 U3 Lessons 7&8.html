</style></head><body><div class="container"><div class="lesson-badge">PLUS PRIM 6 • UNIT 3 • Lessons 7 &amp; 8</div><h1 id="main-title">Writing an opinion / Story</h1><h2 id="sub-title">Unit 3</h2><div class="speech-controls"><div class="control-group"><label>🗣️ اللكنة:</label><select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select></div><div class="control-group"><label>⚡ السرعة:</label><input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1"><span id="speed-value">0.9x</span></div><div class="theme-switcher"><label>🎨</label><span class="theme-dot active" data-theme="blue" style="background:#0569b3" title="Blue"></span><span class="theme-dot" data-theme="yellow" style="background:#d89000" title="Yellow"></span><span class="theme-dot" data-theme="purple" style="background:#9333a8" title="Purple"></span></div></div><button id="play-all-vocab-btn" class="play-btn">▶️ نطق جميع الكلمات والتعبيرات</button><div id="lesson-content"></div></div><button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button><script>
const lessonId="unit3_lessons7_8",data={"lesson_title": "Writing an opinion / Story", "unit_title": "Unit 3", "lessons_label": "Lessons 7 & 8", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "definitions", "expressions", "main_points", "texts", "activities"], "key_vocabulary": [{"en": "scribe", "ar": "كاتب"}, {"en": "palace", "ar": "قصر"}, {"en": "herbs", "ar": "أعشاب"}, {"en": "papyrus", "ar": "ورق البردي"}, {"en": "court", "ar": "بلاط / محكمة"}, {"en": "school trip", "ar": "رحلة مدرسية"}], "activities": [{"en": "When you write about your opinion, you need to give reasons for it.", "ar": "عندما تكتب عن رأيك فإنك تحتاج إلى إعطاء مبررات لرأيك."}, {"en": "In the main ideas paragraphs, give different reasons for your opinion, and use phrases to introduce each new reason.", "ar": "في الفقرات التي تناقش الأفكار الرئيسية يجب عليك إبداء أسباب مختلفة لرأيك، وكذلك استخدام عبارات لتعبر عن كل سبب جديد."}, {"en": "We use commas after these adverb phrases.", "ar": "نستخدم فاصلة سفلية (,) بعد تلك العبارات الظرفية."}, {"en": "First of all, we can learn a lot ...", "ar": "أولاً، يمكننا تعلم الكثير ..."}, {"en": "In addition, school trips are often more interesting than ...", "ar": "بالإضافة إلى ذلك، غالبًا ما تكون الرحلات المدرسية أكثر إثارة للاهتمام من ..."}, {"en": "Finally, we can continue learning when ...", "ar": "أخيرًا، يمكننا مواصلة التعلم عندما ..."}], "extra_vocabulary": [{"en": "education", "ar": "تعليم"}, {"en": "culture", "ar": "ثقافة"}, {"en": "experiences", "ar": "تجارب"}, {"en": "real life", "ar": "الحياة الواقعية"}, {"en": "mistakes", "ar": "أخطاء"}, {"en": "pharaoh", "ar": "فرعون"}, {"en": "confused", "ar": "متحير / مرتبك"}, {"en": "society", "ar": "مجتمع"}, {"en": "poisonous", "ar": "سام"}, {"en": "scream", "ar": "صرخة / يصرخ"}, {"en": "politician", "ar": "رجل سياسي"}, {"en": "cloth", "ar": "قماش"}, {"en": "get up", "ar": "يستيقظ"}, {"en": "snake", "ar": "ثعبان"}], "main_points": [{"topic": "Are school trips important?", "word": "learn - places", "sentence": "We can learn a lot by visiting new places."}, {"topic": "Are school trips important?", "word": "project", "sentence": "We can do a project about what we saw on the trip."}, {"topic": "Are school trips important?", "word": "experience", "sentence": "School trips are exciting learning experiences."}, {"topic": "Are school trips important?", "word": "education", "sentence": "School trips are a very important part of our education."}, {"topic": "Studying the past is important", "word": "create - present", "sentence": "Past events have created the present."}, {"topic": "Studying the past is important", "word": "learn - past", "sentence": "We can learn a lot by studying the past."}, {"topic": "Studying the past is important", "word": "society - cultures", "sentence": "History helps us understand our society and other cultures."}, {"topic": "Studying the past is important", "word": "life - change", "sentence": "We learn how and why life has changed."}, {"topic": "Studying the past is important", "word": "full of", "sentence": "History is full of great stories and interesting people."}], "texts": [{"type": "reading", "title": "Are school trips important? by Paige, aged 12", "paragraphs": [{"heading": "Introduction", "en": "In my opinion, school trips are exciting learning experiences.", "ar": "في رأيي، الرحلات المدرسية هي تجارب تعليمية مثيرة."}, {"heading": "Main Ideas", "en": "First of all, we can learn a lot by visiting new places.", "ar": "أولاً، يمكننا تعلم الكثير من خلال زيارة أماكن جديدة."}, {"heading": "Main Ideas", "en": "When we learn about something in a classroom and then see it in real life, we understand it better.", "ar": "عندما نتعلم شيئًا ما في الفصل الدراسي ثم نراه في الحياة الواقعية، فإننا نفهمه بشكل أفضل."}, {"heading": "Main Ideas", "en": "In addition, school trips are often more interesting than only reading about things in books or watching videos.", "ar": "بالإضافة إلى ذلك، غالبًا ما تكون الرحلات المدرسية أكثر إثارة للاهتمام من مجرد القراءة عن الأشياء في الكتب أو مشاهدة مقاطع الفيديو."}, {"heading": "Main Ideas", "en": "Finally, we can continue learning when we are back in the classroom after the school trip.", "ar": "أخيرًا، يمكننا مواصلة التعلم عندما نعود إلى الفصل الدراسي بعد الرحلة المدرسية."}, {"heading": "Main Ideas", "en": "We can do a project about what we saw on the trip.", "ar": "يمكننا القيام بمشروع حول ما رأيناه في الرحلة."}, {"heading": "Conclusion", "en": "To sum up, school trips are a very important part of our education.", "ar": "خلاصة القول، الرحلات المدرسية جزء مهم جدًا من تعليمنا."}, {"heading": "Conclusion", "en": "I think we should try to go on one school trip every year.", "ar": "أعتقد أنه يجب علينا محاولة الذهاب في رحلة مدرسية واحدة كل عام."}], "dialogue": []}, {"type": "reading", "title": "Is studying the past important?", "paragraphs": [{"heading": "Paragraph 1", "en": "I believe that studying the past helps us understand the present.", "ar": "أعتقد أن دراسة الماضي تساعدنا على فهم الحاضر."}, {"heading": "Paragraph 1", "en": "In my opinion, it is important that we understand how past events have created the present.", "ar": "في رأيي، من المهم أن نفهم كيف خلقت أحداث الماضي الحاضر."}, {"heading": "Paragraph 2", "en": "First of all, we can learn a lot by studying the past.", "ar": "أولاً، يمكننا تعلم الكثير من خلال دراسة الماضي."}, {"heading": "Paragraph 2", "en": "History helps us understand our society and other cultures because we learn about life in the past, important artists, scientists, and politicians.", "ar": "يساعدنا التاريخ على فهم مجتمعنا والثقافات الأخرى لأننا نتعلم عن الحياة في الماضي، والفنانين والعلماء والسياسيين المهمين."}, {"heading": "Paragraph 2", "en": "In addition, we learn about how and why life has changed over the years.", "ar": "بالإضافة إلى ذلك، نتعلم كيف ولماذا تغيرت الحياة على مر السنين."}, {"heading": "Paragraph 3", "en": "Some people say that the present is more interesting than the past, but I don't agree.", "ar": "يقول بعض الناس أن الحاضر أكثر إثارة للاهتمام من الماضي، لكني لا أوافقهم الرأي."}, {"heading": "Paragraph 3", "en": "History is interesting and exciting because it is full of great stories and interesting people.", "ar": "التاريخ ممتع ومثير لأنه مليء بالقصص الرائعة والأشخاص المثيرين للاهتمام."}, {"heading": "Paragraph 3", "en": "Finally, history helps us learn from past mistakes so that we don't repeat the same mistakes in the future.", "ar": "أخيرًا، يساعدنا التاريخ على التعلم من أخطاء الماضي حتى لا نكرر نفس الأخطاء في المستقبل."}, {"heading": "Paragraph 4", "en": "In conclusion, I think that studying history is an important part of our education.", "ar": "في الختام، أعتقد أن دراسة التاريخ جزء مهم من تعليمنا."}, {"heading": "Paragraph 4", "en": "History helps us learn from the past and it helps us understand why and how things change.", "ar": "يساعدنا التاريخ على التعلم من الماضي ويساعدنا على فهم سبب وكيفية تغير الأشياء."}], "dialogue": []}, {"type": "reading", "title": "The doctor comes to school", "paragraphs": [{"heading": "Paragraph 1", "en": "It was early and Nebsin didn't want to get up.", "ar": "كان الوقت مبكرًا ولم يرغب نيبسين في الاستيقاظ."}, {"heading": "Paragraph 2", "en": "\"Nebsin!\" Dad called. \"Time for school!\"", "ar": "نادى والده: \"نيبسين! حان وقت المدرسة!\""}, {"heading": "Paragraph 3", "en": "Nebsin went into the kitchen.", "ar": "دخل نيبسين المطبخ."}, {"heading": "Paragraph 4", "en": "\"Why do I have to go to school when Babu plays all day!\" he asked.", "ar": "سأل: \"لماذا يجب أن أذهب إلى المدرسة بينما يلعب بابو طوال اليوم!\""}, {"heading": "Paragraph 5", "en": "\"Your brother will start school next year,\" said his mom smiling.", "ar": "قالت والدته مبتسمة: \"سيبدأ أخوك المدرسة العام المقبل\"."}, {"heading": "Paragraph 6", "en": "\"I'm going to the palace, Nebsin,\" said Dad. \"Let's walk together.\"", "ar": "قال الأب: \"أنا ذاهب إلى القصر يا نيبسين. دعنا نسير معًا\"."}, {"heading": "Paragraph 7", "en": "Nebsin's father was a scribe, who wrote about what happened at the pharaoh's court.", "ar": "كان والد نيبسين كاتبًا، يكتب عما حدث في بلاط الفرعون."}, {"heading": "Paragraph 8", "en": "\"Why did you want to be a scribe?\" asked Nebsin.", "ar": "سأل نيبسين: \"لماذا أردت أن تكون كاتبًا؟\""}, {"heading": "Paragraph 9", "en": "\"My father was a scribe, and his father was a scribe,\" said Dad.", "ar": "قال الأب: \"كان والدي كاتبًا، وكان والده كاتبًا\"."}, {"heading": "Paragraph 10", "en": "Nebsin was confused. He didn't know what job he wanted to do yet. Later that morning, Nebsin was listening to his teacher when suddenly, a boy started shouting.", "ar": "كان نيبسين مرتبكًا. لم يكن يعرف الوظيفة التي يريد القيام بها بعد. في وقت لاحق من ذلك الصباح، كان نيبسين يستمع إلى معلمه عندما بدأ صبي فجأة في الصراخ."}, {"heading": "Paragraph 11", "en": "\"There's a snake!\" he shouted. A small, brown snake was moving across the floor. It bit the boy's hand and he screamed.", "ar": "صرخ: \"هناك ثعبان!\". كان ثعبان بني صغير يتحرك عبر الأرض. لدغ يد الصبي فصرخ."}, {"heading": "Paragraph 12", "en": "\"Quick, Nebsin!\" the teacher said. \"Get the doctor!\"", "ar": "قال المعلم: \"سريعًا يا نيبسين! أحضر الطبيب!\""}, {"heading": "Paragraph 13", "en": "Nebsin ran to the doctor's building. \"Help, please! A snake bit our friend!\" shouted Nebsin.", "ar": "ركض نيبسين إلى مبنى الطبيب. صرخ نيبسين: \"النجدة، من فضلك! لدغ ثعبان صديقنا!\""}, {"heading": "Paragraph 14", "en": "The doctor quickly picked up her bag and a roll of papyrus, and they ran to the school. \"What kind of snake was it?\" she asked.", "ar": "التقطت الطبيبة حقيبتها ولفافة من ورق البردي بسرعة، وركضوا إلى المدرسة. سألت: \"أي نوع من الثعابين كان؟\""}, {"heading": "Paragraph 15", "en": "\"It was small, and brown, with dark circles,\" said the boy.", "ar": "قال الصبي: \"كان صغيرًا وبنيًا وله دوائر داكنة\"."}, {"heading": "Paragraph 16", "en": "\"Good. That snake isn't poisonous,\" she said.", "ar": "قالت: \"جيد. هذا الثعبان ليس سامًا\"."}, {"heading": "Paragraph 17", "en": "She put some herbs into a bottle of oil, and shook it. She poured this onto a cloth.", "ar": "وضعت بعض الأعشاب في زجاجة زيت ورجتها. صبت هذا على قطعة قماش."}, {"heading": "Paragraph 18", "en": "\"Put this on your hand. It will hurt for a while but you won't get sick.\"", "ar": "ضعي هذا على يدك. سيؤلمك لفترة من الوقت لكنك لن تمرض."}, {"heading": "Paragraph 19", "en": "Nebsin was amazed. \"I think I'd like to be a doctor one day,\" he thought.", "ar": "اندهش نيبسين. فكر قائلاً: \"أعتقد أنني أود أن أصبح طبيبًا يومًا ما\"."}], "dialogue": []}], "verbs": [{"present": "shake", "past": "shook", "pp": "shaken", "ar": "يهز"}, {"present": "bite", "past": "bit", "pp": "bitten", "ar": "يعض"}, {"present": "hurt", "past": "hurt", "pp": "hurt", "ar": "يؤذي / يؤلم"}], "definitions": [{"word": "papyrus", "definition": "a type of paper made from plants called reeds"}, {"word": "scribe", "definition": "a person who wrote about everything that happened in the pharaoh's court"}, {"word": "court", "definition": "a place where the pharaoh made important decisions"}, {"word": "herbs", "definition": "plants that people used in food or medicine"}], "expressions": [{"en": "in addition", "ar": "بالإضافة إلى ذلك"}, {"en": "time for", "ar": "حان وقت"}, {"en": "pour ... onto", "ar": "يصب ... على"}, {"en": "put ... into", "ar": "يضع في"}, {"en": "To sum up", "ar": "وخلاصة القول"}, {"en": "a roll of", "ar": "لفافة من"}, {"en": "for a while", "ar": "لمدة قصيرة"}, {"en": "pick up", "ar": "يلتقط"}, {"en": "first of all", "ar": "أولاً"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
