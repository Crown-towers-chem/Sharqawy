pic": "Our Natural Resources", "word": "gold - silver", "sentence": "Gold and silver are two common types of metal."}, {"topic": "Our Natural Resources", "word": "plastic - petroleum", "sentence": "Plastic is made from petroleum."}, {"topic": "Our Natural Resources", "word": "renewable resources", "sentence": "Sun and wind are renewable resources."}, {"topic": "Our Natural Resources", "word": "non-renewable", "sentence": "Petroleum and metals are non-renewable resources."}, {"topic": "Solar panels in the desert", "word": "energy - run out", "sentence": "Renewable energy is from a resource that won't run out."}, {"topic": "Solar panels in the desert", "word": "electricity - wind", "sentence": "We can make electricity from renewable resources like the wind and water."}, {"topic": "Solar panels in the desert", "word": "sunshine - perfect", "sentence": "We have so much sunshine in the desert, so it is the perfect place for a solar farm."}, {"topic": "Solar panels in the desert", "word": "solar panels - collect", "sentence": "The solar panels collect energy from the sun."}], "texts": [{"type": "reading", "title": "Did you know?", "paragraphs": [{"en": "The first windmills were used in western Asia almost 3,000 years ago to grind grain and pump water.", "ar": "تم استخدام طواحين الهواء الأولى في غرب آسيا منذ ما يقرب من ٣٠٠٠ عام لطحن الحبوب وضخ المياه."}], "dialogue": []}, {"type": "reading", "title": "Our Natural Resources", "paragraphs": [{"en": "Natural resources are materials that we get from nature.", "ar": "الموارد الطبيعية هي مواد نحصل عليها من الطبيعة."}, {"en": "People use these materials for different purposes.", "ar": "يستخدم الناس هذه المواد لأغراض مختلفة."}, {"en": "If you look around your classroom, you will probably see different types of them.", "ar": "إذا نظرت حول فصلك، فمن المحتمل أن ترى أنواعًا مختلفة منها."}, {"en": "What is your school made of?", "ar": "مما تتكون مدرستك؟"}, {"en": "We use stone to construct buildings, bridges, and sometimes schools, too.", "ar": "نحن نستخدم الحجر لبناء المباني والجسور وأحيانًا المدارس أيضًا."}, {"en": "What are you sitting on right now?", "ar": "على ماذا تجلس الآن؟"}, {"en": "Is it made of wood?", "ar": "هل هو مصنوع من الخشب؟"}, {"en": "Forests, and the wood we get from them, are another important natural resource.", "ar": "الغابات، والخشب الذي نحصل عليه منها، هي مورد طبيعي مهم آخر."}, {"en": "Is anything made of plastic in your classroom?", "ar": "هل هناك أي شيء مصنوع من البلاستيك في فصلك؟"}, {"en": "Plastic is made from petroleum, which is ... that's right - a natural resource!", "ar": "البلاستيك مصنوع من البترول، وهو ... هذا صحيح - مورد طبيعي!"}, {"en": "Can you find any minerals in your classroom?", "ar": "هل يمكنك العثور على أي معادن في فصلك؟"}, {"en": "What about the door handle, the window frame, or the watch your teacher is wearing?", "ar": "ماذا عن مقبض الباب، أو إطار النافذة، أو الساعة التي يرتديها معلمك؟"}, {"en": "Is part of your desk or chair metal?", "ar": "هل جزء من مكتبك أو كرسيك معدني؟"}, {"en": "There are many different types of metal, which are types of minerals.", "ar": "هناك أنواع مختلفة عديدة من المعادن، وهي أنواع من المعادن."}, {"en": "Gold and silver are two common ones.", "ar": "الذهب والفضة هما نوعان شائعان."}, {"en": "And they are all natural resources.", "ar": "وكلها موارد طبيعية."}, {"en": "The water you drink at lunch is a natural resource.", "ar": "الماء الذي تشربه في الغداء هو مورد طبيعي."}, {"en": "Where do the potatoes we eat come from?", "ar": "من أين تأتي البطاطس التي نأكلها؟"}, {"en": "They're grown in the ground, and this ground is made up of what we call soil.", "ar": "إنها تُزرع في الأرض، وهذه الأرض تتكون مما نسميه التربة."}, {"en": "So yes, soil too, is a natural resource.", "ar": "لذا نعم، التربة أيضًا مورد طبيعي."}, {"en": "Some resources are what we call renewable.", "ar": "بعض الموارد هي ما نسميه متجددة."}, {"en": "Renewable resources can be naturally replaced when they run out.", "ar": "يمكن استبدال الموارد المتجددة بشكل طبيعي عندما تنفد."}, {"en": "The sun, wind, and falling water are examples of renewable resources.", "ar": "تعد الشمس والرياح والمياه المتساقطة أمثلة على الموارد المتجددة."}, {"en": "Then there are non-renewable resources.", "ar": "ثم هناك الموارد غير المتجددة."}, {"en": "These are things like metals and petroleum.", "ar": "هذه أشياء مثل المعادن والبترول."}, {"en": "Once we have used all of them up, we can't get any more here on Earth.", "ar": "بمجرد أن نستخدمها جميعًا، لا يمكننا الحصول على المزيد هنا على الأرض."}], "dialogue": []}, {"type": "reading", "title": "Solar Panels in the Desert", "paragraphs": [{"en": "Seleem walks to school every day.", "ar": "سليم يمشي إلى المدرسة كل يوم."}, {"en": "The road is next to the desert.", "ar": "الطريق بجوار الصحراء."}, {"en": "It is usually hot, sunny, and dusty on the road.", "ar": "عادة ما يكون الجو حارًا ومشمساً ومتربًا على الطريق."}, {"en": "Last year, there was nothing in the desert.", "ar": "في العام الماضي، لم يكن هناك شيء في الصحراء."}, {"en": "Sometimes Seleem saw a lizard, but most of the time, he just saw rocks and sunshine.", "ar": "أحيانًا كان سليم يرى سحلية، لكن في معظم الأوقات، كان يرى فقط الصخور وأشعة الشمس."}, {"en": "Now things are different.", "ar": "الآن الأمور مختلفة."}, {"en": "He sees lots of workers and trucks in the desert.", "ar": "يرى الكثير من العمال والشاحنات في الصحراء."}, {"en": "They are building a solar farm.", "ar": "إنهم يبنون محطة للطاقة الشمسية."}, {"en": "At school, Seleem's teacher asks the class a question.", "ar": "في المدرسة، يطرح معلم سليم سؤالاً على الفصل."}, {"en": "\"What is renewable energy?\"", "ar": "“ما هي الطاقة المتجددة؟”"}, {"en": "Seleem puts his hand up.", "ar": "سليم يرفع يده."}, {"en": "\"Renewable energy is from a resource that won't run out,\" he said.", "ar": "قال سليم: “الطاقة المتجددة من مورد لن ينفد”."}, {"en": "\"Very good,\" said Mr. Ali.", "ar": "“جيد جداً”، قال السيد علي."}, {"en": "\"We need to make electricity.\"", "ar": "“نحن بحاجة إلى إنتاج الكهرباء.”"}, {"en": "\"We can burn fossil fuels like oil and gas, but they will run out.\"", "ar": "“يمكننا حرق الوقود الحفري مثل النفط والغاز، لكنهما سينفدان.”"}, {"en": "\"We can also make electricity from renewable resources like the wind and water.\"", "ar": "“يمكننا أيضًا إنتاج الكهرباء من الموارد المتجددة مثل الرياح والمياه.”"}, {"en": "\"Tomorrow we will go on a short school trip to learn more about renewable energy here in Aswan.\"", "ar": "“غدًا سنذهب في رحلة مدرسية قصيرة لنتعلم المزيد عن الطاقة المتجددة هنا في أسوان.”"}, {"en": "The next day, Seleem and his class are very excited.", "ar": "في اليوم التالي، كان سليم وفصله متحمسين للغاية."}, {"en": "Mr. Ali takes them to the new solar farm.", "ar": "يأخذهم السيد علي إلى محطة الطاقة الشمسية الجديدة."}, {"en": "They meet the workers.", "ar": "يقابلون العمال."}, {"en": "Some of the workers are putting solar panels in the desert.", "ar": "يقوم بعض العمال بوضع الألواح الشمسية في الصحراء."}, {"en": "Some workers are driving trucks.", "ar": "بعض العمال يقودون الشاحنات."}, {"en": "Some workers are engineers.", "ar": "بعض العمال مهندسون."}, {"en": "One of the engineers tells the class, 'We will have more electricity in the city soon, and in your school, too!'", "ar": "يقول أحد المهندسين للفصل، “سيكون لدينا المزيد من الكهرباء في المدينة قريبًا، وفي مدرستكم أيضًا!”"}, {"en": "We have so much sunshine in the desert, so it is the perfect place for a solar farm.", "ar": "لدينا الكثير من أشعة الشمس في الصحراء، لذا فهي المكان المثالي لمحطة الطاقة الشمسية."}, {"en": "The solar panels collect energy from the sun and we can make that into electricity for our homes.", "ar": "تجمع الألواح الشمسية الطاقة من الشمس ويمكننا تحويلها إلى كهرباء لمنازلنا."}], "dialogue": []}, {"type": "reading", "title": "Advantages and Disadvantages of Solar Energy", "paragraphs": [{"en": "Solar panels are easy to look after.", "ar": "الألواح الشمسية سهلة العناية بها."}, {"en": "Electricity from solar power is cheap.", "ar": "الكهرباء من الطاقة الشمسية رخيصة الثمن."}, {"en": "Solar farms need a very big space.", "ar": "محطات الطاقة الشمسية تحتاج إلى مساحة كبيرة جدًا."}, {"en": "Solar panels are expensive.", "ar": "الألواح الشمسية باهظة الثمن."}, {"en": "We can't make solar power on a rainy day.", "ar": "لا يمكننا أن نصنع الطاقة الشمسية في يوم ممطر."}], "dialogue": []}, {"type": "reading", "title": "Read and learn", "paragraphs": [{"en": "We can't destroy energy.", "ar": "لا يمكننا تدمير الطاقة."}, {"en": "We can only change it from one kind of energy to another kind.", "ar": "يمكننا فقط تغييرها من نوع واحد من الطاقة إلى نوع آخر."}, {"en": "This is called transfer of energy.", "ar": "وهذا ما يسمى انتقال الطاقة."}, {"en": "When we use solar panels to collect sunlight, the solar energy is turned into electrical energy.", "ar": "عندما نستخدم الألواح الشمسية لجمع ضوء الشمس، تتحول الطاقة الشمسية إلى طاقة كهربائية."}, {"en": "When you use this electrical energy for a television, it is now mechanical energy.", "ar": "عندما تستخدم هذه الطاقة الكهربائية للتلفزيون، فإنها تصبح الآن طاقة ميكانيكية."}], "dialogue": []}], "verbs": [{"present": "replace", "past": "replaced", "pp": "replaced", "ar": "يستبدل"}, {"present": "collect", "past": "collected", "pp": "collected", "ar": "يجمع"}, {"present": "transfer", "past": "transferred", "pp": "transferred", "ar": "يحول/ينقل"}, {"present": "see", "past": "saw", "pp": "seen", "ar": "يرى"}, {"present": "meet", "past": "met", "pp": "met", "ar": "يقابل"}, {"present": "put", "past": "put", "pp": "put", "ar": "يضع"}], "definitions": [], "expressions": [{"en": "made of", "ar": "مصنوع من [المادة الخام لا تتغير بعد التصنيع]"}, {"en": "made from", "ar": "مصنوع من [المادة الخام تتغير بعد التصنيع]"}, {"en": "made up of", "ar": "يتألف من/يتكون من"}, {"en": "run out", "ar": "ينفذ/يُستهلك/ينتهى"}, {"en": "turn into", "ar": "يتحول إلى"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;

function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
