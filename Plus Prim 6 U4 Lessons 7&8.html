</style></head><body><div class="container"><div class="lesson-badge">PLUS PRIM 6 • UNIT 4 • LESSONS 7 &amp; 8</div><h1 id="main-title">Writing a personal profile / Story: Hana saves the day</h1><h2 id="sub-title">Unit 4</h2><div class="speech-controls"><div class="control-group"><label>🗣️ اللكنة:</label><select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select></div><div class="control-group"><label>⚡ السرعة:</label><input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1"><span id="speed-value">0.9x</span></div><div class="theme-switcher"><label>🎨</label><span class="theme-dot active" data-theme="blue" style="background:#0569b3" title="Blue"></span><span class="theme-dot" data-theme="yellow" style="background:#d89000" title="Yellow"></span><span class="theme-dot" data-theme="purple" style="background:#9333a8" title="Purple"></span></div></div><button id="play-all-vocab-btn" class="play-btn">▶️ نطق جميع الكلمات والتعبيرات</button><div id="lesson-content"></div></div><button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button><script>
const lessonId="unit4_lessons7_8",data={"lesson_title": "Writing a personal profile / Story: Hana saves the day", "unit_title": "Unit 4", "lessons_label": "LESSONS 7 & 8", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "definitions", "expressions", "main_points", "texts"], "key_vocabulary": [{"en": "hobbies", "ar": "هوايات"}, {"en": "walker", "ar": "مشاية طبية"}, {"en": "physiotherapist", "ar": "أخصائي العلاج الطبيعي"}, {"en": "crawl", "ar": "يزحف / يحبو"}, {"en": "celebrate", "ar": "يحتفل"}, {"en": "the countryside", "ar": "الريف"}, {"en": "photography", "ar": "تصوير"}, {"en": "decorate", "ar": "يزين"}, {"en": "cerebral palsy", "ar": "الشلل الدماغي"}], "activities": [], "extra_vocabulary": [{"en": "relieved", "ar": "مرتاح البال"}, {"en": "awesome", "ar": "رائع"}, {"en": "receive", "ar": "يتلقى / يستلم"}, {"en": "thankful", "ar": "ممتن"}, {"en": "braces", "ar": "تقويم أسنان"}, {"en": "stickers", "ar": "ملصقات"}, {"en": "brain", "ar": "مخ"}, {"en": "snack bar", "ar": "مطعم الوجبات السريعة"}, {"en": "dentist", "ar": "طبيب أسنان"}, {"en": "fresh air", "ar": "هواء نقي"}, {"en": "seat", "ar": "مقعد"}, {"en": "score", "ar": "يسجل [هدف]"}], "main_points": [{"topic": "Amber's personal profile", "word": "keen on", "sentence": "Amber is keen on walking with her family and friends."}, {"topic": "Amber's personal profile", "word": "photography", "sentence": "Amber is into photography."}, {"topic": "Amber's personal profile", "word": "music", "sentence": "She loves listening to music from her country and all over the world."}, {"topic": "Amber's personal profile", "word": "mall", "sentence": "On the weekend, Amber loves going to the mall."}, {"topic": "Amber's personal profile", "word": "dentist", "sentence": "She'd like to be a dentist."}, {"topic": "Hana saves the day", "word": "walker", "sentence": "Hana's new walker arrived."}, {"topic": "Hana saves the day", "word": "decorate", "sentence": "Hana and her friend decorate the new walker."}, {"topic": "Hana saves the day", "word": "fresh air", "sentence": "It's important for Hana to get fresh air."}, {"topic": "Hana saves the day", "word": "friends - park", "sentence": "Hana met her friends at the park."}, {"topic": "Hana saves the day", "word": "cerebral palsy", "sentence": "Hana's brain works different. She has cerebral palsy."}, {"topic": "Hana saves the day", "word": "little boy", "sentence": "A woman lost her little boy in the park."}, {"topic": "Hana saves the day", "word": "crawl", "sentence": "He can't walk. He crawls along the ground."}, {"topic": "Hana saves the day", "word": "thankful", "sentence": "His mom was thankful that Hana found him."}, {"topic": "Hana saves the day", "word": "relieved", "sentence": "They were all so relieved and happy."}, {"topic": "Hana saves the day", "word": "celebrate", "sentence": "They had an ice cream to celebrate."}], "texts": [{"type": "reading", "title": "Amber's personal profile", "paragraphs": [{"heading": "Amber's personal profile", "en": "Hi everybody! How are things?", "ar": "مرحباً بالجميع! كيف حال الأمور؟"}, {"heading": "Amber's personal profile", "en": "My name's Amber. I'm eleven, and I live in New York.", "ar": "اسمي آمبر. أنا في الحادية عشرة من عمري، وأعيش في نيويورك."}, {"heading": "Amber's personal profile", "en": "I go to school at Alex Modern School. It's a great school, and I have great friends.", "ar": "أذهب إلى مدرسة أليكس مودرن. إنها مدرسة رائعة، ولدي أصدقاء رائعون."}, {"heading": "Amber's personal profile", "en": "I'm quite tall, and I have long brown hair. I wear braces.", "ar": "أنا طويلة القامة إلى حد ما، ولدي شعر بني طويل. أنا أضع تقويم أسنان."}, {"heading": "Amber's personal profile", "en": "I have an older brother and an older sister, so they call me the baby of the family!", "ar": "لدي أخ أكبر وأخت أكبر، لذا يطلقون علي مدلل العائلة!"}, {"heading": "Amber's personal profile", "en": "I'm keen on walking with my family and friends, and the countryside near where I live is really amazing.", "ar": "أنا شغوفة بالمشي مع عائلتي وأصدقائي، والريف القريب من مكان سكني مذهل حقاً."}, {"heading": "Amber's personal profile", "en": "I'm into photography. I like taking photos of all the beautiful things I see in the countryside.", "ar": "أنا مهتمة بالتصوير الفوتوغرافي. أحب التقاط صور لكل الأشياء الجميلة التي أراها في الريف."}, {"heading": "Amber's personal profile", "en": "I also love listening to music from my country and all over the world.", "ar": "أحب أيضاً الاستماع إلى الموسيقى من بلدي ومن جميع أنحاء العالم."}, {"heading": "Amber's personal profile", "en": "As well as this, I'm really into sports. I play volleyball at my local club, and we have games about once a month.", "ar": "بالإضافة إلى ذلك، أنا مهتمة حقاً بالرياضة. ألعب الكرة الطائرة في ناديي المحلي، ولدينا مباريات مرة واحدة في الشهر تقريباً."}, {"heading": "Amber's personal profile", "en": "On the weekend, I love going to the mall with my friends and family, and then I go to my grandma's to watch movies with her.", "ar": "في عطلة نهاية الأسبوع، أحب الذهاب إلى المركز التجاري مع أصدقائي وعائلتي، ثم أذهب إلى جدتي لمشاهدة الأفلام معها."}, {"heading": "Amber's personal profile", "en": "We talk a lot, and she lives near my house, so it's easy for me to get home.", "ar": "نتحدث كثيراً، وهي تعيش بالقرب من منزلي، لذا فمن السهل علي العودة إلى المنزل."}, {"heading": "Amber's personal profile", "en": "I think a lot about the future, and I think I'd like to be a dentist, like my dad.", "ar": "أفكر كثيراً في المستقبل، وأعتقد أنني أود أن أكون طبيبة أسنان، مثل والدي."}, {"heading": "Amber's personal profile", "en": "What about you? What do you look like? What are your hobbies? Write and tell me about yourself!", "ar": "ماذا عنك؟ كيف تبدو؟ ما هي هواياتك؟ اكتب وأخبرني عن نفسك!"}], "dialogue": []}, {"type": "reading", "title": "Hana saves the day", "paragraphs": [{"heading": "Hana saves the day", "en": "Hana is a good friend who lives on my street. One day, after school, she called me.", "ar": "هنا صديقة جيدة تعيش في شارعي. ذات يوم، بعد المدرسة، اتصلت بي."}, {"heading": "Hana saves the day", "en": "\"My new walker arrived. Do you want to come over and help me decorate it?\"", "ar": "\"وصلت مشايتي الجديدة. هل تريدين المجيء ومساعدتي في تزيينها؟\""}, {"heading": "Hana saves the day", "en": "Excited, I ran to her house. As she gets taller, Hana receives a new walker every year.", "ar": "ركضت إلى منزلها وأنا متحمسة. بينما يزداد طولها، تتلقى هنا مشاية جديدة كل عام."}, {"heading": "Hana saves the day", "en": "When the new one arrives, we decorate it. Hana's favorite color is green, so we painted it green and decorated it with stars and stickers. It looked awesome.", "ar": "عندما تصل المشاية الجديدة، نقوم بتزيينها. لون هنا المفضل هو الأخضر، لذا قمنا بطلائها باللون الأخضر وزيناها بالنجوم والملصقات. لقد بدت رائعة."}, {"heading": "Hana saves the day", "en": "\"What should we do now, Reem?\" asked Hana. \"I think we should go to the park,\" I said.", "ar": "سألت هنا: \"ماذا يجب أن نفعل الآن يا ريم؟\". قلت: \"أعتقد أننا يجب أن نذهب إلى الحديقة\"."}, {"heading": "Hana saves the day", "en": "We often go for a walk to the park after school. Hana's physiotherapist, Donia, says it's important for Hana to get fresh air and exercise her legs so they get stronger.", "ar": "غالباً ما نذهب للتنزه في الحديقة بعد المدرسة. تقول دنيا، أخصائية العلاج الطبيعي لهنا، إنه من المهم لهنا الحصول على هواء نقي وتمرين ساقيها حتى تصبحا أقوى."}, {"heading": "Hana saves the day", "en": "At the park, we met our friends. They said Hana's new walker looked great. Our new friend, Rasha, asked Hana why she needed a walker.", "ar": "في الحديقة، التقينا بأصدقائنا. قالوا إن مشاية هنا الجديدة تبدو رائعة. سألت صديقتنا الجديدة، رشا، هنا لماذا تحتاج إلى مشاية."}, {"heading": "Hana saves the day", "en": "\"Well,\" she said, \"when I was born, something happened to my brain and it works differently to some other people's. My dad calls it my special brain. The name for what I have is cerebral palsy.\"", "ar": "قالت: \"حسناً، عندما ولدت، حدث شيء ما لدماغي وهو يعمل بشكل مختلف عن بعض الأشخاص الآخرين. والدي يطلق عليه دماغي الخاص. اسم ما أعاني منه هو الشلل الدماغي\"."}, {"heading": "Hana saves the day", "en": "\"Can you do everything with the walker?\" asked Rasha. \"No, for eating meals I have a special chair at home, and for going out in the car, I have a special seat - it's really comfortable.\"", "ar": "سألت رشا: \"هل يمكنك فعل كل شيء بالمشاية؟\". \"لا، لتناول الوجبات لدي كرسي خاص في المنزل، وللخروج في السيارة، لدي مقعد خاص - إنه مريح حقاً\"."}, {"heading": "Hana saves the day", "en": "Then we walked a little more with our friends. Hana was walking behind with Nadine, our other friend. Suddenly, a woman came running towards us, and she was crying.", "ar": "ثم مشينا قليلاً مع أصدقائنا. كانت هنا تمشي في الخلف مع نادين، صديقتنا الأخرى. فجأة، جاءت امرأة تجري نحونا، وكانت تبكي."}, {"heading": "Hana saves the day", "en": "\"I can't see my little boy!\" she said. \"I turned around to get him a snack from my bag, and now I can't see him!\"", "ar": "قالت: \"لا أستطيع رؤية ولدي الصغير! لقد استدرت لأحضر له وجبة خفيفة من حقيبتي، والآن لا أستطيع رؤيته!\""}, {"heading": "Hana saves the day", "en": "\"How old is your little boy?\" asked Rasha. \"Only one. He can't walk, he crawls along the ground.\"", "ar": "سألت رشا: \"كم عمر ولدك الصغير؟\". \"سنة واحدة فقط. لا يمكنه المشي، فهو يحبو على الأرض\"."}, {"heading": "Hana saves the day", "en": "So we all looked in the grass, and the snack bar, but we didn't see him. Then, I noticed there was a group of trees behind where the woman was sitting.", "ar": "لذا بحثنا جميعاً في العشب، وفي مطعم الوجبات السريعة، لكننا لم نره. ثم لاحظت وجود مجموعة من الأشجار خلف المكان الذي كانت تجلس فيه المرأة."}, {"heading": "Hana saves the day", "en": "\"Let's look over there!\" I said. \"And where's Hana?\" Nobody knew. We all ran over to the trees, quite scared because it was near the road.", "ar": "قلت: \"لنبحث هناك! وأين هنا؟\". لم يعرف أحد. ركضنا جميعاً نحو الأشجار، وكنا خائفين للغاية لأنها كانت قريبة من الطريق."}, {"heading": "Hana saves the day", "en": "\"Adam!\" shouted the woman, and she stopped crying. There was Adam, pulling himself up on Hana's walker, and Hana was talking to him quietly.", "ar": "صرخت المرأة: \"آدم!\" وتوقفت عن البكاء. كان هناك آدم، يرفع نفسه على مشاية هنا، وكانت هنا تتحدث إليه بهدوء."}, {"heading": "Hana saves the day", "en": "His mom was so thankful that Hana found him. We were all so relieved and happy, and we had an ice cream to celebrate!", "ar": "كانت والدته ممتنة للغاية لأن هنا وجدته. شعرنا جميعاً بالارتياح والسعادة، وتناولنا الآيس كريم للاحتفال!"}], "dialogue": []}, {"type": "reading", "title": "What is Adam's disability?", "paragraphs": [{"heading": "What is Adam's disability?", "en": "It was Thursday afternoon and for Adam, this was the best day of the week. Adam went to basketball club after school on a Thursday.", "ar": "كان ذلك بعد ظهر يوم الخميس وبالنسبة لآدم، كان هذا أفضل يوم في الأسبوع. ذهب آدم إلى نادي كرة السلة بعد المدرسة يوم الخميس."}, {"heading": "What is Adam's disability?", "en": "Today was special. His mom was waiting for him at the school entrance. \"I've brought you some water and a snack, Adam. You should eat something before you play,\" she said.", "ar": "كان اليوم مميزاً. كانت والدته تنتظره عند مدخل المدرسة. قالت: \"لقد أحضرت لك بعض الماء ووجبة خفيفة يا آدم. يجب أن تأكل شيئاً قبل أن تلعب\"."}, {"heading": "What is Adam's disability?", "en": "\"Thanks, Mom, I forgot about eating,\" said Adam. \"That's because you're so excited,\" his mom said, smiling. \"Come on, Adam, let's get in the car.\"", "ar": "قال آدم: \"شكراً يا أمي، لقد نسيت أمر الأكل\". قالت والدته وهي تبتسم: \"هذا لأنك متحمس للغاية. هيا يا آدم، لنركب السيارة\"."}, {"heading": "What is Adam's disability?", "en": "Fifteen minutes later, they arrived at the sports center. Adam saw his friend Brooke, who was waiting for him at the entrance.", "ar": "بعد خمس عشرة دقيقة، وصلوا إلى المركز الرياضي. رأى آدم صديقه بروك، الذي كان ينتظره عند المدخل."}, {"heading": "What is Adam's disability?", "en": "\"Hi, Adam. Are you excited about the game?\" he shouted. \"Hi, Brooke! Yes! It's going to be the most exciting game ever,\" Adam said.", "ar": "صرخ قائلاً: \"مرحباً يا آدم. هل أنت متحمس للمباراة؟\". قال آدم: \"مرحباً يا بروك! نعم! ستكون أكثر مباراة إثارة على الإطلاق\"."}, {"heading": "What is Adam's disability?", "en": "He waited for his mom as she took out his wheelchair from the back of the car. \"Look, Mom,\" said Adam. \"There's Mr Baker, my physiotherapist. He has come to watch the game. Let's say hello.\"", "ar": "انتظر والدته وهي تخرج كرسيه المتحرك من خلف السيارة. قال آدم: \"انظري يا أمي، هناك السيد بيكر، أخصائي العلاج الطبيعي الخاص بي. لقد جاء لمشاهدة المباراة. لنقل مرحباً\"."}, {"heading": "What is Adam's disability?", "en": "Adam started playing wheelchair basketball six months ago and this was his first game as the captain of the team.", "ar": "بدأ آدم لعب كرة السلة على الكراسي المتحركة منذ ستة أشهر وكانت هذه أول مباراة له كقائد للفريق."}, {"heading": "What is Adam's disability?", "en": "The game started well and Adam's team was winning, until the last five minutes, when the other team scored two baskets. This was serious.", "ar": "بدأت المباراة بشكل جيد وكان فريق آدم فائزاً، حتى الدقائق الخمس الأخيرة، عندما سجل الفريق الآخر سلتين. كان هذا أمراً خطيراً."}, {"heading": "What is Adam's disability?", "en": "There were three minutes until the end of the game. Then two minutes... Suddenly, Colin caught the ball and threw it to Brooke.", "ar": "كانت هناك ثلاث دقائق حتى نهاية المباراة. ثم دقيقتان... فجأة، أمسك كولين بالكرة ورماها لبروك."}, {"heading": "What is Adam's disability?", "en": "Brooke quickly moved past two players and threw the ball to Adam. There were 60 seconds to go ... Adam caught the ball and stopped his wheelchair.", "ar": "تحرك بروك بسرعة متجاوزاً لاعبين ورمى الكرة لآدم. كان هناك 60 ثانية متبقية ... أمسك آدم بالكرة وأوقف كرسيه المتحرك."}, {"heading": "What is Adam's disability?", "en": "Thirty seconds .... he put his arms above his head. Twenty seconds ... then he threw the ball high in the air ... and it dropped into the middle of the basketball net!", "ar": "ثلاثون ثانية .... وضع ذراعيه فوق رأسه. عشرون ثانية ... ثم رمى الكرة عالياً في الهواء ... وسقطت في منتصف شبكة كرة السلة!"}, {"heading": "What is Adam's disability?", "en": "Everyone cheered loudly! Adam's team won the match! What a great day!", "ar": "هتف الجميع بصوت عالٍ! فاز فريق آدم بالمباراة! يا له من يوم رائع!"}], "dialogue": []}], "verbs": [{"present": "think", "past": "thought", "pp": "thought", "ar": "يفكر"}], "definitions": [{"word": "decorate", "definition": "to add something to an object or place to make it look better"}, {"word": "walker", "definition": "something that people use to help them walk"}, {"word": "crawl", "definition": "to move along the ground using both arms and legs"}, {"word": "physiotherapist", "definition": "a person who helps people with injuries or disabilities"}], "expressions": [{"en": "keen on", "ar": "مهتم بـ / شغوف بـ"}, {"en": "on the weekend,", "ar": "في عطلة نهاية الأسبوع،"}, {"en": "pull himself up", "ar": "يرفع نفسه إلى أعلى"}, {"en": "[be] into sports", "ar": "مهتم بالرياضة"}, {"en": "go for a walk", "ar": "يتمشى"}, {"en": "the baby of the family", "ar": "مدلل العائلة"}, {"en": "turn around", "ar": "يدور حول"}, {"en": "Adel doesn't play sport, but he likes watching sport on TV.", "ar": "عادل لا يمارس الرياضة، لكنه يحب مشاهدة الرياضة على التلفاز."}, {"en": "Samira wants to be an engineer, and one day she'd like to live and work in Cairo.", "ar": "سميرة تريد أن تصبح مهندسة، وفي يوم من الأيام تود أن تعيش وتعمل في القاهرة."}, {"en": "Tarek is keen on swimming, so he goes swimming three times a week.", "ar": "طارق شغوف بالسباحة، لذا يذهب للسباحة ثلاث مرات في الأسبوع."}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
