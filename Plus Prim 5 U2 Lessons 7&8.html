const lessonId="unit2_lessons7_8",data={"lesson_title": "Writing a description / Story: A Balloon Ride", "unit_title": "LOOK AROUND YOU", "lessons_label": "LESSONS 7 & 8", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "expressions", "definitions", "main_points", "texts", "activities"], "key_vocabulary": [{"en": "air balloon", "ar": "منطاد هوائى"}, {"en": "ribbon", "ar": "شريط"}, {"en": "pilot", "ar": "طيار"}, {"en": "arch", "ar": "قوس"}, {"en": "rainbow", "ar": "قوس قزح"}, {"en": "pinnacle", "ar": "قمة صخرية"}, {"en": "gentle", "ar": "لطيف"}], "activities": [{"en": "How to write a description of a geological formation:", "ar": "كيفية كتابة وصف للتكوين الجيولوجي:"}, {"en": "Decide which formation you want to write about.", "ar": "حدد التكوين الذي تريد الكتابة عنه."}, {"en": "Do research about geological feature and make notes. Find or draw a picture of it.", "ar": "قم بالبحث عن الملامح الجيولوجية وقم بتدوين الملاحظات. ابحث عن أو ارسم صورة له."}, {"en": "Write your description for the brochure.", "ar": "اكتب وصفك للكتيب."}, {"en": "Tips to write a description of a geological formation:", "ar": "نصائح لكتابة وصف لتكوين جيولوجي:"}, {"en": "Introduce the topic, start the first sentence with the name of your geological formation.", "ar": "قم بتقديم الموضوع، ابدأ الجملة الأولى باسم التكوين الجيولوجي الخاص بك."}, {"en": "Write why this geological formation is important or special in the same sentence.", "ar": "اكتب لماذا هذا التكوين الجيولوجي مهم أو مميز في نفس الجملة."}, {"en": "Next, include the location and age of the formation.", "ar": "بعد ذلك، قم بإضافة موقع وعمر التكوين."}, {"en": "Explain how it was formed.", "ar": "اشرح كيف تم تشكيله."}, {"en": "Describe what it looks like and how big it is.", "ar": "صف شكله وحجمه."}, {"en": "Add extra, interesting information about it.", "ar": "أضف معلومات إضافية ومثيرة للاهتمام حول هذا التكوين الجيولوجي."}, {"en": "Tell people how they can visit it.", "ar": "أخبر الناس كيف يمكنهم زيارته."}], "extra_vocabulary": [{"en": "description", "ar": "وصف"}, {"en": "Lake Powell", "ar": "بحيرة \"باول\""}, {"en": "sandstone", "ar": "حجر رملي"}, {"en": "location", "ar": "موقع"}, {"en": "diary", "ar": "مفكرة يومية"}, {"en": "tiny", "ar": "ضئيل"}, {"en": "festival", "ar": "احتفال"}, {"en": "ride", "ar": "جولة - يركب"}, {"en": "perfect", "ar": "ملائم / مثالي"}, {"en": "excited", "ar": "متحمس"}, {"en": "tickets", "ar": "تذاكر"}, {"en": "palm trees", "ar": "شجر النخيل"}, {"en": "limestone", "ar": "حجر جيرى"}, {"en": "national", "ar": "وطنى - قومى"}, {"en": "brochure", "ar": "نشرة - منشور"}], "main_points": [{"topic": "Rainbow Bridge National Monument", "word": "arches", "sentence": "Rainbow Bridge is one of the largest natural arches in the world."}, {"topic": "Rainbow Bridge National Monument", "word": "sandstone", "sentence": "It's made of red and brown sandstone."}, {"topic": "Rainbow Bridge National Monument", "word": "eroded a hole", "sentence": "A river eroded a hole in the sandstone and has formed the arch over many years."}, {"topic": "The Pinnacles", "word": "formations", "sentence": "The Pinnacles are one of the most unusual geological formations."}, {"topic": "The Pinnacles", "word": "white rocks", "sentence": "The Pinnacles are a group of tall white rocks in Nambung National Park."}, {"topic": "The Pinnacles", "word": "limestone", "sentence": "The Pinnacles are made of limestone."}], "texts": [{"type": "reading", "title": "Rainbow Bridge National Monument - Utah, U.S.A", "paragraphs": [{"heading": "", "en": "Rainbow Bridge is one of the largest natural arches in the world.", "ar": "جسر قوس قزح هو واحد من أكبر الأقواس الطبيعية في العالم."}, {"heading": "", "en": "It is also 200 million years old.", "ar": "يبلغ عمره أيضًا 200 مليون سنة."}, {"heading": "", "en": "It is on Lake Powell in Utah, U.S.A.", "ar": "يقع في بحيرة باول في ولاية يوتا بالولايات المتحدة الأمريكية."}, {"heading": "", "en": "It is 88 meters tall and it is made of red and brown sandstone.", "ar": "يبلغ ارتفاعه 88 متراً وهو مصنوع من الحجر الرملي الأحمر والبني."}, {"heading": "", "en": "A river eroded a hole in the sandstone and has formed the arch over many, many years.", "ar": "قام نهر بنحت حفرة في الحجر الرملي وشكل القوس على مدار سنوات عديدة جداً."}, {"heading": "", "en": "Rainbow Bridge has been a National Monument since 1910.", "ar": "يعتبر جسر قوس قزح نصباً تذكارياً وطنياً منذ عام 1910."}, {"heading": "", "en": "If you want to visit it, you have to take a boat, ride a horse, or walk to it.", "ar": "إذا كنت ترغب في زيارته، فعليك أن تستقل قارباً أو تركب حصاناً أو تمشي إليه."}, {"heading": "", "en": "It is in a very hot desert.", "ar": "يقع في صحراء شديدة الحرارة."}, {"heading": "", "en": "So, you should visit it in the spring or in the fall.", "ar": "لذا، يجب عليك زيارته في الربيع أو الخريف."}, {"heading": "", "en": "Don't forget to take your water bottle and a sun hat!", "ar": "لا تنس أن تأخذ زجاجة الماء وقبعة الشمس!"}], "dialogue": []}, {"type": "reading", "title": "The Pinnacles", "paragraphs": [{"heading": "", "en": "The Pinnacles are one of the most unusual geological formations in Western Australia.", "ar": "تعتبر القمم الصخرية واحدة من أكثر التكوينات الجيولوجية غير العادية في غرب أستراليا."}, {"heading": "", "en": "They are a group of tall white rocks in the Nambung National Park.", "ar": "وهي عبارة عن مجموعة من الصخور البيضاء الطويلة في حديقة نامبونج الوطنية."}, {"heading": "", "en": "The Pinnacles are 25,000 to 30,000 years old.", "ar": "يبلغ عمر القمم الصخرية من 25,000 إلى 30,000 سنة."}, {"heading": "", "en": "They are made of white limestone which the rain and wind have eroded into different shapes.", "ar": "وهي مصنوعة من الحجر الجيري الأبيض الذي نحتته الأمطار والرياح إلى أشكال مختلفة."}, {"heading": "", "en": "The tallest columns are between three and five meters high.", "ar": "يتراوح ارتفاع أطول الأعمدة بين ثلاثة وخمسة أمتار."}, {"heading": "", "en": "If you want to visit the Pinnacles, the best time of day to see them is in the early morning or late afternoon.", "ar": "إذا كنت ترغب في زيارة القمم الصخرية، فإن أفضل وقت في اليوم لرؤيتها هو في الصباح الباكر أو في وقت متأخر من بعد الظهر."}, {"heading": "", "en": "At these times, the sun makes them look orange against the yellow sand dunes of the desert.", "ar": "في هذه الأوقات، تجعلها الشمس تبدو برتقالية اللون مقابل الكثبان الرملية الصفراء في الصحراء."}, {"heading": "", "en": "The best time of year to see them is between August and October when the desert is full of beautiful wild flowers!", "ar": "أفضل وقت في السنة لرؤيتها هو بين أغسطس وأكتوبر عندما تكون الصحراء مليئة بالزهور البرية الجميلة!"}, {"heading": "", "en": "You can drive there from the city of Perth in two hours.", "ar": "يمكنك القيادة إلى هناك من مدينة بيرث في غضون ساعتين."}], "dialogue": []}, {"type": "reading", "title": "A Balloon Ride", "paragraphs": [{"heading": "The Beginning", "en": "Mariam loved watching birds and always wished she could fly like them.", "ar": "أحبت مريم مراقبة الطيور وتمنت دائماً لو استطاعت الطيران مثلها."}, {"heading": "The Beginning", "en": "Mariam's dad came home with exciting news \"Look!\" he said. \"I've got tickets for the Luxor hot air balloon festival!\"", "ar": "عاد والد مريم إلى المنزل بأخبار مثيرة، وقال \"انظري! لقد حصلت على تذاكر لمهرجان الأقصر للمناطيد!\""}, {"heading": "The Beginning", "en": "Mariam was very excited. She thought about the festival all week.", "ar": "كانت مريم متحمسة للغاية. فكرت في المهرجان طوال الأسبوع."}, {"heading": "The Middle", "en": "Finally, the day arrived.", "ar": "أخيراً، جاء اليوم الموعود."}, {"heading": "The Middle", "en": "Mariam was watching the balloons when she saw a tall man with a special coat and a hat on his head.", "ar": "كانت مريم تراقب المناطيد عندما رأت رجلاً طويلاً يرتدي معطفاً خاصاً وقبعة على رأسه."}, {"heading": "The Middle", "en": "He was a hot air balloon pilot! As he walked away, a book fell out of his bag.", "ar": "لقد كان طيار منطاد! بينما كان يبتعد، سقط كتاب من حقيبته."}, {"heading": "The Middle", "en": "Mariam ran to pick it up and give it back to him.", "ar": "ركضت مريم لالتقاطه وإعادته إليه."}, {"heading": "The Middle", "en": "\"Oh, thank you!\" the man said. \"This book is very important to me. It's a diary about everywhere I have traveled in my balloon. I want to thank you. Would you like to have a ride?\"", "ar": "قال الرجل: \"أوه، شكراً لك! هذا الكتاب مهم جداً بالنسبة لي. إنه مفكرة يومية عن كل مكان سافرت إليه في منطادي. أريد أن أشكرك. هل تودين القيام بجولة؟\""}, {"heading": "The Middle", "en": "And he pointed to a colorful balloon. \"Yes, please!\" Mariam and her parents said.", "ar": "وأشار إلى منطاد ملون. قالت مريم ووالداها: \"نعم، من فضلك!\""}, {"heading": "The Middle", "en": "\"It's perfect weather today, with no rain and a gentle wind,\" he said.", "ar": "قال: \"الطقس مثالي اليوم، مع عدم وجود أمطار ورياح لطيفة،\""}, {"heading": "The End", "en": "Soon, they were flying over the beautiful city of Luxor.", "ar": "سرعان ما كانوا يحلقون فوق مدينة الأقصر الجميلة."}, {"heading": "The End", "en": "The wind blew them gently through the clear blue sky.", "ar": "هبت الرياح بهم بلطف عبر السماء الزرقاء الصافية."}, {"heading": "The End", "en": "They saw palm trees, dunes, and mountains.", "ar": "رأوا أشجار النخيل والكثبان الرملية والجبال."}, {"heading": "The End", "en": "The Nile looked like a silver ribbon.", "ar": "بدا النيل وكأنه شريط فضي."}, {"heading": "The End", "en": "Everything was quiet, and the houses, temples, and boats were tiny.", "ar": "كان كل شيء هادئاً، وكانت المنازل والمعابد والقوارب ضئيلة الحجم."}, {"heading": "The End", "en": "The sun shone and it felt like they could touch the clouds.", "ar": "أشرقت الشمس وشعروا وكأنهم يستطيعون لمس الغيوم."}, {"heading": "The End", "en": "\"Now I know what it's like to be a bird!\" said Mariam.", "ar": "قالت مريم: \"الآن أعرف كيف يكون شعور الطيور!\""}], "dialogue": []}], "verbs": [{"present": "wish", "past": "wished", "pp": "wished", "ar": "يتمنى"}, {"present": "travel", "past": "traveled", "pp": "traveled", "ar": "يسافر"}, {"present": "thank", "past": "thanked", "pp": "thanked", "ar": "يشكر"}, {"present": "blow", "past": "blew", "pp": "blown", "ar": "يهب [الرياح]"}, {"present": "shine", "past": "shone", "pp": "shone", "ar": "تشرق [الشمس]"}], "definitions": [{"word": "ribbon", "definition": "a long, soft piece of material (قطعة طويلة وناعمة من مادة ما)"}, {"word": "gentle", "definition": "slow, not fast or extreme (بطىء، ليس سريعًا أو شديدًا)"}, {"word": "basket", "definition": "people use this to carry things, and a big one can carry people (يستخدم الناس هذا لحمل الأشياء، ويمكن لسلة كبيرة أن تحمل الناس)"}, {"word": "flame", "definition": "the burning gas that you see in a fire (الغاز المحترق الذى تراه فى النار)"}, {"word": "light / lit", "definition": "to make something start to burn (يجعل شىء ما يحترق)"}], "expressions": [{"en": "fell out of", "ar": "سقط من"}, {"en": "pick up", "ar": "يلتقط"}, {"en": "give ... back", "ar": "يعيد"}, {"en": "point to", "ar": "يشير إلى"}, {"en": "fly over", "ar": "يُحلق فوق"}, {"en": "walk away", "ar": "يرحل / يبتعد"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
