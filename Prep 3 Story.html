// ===================== دوال HTML المساعدة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function playBar(secId) {
    return `<div class="sec-play-bar">
        <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${secId}')">▶ تشغيل القسم</button>
        <button class="big-btn pause-btn" onclick="pauseAll()">⏸ إيقاف مؤقت</button>
        <button class="big-btn stop-btn" onclick="stopAll()">⏹ إيقاف</button>
    </div>`;
}

// ===================== بناء الواجهة =====================
function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${speakText}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${finalSpeak}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function makeStorySection(secId, storyData) {
        return `<div class="story-card">
            ${storyData.map((s,i) => {
                const id = `${secId}_story_${i}`;
                let enText = s.en;
                let speaker = '';
                let dialogueText = enText;
                const colonIndex = enText.indexOf(': ');
                if (colonIndex > 0) {
                    speaker = enText.substring(0, colonIndex);
                    dialogueText = enText.substring(colonIndex + 2);
                }
                const emoji = speaker ? '💬' : '📖';
                const wordHtml = makeWordSpans(dialogueText);
                let speakerHtml = '';
                if (speaker) {
                    speakerHtml = `<span class="speaker-label">${emoji} ${speaker}</span> `;
                }
                return `<div class="sentence" id="${id}" data-speak="${cleanForSpeech(s.en)}" onclick="playOne('${id}')">
                    ${speakerHtml} ${wordHtml}
                </div> `;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    function buildChapterContent(chapter, tabId) {
        let html = '';
        
        // 1. Vocabulary
        if (chapter.vocab && chapter.vocab.length > 0) {
            const secId = `${tabId}_vocab`;
            html += `<div class="section-block" id="${secId}">
                <div class="sec-title">🔑 Vocabulary</div>
                <div class="sec-body">
                    ${playBar(secId)}
                    <div class="info-box"><div class="vocab">${makePills(chapter.vocab, secId)}</div></div>
                </div>
            </div>`;
        }

        // 2. Synonyms & Antonyms
        if (chapter.synData && chapter.synData.length > 0) {
            const secId = `${tabId}_syn`;
            html += `<div class="section-block" id="${secId}">
                <div class="sec-title">🔄 Synonyms</div>
                <div class="sec-body">
                    ${playBar(secId)}
                    <div class="rules-grid">${chapter.synData.map((s,i) => makeRuleItem('↔️', secId, i, s.word + " means " + s.syn, s.syn, s.word + " = " + s.syn)).join('')}</div>
                </div>
            </div>`;
        }
        if (chapter.antData && chapter.antData.length > 0) {
            const secId = `${tabId}_ant`;
            html += `<div class="section-block" id="${secId}">
                <div class="sec-title">🚫 Antonyms</div>
                <div class="sec-body">
                    ${playBar(secId)}
                    <div class="rules-grid">${chapter.antData.map((a,i) => makeRuleItem('🛑', secId, i, a.word + " opposite " + a.ant, a.ant, a.word + " × " + a.ant)).join('')}</div>
                </div>
            </div>`;
        }

        // 3. Definitions
        if (chapter.defsData && chapter.defsData.length > 0) {
            const secId = `${tabId}_def`;
            html += `<div class="section-block" id="${secId}">
                <div class="sec-title">📝 Definitions</div>
                <div class="sec-body">
                    ${playBar(secId)}
                    <div class="rules-grid">${chapter.defsData.map((d,i) => makeRuleItem('📖', secId, i, d.word + ": " + d.def, d.def, d.word)).join('')}</div>
                </div>
            </div>`;
        }

        // 4. Reading Text
        if (chapter.readingText && chapter.readingText.length > 0) {
            const secId = `${tabId}_reading`;
            html += `<div class="section-block" id="${secId}">
                <div class="sec-title">📖 Reading Text</div>
                <div class="sec-body">
                    ${playBar(secId)}
                    ${makeStorySection(secId, chapter.readingText)}
                </div>
            </div>`;
        }

        return html;
    }

    let tabsNavHtml = `<div class="tabs-nav">`;
    let tabsContentHtml = ``;
    
    chaptersData.forEach((ch, index) => {
        const isActive = index === 0;
        const tabId = `tab-${ch.id}`;
        
        tabsNavHtml += `<button class="tab-btn ${isActive ? 'active' : ''}" data-target="${tabId}">${ch.label}</button>`;
        tabsContentHtml += `<div class="tab-content ${isActive ? 'active' : ''}" id="${tabId}">${buildChapterContent(ch, tabId)}</div>`;
    });
    tabsNavHtml += `</div>`;

    container.innerHTML = `<div class="tabs-container">${tabsNavHtml}${tabsContentHtml}</div>`;

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            stopAll();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            this.classList.add('active');
            const targetId = this.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');
        });
    });
}

// ===================== نظام الصوت ومحرك النطق =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices();
    populateVoiceSelect();
}

function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    if (!voices.length) return;

    const normalizeLang = (lang) => lang.replace('_', '-');
    const isLangMatch = (voiceLang, targetPrefix) => normalizeLang(voiceLang) === targetPrefix || normalizeLang(voiceLang).startsWith(targetPrefix + '-');

    const usVoice = voices.find(v => isLangMatch(v.lang, 'en-US'));
    const gbVoice = voices.find(v => isLangMatch(v.lang, 'en-GB'));

    const options = [];
    if (usVoice) options.push({ label: '🇺🇸 English (US)', uri: usVoice.voiceURI });
    if (gbVoice) options.push({ label: '🇬🇧 English (UK)', uri: gbVoice.voiceURI });
    
    if (!options.length) {
        const anyEn = voices.filter(v => v.lang.startsWith('en'));
        anyEn.forEach(v => options.push({ label: v.name + ' ('+v.lang+')', uri: v.voiceURI }));
    }

    if (!options.length) {
        note.textContent = '⚠️ لا توجد أصوات إنجليزية متوفرة بالجهاز';
        return;
    } else {
        note.textContent = '';
    }

    const savedURI = localStorage.getItem('voiceURI');
    vs.innerHTML = options.map(o => `<option value="${o.uri}">${o.label}</option>`).join('');
    if (savedURI && options.some(o => o.uri === savedURI)) {
        vs.value = savedURI;
    } else {
        localStorage.setItem('voiceURI', vs.value);
    }
}

document.getElementById('voiceSelect').addEventListener('change', function() {
    localStorage.setItem('voiceURI', this.value);
});

function getSelectedVoice() {
    const uri = localStorage.getItem('voiceURI');
    return voices.find(v => v.voiceURI === uri) || voices.find(v => v.lang.startsWith('en')) || null;
}

window._q = []; 
window._qi = 0;
window._activeUtterances = []; // لمنع الـ Garbage Collection في كروم
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    document.querySelectorAll('.highlight-word').forEach(e => e.classList.remove('highlight-word'));
    currentHighlightedId = null;
}

function showFab(show) {
    if (show) fabPause.classList.add('show');
    else fabPause.classList.remove('show');
}

function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        fabPause.innerHTML = '⏸️';
    } else if (window.speechSynthesis.paused) {
        fabPause.innerHTML = '▶️';
    } else {
        fabPause.innerHTML = '⏯️';
    }
}

function highlightWordByIndex(elementId, charIndex) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const text = el.innerText || el.textContent;
    const wordsSpans = el.querySelectorAll('.word');
    if(!wordsSpans.length) return;

    let accumulatedLength = 0;
    for (let i = 0; i < wordsSpans.length; i++) {
        const spanText = wordsSpans[i].innerText;
        const start = text.indexOf(spanText, accumulatedLength);
        const end = start + spanText.length;

        if (charIndex >= start && charIndex <= end) {
            wordsSpans.forEach(s => s.classList.remove('highlight-word'));
            wordsSpans[i].classList.add('highlight-word');
            break;
        }
        accumulatedLength = end;
    }
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights();
        showFab(false);
        window._activeUtterances = [];
        return;
    }
    const item = window._q[window._qi];
    
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth', block:'nearest'});
            currentHighlightedId = item.id;
        }
    }

    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onboundary = (event) => {
        if (event.name === 'word') {
            highlightWordByIndex(item.id, event.charIndex);
        }
    };

    u.onstart = () => {
        showFab(true);
        updateFabIcon();
    };

    u.onend = function() {
        window._qi++;
        playQueue();
    };

    u.onerror = function(e) {
        console.warn('Speech error', e);
        window._qi++;
        playQueue();
    };

    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._activeUtterances.push(u);
    window.speechSynthesis.speak(u);
}

function playSection(secId) {
    stopAll();
    const secEl = document.getElementById(secId);
    if (!secEl) return;
    
    const els = [...secEl.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        if (el.dataset.speak) {
            window._q.push({id: el.id, text: el.dataset.speak});
        }
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const activeTab = document.querySelector('.tab-content.active');
    if (!activeTab) return;
    
    const els = [...activeTab.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        if (el.dataset.speak) {
            window._q.push({id: el.id, text: el.dataset.speak});
        }
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el || !el.dataset.speak) return;
    
    stopAll();
    window._q.push({id: id, text: el.dataset.speak});
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        updateFabIcon();
    }
}

function stopAll() {
    window._q = []; 
    window._qi = 0;
    window._activeUtterances = [];
    clearAllHighlights();
    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
    showFab(false);
}

function toggleFabPause() {
    pauseAll();
}

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
window.addEventListener('DOMContentLoaded', () => {
    buildAllSections();
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
});
</script>
