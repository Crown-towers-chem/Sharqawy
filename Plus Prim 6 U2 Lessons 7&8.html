ان."}, {"heading": "How can I make my cat feel at home ?", "en": "You should stroke it.", "ar": "يجب عليك مداعبتها."}, {"heading": "How can I make my cat feel at home ?", "en": "This means that you should move your hand over its back, or under its chin - cats love this!", "ar": "وهذا يعني أنه يجب عليك تحريك يدك فوق ظهرها أو تحت ذقنها - القطط تحب هذا!"}, {"heading": "Where do cats like sleeping ?", "en": "They like a warm, comfortable bed, but sometimes they just sleep on the couch!", "ar": "إنهم يحبون السرير الدافئ والمريح، لكنهم في بعض الأحيان ينامون فقط على الأريكة!"}, {"heading": "Where do cats like sleeping ?", "en": "Don't wake it up - cats need to sleep for about 15 hours every day !", "ar": "لا توقظها - فالقطط تحتاج إلى النوم لمدة 15 ساعة يوميًا تقريبًا!"}, {"heading": "What do cats eat ?", "en": "They like small meals at different times in the day.", "ar": "إنهم يحبون الوجبات الصغيرة في أوقات مختلفة من اليوم."}, {"heading": "What do cats eat ?", "en": "Cats shouldn't have much milk to drink.", "ar": "لا ينبغي للقطط أن تشرب الكثير من الحليب."}, {"heading": "What do cats eat ?", "en": "Milk is bad for them. Water is better.", "ar": "الحليب سيء بالنسبة لهم. الماء أفضل."}, {"heading": "What equipment does a cat need ?", "en": "A cat needs a scratch post.", "ar": "تحتاج القطة إلى عمود خدش."}, {"heading": "What equipment does a cat need ?", "en": "This is a strong wooden pole which the cat can sharpen its claws on.", "ar": "هذا عمود خشبي قوي يمكن للقطة أن تشحذ مخالبها عليه."}, {"heading": "What equipment does a cat need ?", "en": "Cats also like toys to play with.", "ar": "تحب القطط أيضًا الألعاب لتلعب بها."}, {"heading": "What equipment does a cat need ?", "en": "A collar with the cat's name and address on it is a good idea.", "ar": "يعد وضع طوق عليه اسم القطة وعنوانها فكرة جيدة."}, {"heading": "What equipment does a cat need ?", "en": "If your cat gets lost, somebody can bring it home to you.", "ar": "إذا ضاعت قطتك، يمكن لشخص ما أن يعيدها إليك إلى المنزل."}, {"heading": "How often should cats go to the vet ?", "en": "Cats should go to the vet once a year for vaccinations.", "ar": "يجب أن تذهب القطط إلى الطبيب البيطري مرة واحدة في السنة للتطعيمات."}, {"heading": "How often should cats go to the vet ?", "en": "These stop them from getting sick.", "ar": "هذه تمنعهم من المرض."}, {"heading": "How often should cats go to the vet ?", "en": "If you look after your cat well, you'll have a new furry friend in your life !", "ar": "إذا اعتنيت بقطتك جيدًا، فسيكون لديك صديق فروي جديد في حياتك!"}], "dialogue": []}, {"type": "reading", "title": "Caring for your turtle", "paragraphs": [{"heading": "What do turtles eat ?", "en": "These animals like to eat flowers and plants.", "ar": "هذه الحيوانات تحب أكل الزهور والنباتات."}, {"heading": "What do turtles eat ?", "en": "You can also buy special turtle food.", "ar": "يمكنك أيضًا شراء طعام خاص للسلاحف."}, {"heading": "How can I make my turtle feel at home ?", "en": "Turtles need a very large space for their home.", "ar": "تحتاج السلاحف إلى مساحة كبيرة جدًا لمنزلها."}, {"heading": "How can I make my turtle feel at home ?", "en": "A bigger turtle needs a bigger space !", "ar": "السلحفاة الأكبر تحتاج إلى مساحة أكبر!"}, {"heading": "How can I make my turtle feel at home ?", "en": "They need clean soil to dig in, too.", "ar": "إنهم بحاجة إلى تربة نظيفة للحفر فيها أيضًا."}, {"heading": "What equipment do turtles need ?", "en": "They sometimes need a heat lamp.", "ar": "إنهم يحتاجون أحيانًا إلى مصباح حراري."}, {"heading": "What equipment do turtles need ?", "en": "This is a special light to keep the turtle nice and warm.", "ar": "هذا ضوء خاص للحفاظ على السلحفاة جميلة ودافئة."}, {"heading": "Where do turtles sleep ?", "en": "Turtles like sleeping in a safe, dark place where the temperature doesn't change.", "ar": "تحب السلاحف النوم في مكان آمن ومظلم حيث لا تتغير درجة الحرارة."}], "dialogue": []}, {"type": "reading", "title": "Caring for your indoor plants", "paragraphs": [{"heading": "Where can I buy an indoor plant ?", "en": "You can buy indoor plants from supermarkets, florists, and garden centers.", "ar": "يمكنك شراء النباتات المنزلية من السوبر ماركت، وبائعي الزهور، ومراكز الحدائق."}, {"heading": "Where can I buy an indoor plant ?", "en": "These are stores that sell many different plants.", "ar": "هذه هي المتاجر التي تبيع العديد من النباتات المختلفة."}, {"heading": "Where can I buy an indoor plant ?", "en": "It might be best to buy from a garden center as the assistants know how to look after the plants and they can give you some useful advice.", "ar": "قد يكون من الأفضل الشراء من مركز الحدائق لأن المساعدين يعرفون كيفية العناية بالنباتات ويمكنهم تزويدك ببعض النصائح المفيدة."}, {"heading": "Where can I buy an indoor plant ?", "en": "Make sure you know what your plant is called so you can find out more about it.", "ar": "تأكد من معرفة اسم نباتك حتى تتمكن من معرفة المزيد عنه."}, {"heading": "Where should I put my indoor plant ?", "en": "Some plants need to be in a warm, sunny place with a lot of light, while others prefer a cool place that isn't sunny.", "ar": "تحتاج بعض النباتات إلى التواجد في مكان دافئ ومشمس به الكثير من الضوء، بينما يفضل البعض الآخر مكانًا باردًا غير مشمس."}, {"heading": "Where should I put my indoor plant ?", "en": "Look on the internet to find the best place for your plant.", "ar": "ابحث على الإنترنت للعثور على أفضل مكان لنباتك."}, {"heading": "Where should I put my indoor plant ?", "en": "Most plants don't like you to move them.", "ar": "معظم النباتات لا تحب أن تحركها."}, {"heading": "Where should I put my indoor plant ?", "en": "So, find the perfect place and leave it there.", "ar": "لذا، ابحث عن المكان المثالي واتركه هناك."}, {"heading": "Do plants need food ?", "en": "Yes ! The best time to feed your plant is spring and summer.", "ar": "نعم ! أفضل وقت لتغذية نباتك هو الربيع والصيف."}, {"heading": "Do plants need food ?", "en": "Feed them with fertilizer. This is special plant food.", "ar": "أطعمهم بالسماد. هذا طعام نباتي خاص."}, {"heading": "Do plants need food ?", "en": "Read the instructions carefully, because too much fertilizer can be bad for plants.", "ar": "اقرأ التعليمات بعناية، لأن الكثير من الأسمدة يمكن أن يكون ضارًا للنباتات."}, {"heading": "How often should I water the plant ?", "en": "Some plants don't need much water and others need more.", "ar": "بعض النباتات لا تحتاج إلى الكثير من الماء والبعض الآخر يحتاج إلى المزيد."}, {"heading": "How often should I water the plant ?", "en": "You can check the internet for more information.", "ar": "يمكنك التحقق من الإنترنت لمزيد من المعلومات."}, {"heading": "How often should I water the plant ?", "en": "If you don't know, it's better to give them too little water than too much.", "ar": "إذا كنت لا تعرف، فمن الأفضل إعطاؤهم القليل جدًا من الماء بدلاً من الكثير."}, {"heading": "How should I clean my indoor plant ?", "en": "Use a soft brush or cotton cloth to dust the leaves.", "ar": "استخدم فرشاة ناعمة أو قطعة قماش قطنية لمسح الغبار عن الأوراق."}, {"heading": "How should I clean my indoor plant ?", "en": "This means that you clean dry dirt from the leaves.", "ar": "وهذا يعني أنك تنظف الأوساخ الجافة من الأوراق."}, {"heading": "How should I clean my indoor plant ?", "en": "For plants with thicker leaves, spray them with water and this will keep them healthy.", "ar": "بالنسبة للنباتات ذات الأوراق السميكة، قم برشها بالماء فهذا سيحافظ على صحتها."}, {"heading": "Did you know ?", "en": "If you keep your plants happy and healthy, they will live for many years.", "ar": "إذا حافظت على نباتاتك سعيدة وصحية، فسوف تعيش لسنوات عديدة."}], "dialogue": []}, {"type": "reading", "title": "The special house", "paragraphs": [{"heading": "The special house", "en": "It was the summer vacation and Sameh was playing with his kitten in the living room.", "ar": "كانت عطلة الصيف وكان سامح يلعب مع قطته الصغيرة في غرفة المعيشة."}, {"heading": "The special house", "en": "Suddenly, the kitten ran into a small hole in the wall!", "ar": "فجأة، ركضت القطة الصغيرة داخل ثقب صغير في الجدار!"}, {"heading": "The special house", "en": "Sameh put his hand in the hole and tried to get it, but instead he pulled out some paper.", "ar": "وضع سامح يده في الحفرة وحاول إخراجها، لكنه بدلاً من ذلك أخرج بعض الورق."}, {"heading": "The special house", "en": "It was very old. It was a message in a child's writing, Hello, I'm Monira ! I live here.", "ar": "كانت قديمة جدا. كانت رسالة بخط طفل، مرحبًا، أنا منيرة! أنا أعيش هنا."}, {"heading": "The special house", "en": "Sameh felt very curious.", "ar": "شعر سامح بفضول شديد."}, {"heading": "The special house", "en": "The next day, Sameh and his sister, Nadine, were feeling bored.", "ar": "في اليوم التالي، كان سامح وأخته نادين يشعران بالملل."}, {"heading": "The special house", "en": "\"Let's go up and look in the spare room,\" said Sameh.", "ar": "قال سامح: \"لنصعد وننظر في الغرفة الإضافية\"."}, {"heading": "The special house", "en": "There, they found some old boxes.", "ar": "هناك، وجدوا بعض الصناديق القديمة."}, {"heading": "The special house", "en": "Sameh looked in a box and found a little house, a doll and a birthday card : To Monira on your birthday, much love, Grandma.", "ar": "نظر سامح في صندوق ووجد منزلاً صغيراً ودمية وبطاقة عيد ميلاد: إلى منيرة في عيد ميلادك، مع كل الحب، الجدة."}, {"heading": "The special house", "en": "They ran downstairs. \"Dad,\" said Sameh. \"Who is Monira ?\"", "ar": "ركضوا إلى الطابق السفلي. قال سامح: \"يا أبي، من هي منيرة؟\""}, {"heading": "The special house", "en": "Dad looked shocked. \"Why did you ask that ?\" he said.", "ar": "بدا الأب مصدوماً. وقال: \"لماذا سألت ذلك؟\""}, {"heading": "The special house", "en": "\"Look at this doll and this card!\" replied Sameh.", "ar": "أجاب سامح: \"انظر إلى هذه الدمية وهذه البطاقة!\""}, {"heading": "The special house", "en": "\"I don't believe it !\" said Dad, \"Let me tell you about the history of this house.\"", "ar": "قال الأب: \"لا أصدق ذلك! دعني أخبرك عن تاريخ هذا المنزل\"."}, {"heading": "The special house", "en": "It was built of bricks and stone in the 1950s.", "ar": "تم بناؤه من الطوب والحجر في الخمسينيات."}, {"heading": "The special house", "en": "My grandma - your great-grandmother - lived here with her mom, dad, and five brothers and sisters!", "ar": "جدتي - جدتك الكبرى - عاشت هنا مع والدتها ووالدها وخمسة إخوة وأخوات!"}, {"heading": "The special house", "en": "\"Do you think they were happy ?\" asked Sameh.", "ar": "سأل سامح: \"هل تعتقد أنهم كانوا سعداء؟\""}, {"heading": "The special house", "en": "\"I think they were very happy, just like we are\" said Dad.", "ar": "قال الأب: \"أعتقد أنهم كانوا سعداء للغاية، تمامًا كما نحن\"."}, {"heading": "The special house", "en": "\"Is the house different now ?\" asked Nadine.", "ar": "سألت نادين: \"هل المنزل مختلف الآن؟\""}, {"heading": "The special house", "en": "\"Not really,\" said Dad, \"The walls are a different color, but that's all. I'm glad it hasn't changed much\".", "ar": "قال الأب: \"ليس حقًا، الجدران بلون مختلف، ولكن هذا كل شيء. أنا سعيد لأنها لم تتغير كثيرًا\"."}, {"heading": "The special house", "en": "\"But you still haven't told us who Monira is !\" said Sameh.", "ar": "قال سامح: \"لكنك لا تزال لم تخبرنا من هي منيرة!\""}, {"heading": "The special house", "en": "\"Monira was your great-grandmother - Grandad's mom !\" said Dad.", "ar": "قال الأب: \"منيرة كانت جدتك الكبرى - والدة جدك!\""}, {"heading": "The special house", "en": "\"The things that you found are from her childhood. I'm so happy we have them ! \"", "ar": "\"الأشياء التي وجدتها هي من طفولتها. أنا سعيد جدًا لأننا حصلنا عليها!\""}], "dialogue": []}, {"type": "reading", "title": "Writing skill: Definitions", "paragraphs": [{"heading": "Definitions", "en": "When we are writing, we can use 'This is', or 'This means that' to explain words to the reader.", "ar": "عندما نقوم بالكتابة يمكننا استخدام 'هذا يكون' أو 'هذا يعني أن' لشرح الكلمات للقارئ."}, {"heading": "Definitions", "en": "Use 'This is' before a noun phrase.", "ar": "استخدم 'هذا يكون' قبل عبارة اسمية."}, {"heading": "Definitions", "en": "A cat needs a scratch post. This is a strong wooden pole which the cat can sharpen its claws on.", "ar": "تحتاج القطة إلى عمود خدش. هذا عمود خشبي قوي يمكن للقطة أن تشحذ مخالبها عليه."}, {"heading": "Definitions", "en": "Use 'This means that' before a full sentence with a subject and a verb.", "ar": "استخدم 'هذا يعني أن' قبل جملة كاملة تتكون من فاعل وفعل."}, {"heading": "Definitions", "en": "Stroke it. This means that you should move your hand over its back or under its chin-cats love this!", "ar": "داعبها. وهذا يعني أنه يجب عليك تحريك يدك فوق ظهرها أو تحت ذقنها - القطط تحب هذا!"}, {"heading": "Note", "en": "When writing lists, remember to add commas.", "ar": "عندما تكتب قائمة، تذكر أن تضيف الفاصلة السفلية بين العناصر المختلفة."}, {"heading": "Note", "en": "Plants need sunlight, space, fertilizers and water.", "ar": "تحتاج النباتات إلى ضوء الشمس والمساحة والأسمدة والماء."}], "dialogue": []}], "verbs": [{"present": "dig", "past": "dug", "pp": "dug", "ar": "يحفر"}, {"present": "feed", "past": "fed", "pp": "fed", "ar": "يطعم"}, {"present": "sleep", "past": "slept", "pp": "slept", "ar": "ينام"}, {"present": "sell", "past": "sold", "pp": "sold", "ar": "يبيع"}], "definitions": [{"word": "scratch post", "definition": "a strong wooden pole which the cat can sharpen its claws on"}, {"word": "vaccination", "definition": "a treatment from the vet to stop pets getting sick"}, {"word": "furry", "definition": "have a lot of soft hair"}, {"word": "collar", "definition": "a long thin piece of leather to wear around its neck"}, {"word": "fertilizer", "definition": "special food for plants"}, {"word": "florist", "definition": "a shop which sells cut flowers for the home"}, {"word": "dust", "definition": "dry dirt"}, {"word": "curious", "definition": "interested, feeling you want to know more"}, {"word": "brick", "definition": "a small block for building"}, {"word": "stroke", "definition": "you should move your hand over cat's back or under its chin"}, {"word": "shocked", "definition": "very surprised"}, {"word": "great-grandmother", "definition": "the mother of your grandparent"}, {"word": "spare room", "definition": "a room that is used for visitors or to put things in"}, {"word": "kitten", "definition": "a baby cat"}, {"word": "remove", "definition": "take off"}], "expressions": [{"en": "look after", "ar": "يعتني بـ"}, {"en": "feel at home", "ar": "يشعر كأنه في موطنه"}, {"en": "get lost", "ar": "يتوه / يضل الطريق"}, {"en": "go up", "ar": "يصعد"}, {"en": "remove bugs", "ar": "يزيل حشرات"}, {"en": "pull out", "ar": "يسحب للخارج"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
