 the ruins of Great Zimbabwe."}, {"topic": "Man-made wonders of Africa", "word": "monument", "sentence": "The Afrikaans Language Monument is a newer monument in South Africa."}, {"topic": "Storm-chasers", "word": "hurricane", "sentence": "Storm-chasers are people who travel to places when extreme weather is forecast."}, {"topic": "Storm-chasers", "word": "close - study", "sentence": "They get close to the weather event to study it."}], "texts": [{"type": "reading", "title": "Man-made Wonders of Africa", "paragraphs": [{"heading": "Introduction", "en": "The natural world in Africa is beautiful, but people in this continent have made many incredible things, too.", "ar": "العالم الطبيعي في أفريقيا جميل، لكن الناس في هذه القارة صنعوا العديد من الأشياء المذهلة أيضًا."}, {"heading": "Wonders in Egypt", "en": "Some of the most important man-made wonders are in Egypt: the Pyramids of Giza, the Sphinx, the temples of Abu Simbel, and the Valley of the Kings.", "ar": "بعض من أهم العجائب التي صنعها الإنسان توجد في مصر: أهرامات الجيزة، وأبو الهول، ومعابد أبو سمبل، ووادي الملوك."}, {"heading": "History of Egypt", "en": "People come from all over the world to visit these places and learn about Egypt's history.", "ar": "يأتي الناس من جميع أنحاء العالم لزيارة هذه الأماكن والتعرف على تاريخ مصر."}, {"heading": "More in Africa", "en": "But there's a lot more to see in Africa.", "ar": "ولكن هناك الكثير لرؤيته في أفريقيا."}, {"heading": "North Africa Paintings", "en": "In North Africa, there are paintings on rocks and in caves which people made thousands of years ago.", "ar": "في شمال أفريقيا، توجد رسومات على الصخور وفي الكهوف صنعها الناس منذ آلاف السنين."}, {"heading": "Ancient Life", "en": "They often show animals and people.", "ar": "غالبًا ما تظهر حيوانات وأشخاصًا."}, {"heading": "The Sahara's Past", "en": "Archaeologists think that the Sahara wasn't as dry in the past because some of the paintings show animals such as crocodiles that live in water.", "ar": "يعتقد علماء الآثار أن الصحراء الكبرى لم تكن جافة في الماضي لأن بعض اللوحات تظهر حيوانات مثل التماسيح التي تعيش في الماء."}, {"heading": "Great Zimbabwe", "en": "In Zimbabwe, there are the ruins of Great Zimbabwe, an important city which was built between the 11th and 15th centuries.", "ar": "في زيمبابوي، توجد أطلال زيمبابوي العظمى، وهي مدينة مهمة بنيت بين القرنين الحادي عشر والخامس عشر."}, {"heading": "Ancient Trade", "en": "It had very large stone walls, and people here sold lots of things to different countries around the world.", "ar": "كان لها جدران حجرية كبيرة جدًا، وباع الناس هنا الكثير من الأشياء لدول مختلفة حول العالم."}, {"heading": "South Africa Monument", "en": "A newer monument is in South Africa.", "ar": "يوجد نصب تذكاري أحدث في جنوب أفريقيا."}, {"heading": "Afrikaans Language Monument", "en": "The Afrikaans Language Monument is made of stone columns and opened in 1975.", "ar": "نصب اللغة الأفريكانية مصنوع من أعمدة حجرية وافتتح في عام 1975."}, {"heading": "Language Development", "en": "The Afrikaans language developed when people from other countries came to Africa.", "ar": "تطورت اللغة الأفريكانية عندما جاء أشخاص من بلدان أخرى إلى أفريقيا."}, {"heading": "Modern Usage", "en": "The language has words from lots of different countries, and is now used in South Africa and Namibia.", "ar": "تحتوي اللغة على كلمات من العديد من البلدان المختلفة، وتُستخدم الآن في جنوب أفريقيا وناميبيا."}, {"heading": "Rwanda Adventure", "en": "Visitors to Rwanda can have an amazing rainforest adventure on The Canopy Walk in Nyungwe National Park.", "ar": "يمكن لزوار رواندا خوض مغامرة مذهلة في الغابة المطيرة في ممشى كانوبي في حديقة نيونغوي الوطنية."}, {"heading": "The Bridge", "en": "The bridge was built in 2010.", "ar": "بني الجسر في عام 2010."}, {"heading": "Bridge Dimensions", "en": "It's 160 meters long and 74 meters above the ground.", "ar": "يبلغ طوله 160 مترًا وارتفاعه 74 مترًا فوق سطح الأرض."}, {"heading": "Wildlife Viewing", "en": "It is in the highest part of the trees, so visitors can see monkeys and birds.", "ar": "يقع في أعلى جزء من الأشجار، لذا يمكن للزوار رؤية القرود والطيور."}], "dialogue": []}, {"type": "reading", "title": "The storm-chaser", "paragraphs": [{"heading": "Kamal's Parents", "en": "Kamal's parents often went to other countries for their work.", "ar": "غالبًا ما كان والدا كمال يذهبان إلى بلدان أخرى من أجل عملهما."}, {"heading": "The First Trip", "en": "Two years ago, he went with them for the first time.", "ar": "منذ عامين، ذهب معهما لأول مرة."}, {"heading": "Storm-Chasers", "en": "Kamal was very excited because his parents were storm-chasers!", "ar": "كان كمال متحمسًا جدًا لأن والديه كانا من مطاردي العواصف!"}, {"heading": "Defining Storm-Chasers", "en": "These are people who travel to places when extreme weather is forecast.", "ar": "هؤلاء هم الأشخاص الذين يسافرون إلى الأماكن عندما يتم التنبؤ بطقس قاسٍ."}, {"heading": "Studying Weather", "en": "They get close to the weather event to study it.", "ar": "يقتربون من الحدث الجوي لدراسته."}, {"heading": "Trip to U.S.A", "en": "Kamal and his parents flew to the U.S.A where they could study hurricanes.", "ar": "سافر كمال ووالداه إلى الولايات المتحدة الأمريكية حيث تمكنوا من دراسة الأعاصير."}, {"heading": "Helping Out", "en": "\"How can I help you when you work?\" Kamal asked them when they arrived.", "ar": "سألهم كمال عندما وصلوا: \"كيف يمكنني مساعدتكم عندما تعملون؟\""}, {"heading": "Taking Photos", "en": "\"You can take some photos,\" they said, and they took out a new camera.", "ar": "قالوا: \"يمكنك التقاط بعض الصور\"، وأخرجوا كاميرا جديدة."}, {"heading": "Seeing a Hurricane", "en": "Kamal had seen thunderstorms in Egypt, but not a hurricane.", "ar": "كان كمال قد رأى عواصف رعدية في مصر، لكن ليس إعصارًا."}, {"heading": "Close Encounter", "en": "When the hurricane was twenty kilometers away, they drove out to see it.", "ar": "عندما كان الإعصار على بعد عشرين كيلومترًا، خرجوا بالسيارة لرؤيته."}, {"heading": "Taking Notes", "en": "His parents took notes about how big the hurricane was.", "ar": "دون والداه ملاحظات حول مدى كبر الإعصار."}, {"heading": "Strong Winds", "en": "The wind was very strong and Kamal took many photos through the car window.", "ar": "كانت الرياح قوية جدًا والتقط كمال العديد من الصور من نافذة السيارة."}, {"heading": "Feeling Safe", "en": "\"Are you frightened?\" his dad asked Kamal.", "ar": "سأله والده: \"هل أنت خائف؟\""}, {"heading": "Trusting Parents", "en": "\"No, because I know you'll keep me safe,\" said Kamal.", "ar": "قال كمال: \"لا، لأنني أعلم أنكما ستحافظان على سلامتي\"."}, {"heading": "Driving Away", "en": "When the storm came too near to them, they drove away.", "ar": "عندما اقتربت العاصفة منهم كثيرًا، رحلوا بالسيارة."}, {"heading": "Many Places", "en": "Since that trip, Kamal has been to many other places with his parents.", "ar": "منذ تلك الرحلة، ذهب كمال إلى العديد من الأماكن الأخرى مع والديه."}, {"heading": "Extreme Weather Events", "en": "He has seen heavy snow in the mountains, floods in Sudan and amazing dust storms in the desert.", "ar": "لقد رأى ثلوجًا كثيفة في الجبال، وفيضانات في السودان وعواصف ترابية مذهلة في الصحراء."}, {"heading": "Learning Causes", "en": "He has learned a lot about the causes of extreme weather, such as global warming, and he has taken hundreds of photos.", "ar": "لقد تعلم الكثير عن أسباب الطقس القاسي، مثل الاحتباس الحراري، والتقط مئات الصور."}, {"heading": "The Competition", "en": "Last year, his mom said, \"Why don't you send some photos to an online competition?\"", "ar": "في العام الماضي، قالت والدته: \"لماذا لا ترسل بعض الصور إلى مسابقة عبر الإنترنت؟\""}, {"heading": "Winning Prize", "en": "So, Kamal sent the photos you can see below. He won first prize for child photographers!", "ar": "لذلك، أرسل كمال الصور التي يمكنك رؤيتها أدناه. لقد فاز بالجائزة الأولى للمصورين الأطفال!"}], "dialogue": []}], "verbs": [{"present": "photograph", "past": "photographed", "pp": "", "ar": "يصور"}, {"present": "develop", "past": "developed", "pp": "", "ar": "يتطور"}, {"present": "drive", "past": "drove", "pp": function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
