places, activities, and ideas."}, {"topic": "My community", "word": "citizenship - part", "sentence": "Good citizenship is an important part of being in a community."}, {"topic": "The history of Ancient Egypt", "word": "country - history", "sentence": "Egypt is a country with a very long and interesting history."}, {"topic": "The history of Ancient Egypt", "word": "separate - areas", "sentence": "There were two separate areas, Lower Egypt and Upper Egypt."}, {"topic": "The history of Ancient Egypt", "word": "join - unite", "sentence": "Mena joined the two parts to unite the country of Egypt."}, {"topic": "The history of Ancient Egypt", "word": "dynasties - control", "sentence": "Important dynasties controlled Egypt for many years."}], "texts": [{"type": "reading", "title": "My community", "paragraphs": [{"en": "A community is a group of people who live and work together in the same area.", "ar": "المجتمع هو مجموعة من الناس الذين يعيشون ويعملون معًا في نفس المنطقة."}, {"en": "We can be part of many different communities at the same time.", "ar": "يمكننا أن نكون جزءًا من العديد من المجتمعات المختلفة في نفس الوقت."}, {"en": "A community is more than your house, family, or your neighborhood.", "ar": "المجتمع هو أكثر من منزلك أو عائلتك أو حيك."}, {"en": "It is a mixture of people, places, activities, and ideas.", "ar": "إنه مزيج من الناس والأماكن والأنشطة والأفكار."}, {"en": "My community includes my family, my neighbors, my friends, and my school.", "ar": "مجتمعي يضم عائلتي وجيراني وأصدقائي ومدرستي."}, {"en": "There are probably important places in your city or village that you often visit.", "ar": "ربما توجد أماكن مهمة في مدينتك أو قريتك تزورها غالبًا."}, {"en": "You can also have a community there.", "ar": "يمكنك أيضًا الحصول على مجتمع هناك."}, {"en": "For me, I am part of the community at my sports club, too.", "ar": "بالنسبة لي، أنا جزء من المجتمع في نادى الرياضي أيضًا."}, {"en": "We practise together and work as a team.", "ar": "نتدرب معًا ونعمل كفريق واحد."}, {"en": "This is also part of being in a community.", "ar": "وهذا أيضًا جزء من التواجد في المجتمع."}, {"en": "Communities are a great way to make new friends, share ideas, and learn from each other.", "ar": "تعد المجتمعات وسيلة رائعة لتكوين صداقات جديدة ومشاركة الأفكار والتعلم من بعضنا البعض."}, {"en": "When you act in a way that is good for your community, this is called good citizenship.", "ar": "عندما تتصرف بطريقة جيدة لمجتمعك، فإن هذا يسمى المواطنة الصالحة."}, {"en": "This means that you work hard to help the people around you by behaving in a kind and fair way.", "ar": "وهذا يعني أنك تعمل بجد لمساعدة الأشخاص من حولك من خلال التصرف بطريقة طيبة وعادلة."}, {"en": "Good citizenship is an important part of being in a community.", "ar": "المواطنة الصالحة جزء مهم من التواجد في المجتمع."}, {"en": "I am always kind and polite and help people in my community.", "ar": "أنا دائمًا لطيف ومهذب وأساعد الناس في مجتمعي."}, {"en": "Being part of a community is important because it helps us to feel safe and happy in the place we live.", "ar": "يعد كونك جزءًا من المجتمع أمرًا مهمًا لأنه يساعدنا على الشعور بالأمان والسعادة في المكان الذي نعيش فيه."}], "dialogue": []}, {"type": "reading", "title": "The history of Ancient Egypt", "paragraphs": [{"en": "Egypt is a country with a very long and interesting history.", "ar": "مصر بلد له تاريخ طويل ومثير للاهتمام."}, {"en": "People started to live near the Nile about 9,000 years ago, in 7000 BCE.", "ar": "بدأ الناس يعيشون بالقرب من النيل منذ حوالي 9000 عام، في عام 7000 قبل الميلاد."}, {"en": "At first, there were two separate areas.", "ar": "في البداية، كان هناك منطقتان منفصلتان."}, {"en": "Lower Egypt was in the north, where the Nile joins the sea.", "ar": "كانت مصر السفلى في الشمال، حيث يلتقي النيل بالبحر."}, {"en": "Upper Egypt was in the south, where the Nile flows through the deserts of Africa.", "ar": "كانت مصر العليا في الجنوب، حيث يتدفق النيل عبر صحاري أفريقيا."}, {"en": "In about 3200 BCE, one pharaoh, Mena joined these two parts to unite the country of Egypt.", "ar": "في حوالي عام 3200 قبل الميلاد، قام فرعون واحد، وهو مينا، بضم هذين الجزأين لتوحيد دولة مصر."}, {"en": "Egypt controlled the Nile as far as boats could sail on it, so it became very powerful.", "ar": "سيطرت مصر على النيل إلى الحد الذي تستطيع فيه القوارب الإبحار فيه، فأصبحت قوية جدًا."}, {"en": "There are three main parts to the history of Ancient Egypt: the Old Kingdom, the Middle Kingdom, and the New Kingdom.", "ar": "هناك ثلاثة أجزاء رئيسية لتاريخ مصر القديمة: الدولة القديمة، والدولة الوسطى، والدولة الحديثة."}, {"en": "Important dynasties controlled Egypt for many years.", "ar": "سيطرت سلالات مهمة على مصر لسنوات عديدة."}, {"en": "These were important families who ruled the country.", "ar": "كانت هذه عائلات مهمة حكمت البلاد."}], "dialogue": []}, {"type": "reading", "title": "How do we know so much about the history of Egypt?", "paragraphs": [{"en": "Egyptians at that time used scribes to write down everything that happened.", "ar": "استخدم المصريون في ذلك الوقت الكتبة لتدوين كل ما حدث."}, {"en": "Scribes were very important people.", "ar": "كان الكتبة أشخاصًا مهمين جدًا."}, {"en": "They worked for the ruling dynasties.", "ar": "لقد عملوا لدى السلالات الحاكمة."}, {"en": "They wrote in hieroglyphs, which are pictures or symbols that can mean one word or many ideas.", "ar": "لقد كتبوا بالهيروغليفية، وهي عبارة عن صور أو رموز يمكن أن تعني كلمة واحدة أو أفكارًا كثيرة."}, {"en": "We can see these hieroglyphs today in tombs and museums.", "ar": "يمكننا رؤية هذه الهيروغليفية اليوم في المقابر والمتاحف."}, {"en": "Children learned to become a scribe at school.", "ar": "تعلم الأطفال ليصبحوا كتبة في المدرسة."}, {"en": "Scribes wrote on stone, or on paper made from papyrus reeds.", "ar": "كتب الكتبة على الحجر، أو على ورق مصنوع من نبات البردى."}], "dialogue": []}], "verbs": [{"present": "flow", "past": "flowed", "pp": "flowed", "ar": "يتدفق"}, {"present": "rule", "past": "ruled", "pp": "ruled", "ar": "يحكم"}, {"present": "control", "past": "controlled", "pp": "controlled", "ar": "يتتحكم"}, {"present": "sail", "past": "sailed", "pp": "sailed", "ar": "يبحر"}, {"present": "join", "past": "joined", "pp": "joined", "ar": "يربط / يتصل"}, {"present": "unite", "past": "united", "pp": "united", "ar": "يوحد"}, {"present": "include", "past": "included", "pp": "included", "ar": "يشمل/يتضمن"}, {"present": "behave", "past": "behaved", "pp": "behaved", "ar": "يتصرف"}, {"present": "believe", "past": "believed", "pp": "believed", "ar": "يعتقد/يصدق"}, {"present": "act", "past": "acted", "pp": "acted", "ar": "يؤدى/يفعل"}, {"present": "drink", "past": "drank", "pp": "drunk", "ar": "يشرب"}, {"present": "see", "past": "saw", "pp": "seen", "ar": "يرى"}, {"present": "eat", "past": "ate", "pp": "eaten", "ar": "يأكل"}, {"present": "have", "past": "had", "pp": "had", "ar": "يملك/يتناول"}, {"present": "win", "past": "won", "pp": "won", "ar": "يفوز"}, {"present": "buy", "past": "bought", "pp": "bought", "ar": "يشتري"}, {"present": "go", "past": "went", "pp": "gone", "ar": "يذهب"}, {"present": "take", "past": "took", "pp": "taken", "ar": "يأخذ"}], "definitions": [{"word": "community", "definition": "a group of people who live together in the same area and share activities and ideas"}, {"word": "neighborhood", "definition": "the streets, houses, shops and schools close to where you live"}, {"word": "citizenship", "definition": "behaving in a way that helps your society"}], "expressions": [{"en": "flow through", "ar": "يمر/يتدفق خلال"}, {"en": "write down", "ar": "يدون - يسجل"}, {"en": "This is a red T-shirt.", "ar": "هذا قميص أحمر."}, {"en": "That is a book.", "ar": "ذلك كتاب."}, {"en": "These are nice sunglasses.", "ar": "هذه نظارات شمسية جميلة."}, {"en": "Those are books.", "ar": "تلك كتب."}, {"en": "That book is mine.", "ar": "ذلك الكتاب ملكي."}, {"en": "This ice cream is mine! It isn't yours.", "ar": "هذا الآيس كريم ملكي! إنه ليس ملكك."}, {"en": "She listened to stories.", "ar": "هي استمعت إلى القصص."}, {"en": "She didn't watch the sunrise.", "ar": "هي لم تشاهد شروق الشمس."}, {"en": "He didn't clean the tent.", "ar": "هو لم ينظف الخيمة."}, {"en": "They didn't see the show.", "ar": "هم لم يشاهدوا العرض."}, {"en": "Rami was at the Pyramids yesterday.", "ar": "كان رامي عند الأهرامات أمس."}, {"en": "She wasn't at home two hours ago.", "ar": "لم تكن في المنزل منذ ساعتين."}, {"en": "They weren't at the zoo last week.", "ar": "لم يكونوا في حديقة الحيوان الأسبوع الماضي."}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;

function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!=='Habiba'&&p.heading!=='History'&&p.heading!=='Scribes'){const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
