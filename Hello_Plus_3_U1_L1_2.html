    let result = text;
    result = result.replace(/\([^)]*\)/g, ' '); 
    result = result.replace(/[→]/g, ' ');      
    result = result.replace(/\s+/g, ' ').trim();

}

    {
        "speaker": "Rasha",
        "en": "It is, especially because people help each other. It's a very friendly community."
    },
    {
        "speaker": "Interviewer",
        "en": "What else do you like about it?"
    },
    {
        "speaker": "Rasha",
        "en": "Well, I like that people of all ages are members of the community garden- you know, different generations, from little kids to great-grandfathers."
    },
    {
        "speaker": "Interviewer",
        "en": "Sounds wonderful!"
    },
    {
        "speaker": "Rasha",
        "en": "Yes, it's a nice way to be part of a community, and to enjoy nature, too."
    },
    {
        "speaker": "Interviewer",
        "en": "Thanks, Rasha. If you have a question for Rasha or want to share your experiences of community gardens, then get in touch."
    }
];
const questions = [
    "What is the name of the place where the writer lives?",
    "How old was the great-grandmother last month?",
    "What are the two community projects mentioned in the listening texts?"
];
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

// ===================== بناء الواجهة =====================
function buildAllSections() {
    const container = document.getElementById('sections-container');
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function makePills(arr, sectionId, start=0) { return arr.map((w,i) => { const id=`${sectionId}_p${start+i}`; return `<div class="pill" id="${id}" data-speak="${escapeHtml(cleanForSpeech(w[0]))}" onclick="playOne('${id}')"><span class="en">${makeWordSpans(w[0])}</span><span class="tr">${escapeHtml(w[1])}</span></div>`; }).join(''); }
    function makeRuleItem(icon, sectionId, i, speakText, arText, displayText) { const id=`${sectionId}_${i}`; return `<div class="rule-item" id="${id}" data-speak="${escapeHtml(cleanForSpeech(speakText))}" onclick="playOne('${id}')"><span class="rule-icon">${icon}</span><div class="rule-text"><span class="en">${makeWordSpans(displayText || speakText)}</span><span class="ar">${escapeHtml(arText || '')}</span></div></div>`; }
    function playBar(sectionId) { return `<div class="sec-play-bar"><button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button><button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button><button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button></div>`; }
    function storyItem(s, key, i) { const id=`${key}_${i}`; const spoken=s.speak || s.en || ''; const display=(s.speaker ? `<span class="speaker-label">${escapeHtml(s.speaker)}:</span>` : '') + makeWordSpans(s.en || ''); return `<div class="sentence" id="${id}" data-speak="${escapeHtml(spoken)}" onclick="playOne('${id}')">${display}</div>`; }
    function storyCard(title, arr, key) { return `<div class="story-card"><div style="font-weight:bold;color:var(--A);margin-bottom:10px;">${escapeHtml(title)}</div>${arr.map((s,i)=>storyItem(s,key,i)).join('')}</div>`; }
    function section(title,id,content){return `<div class="section-block" id="${id}"><div class="sec-title">${title}</div><div class="sec-body">${playBar(id)}${content}</div></div>`;}
    const sections=[];
    sections.push(section('📚 Part 1 — Main Vocabulary','secKey',`<div class="info-box"><div class="info-title">Key Vocabulary</div><div class="vocab">${makePills(key_vocab,'secKey')}</div></div><div class="info-box"><div class="info-title">Extra Vocabulary — Lesson 1</div><div class="vocab">${makePills(extra1,'secKeyExtra1')}</div></div><div class="info-box"><div class="info-title">Extra Vocabulary — Lesson 2</div><div class="vocab">${makePills(extra2,'secKeyExtra2')}</div></div>`));
    sections.push(section('🔤 Conjugation of Irregular Verbs','secIrregular',`<div class="rules-grid">${irregular.map((x,i)=>makeRuleItem('🔤','secIrregular',i,`${x[0]}, ${x[1]}, ${x[2]}`,'',`${x[0]} — ${x[1]} — ${x[2]}`)).join('')}</div>`));
    sections.push(section('📝 Study these definitions','secDefinitions',`<div class="rules-grid">${definitions.map((x,i)=>makeRuleItem('📖','secDefinitions',i,`${x.word} | ${x.def}`,x.ar,`${x.word} — ${x.def}`)).join('')}</div>`));
    sections.push(section('🔎 Part 2 — Synonyms and Antonyms','secSynAnt',`<div class="info-box"><div class="info-title">Synonyms</div><div class="rules-grid">${synonyms.map((x,i)=>makeRuleItem('↔','secSyn',i,`${x[0]} — ${x[1]}`,'',`${x[0]} — ${x[1]}`)).join('')}</div></div><div class="info-box"><div class="info-title">Antonyms / Opposites</div><div class="rules-grid">${antonyms.map((x,i)=>makeRuleItem('↕','secAnt',i,`${x[0]} — ${x[1]}`,'',`${x[0]} — ${x[1]}`)).join('')}</div></div>`));
    sections.push(section('🧩 Prefixes & Suffixes','secPrefixes',`<div class="rules-grid">${prefixes.map((x,i)=>makeRuleItem('➕','secPrefixes',i,`${x[0]} plus ${x[1]} | [pause] | ${x[2]}`,'',`${x[0]} + ${x[1]} → ${x[2]}`)).join('')}</div><div class="info-box"><div class="info-title">Important Expressions & Prepositions</div><div class="rules-grid">${expressions.map((x,i)=>makeRuleItem('💬','secExpressions',i,`${x[0]} | ${x[1]}`,'',`${x[0]} — ${x[1]}`)).join('')}${prepositions.map((x,i)=>makeRuleItem('📌','secPrepositions',i,`${x[0]} | ${x[1]}`,'',`${x[0]} — ${x[1]}`)).join('')}</div></div>`));
    sections.push(section('📖 Part 3 — Reading: Lots in common...','secReading',storyCard('Reading — on Lesson 1 SB page 9',reading.map(en=>({en})), 'secReading')));
    sections.push(section('🎧 Listening — Lesson 1 WB page 4','secListening1',storyCard('Listening Lesson 1',listening1,'secListening1')));
    sections.push(section('🎙️ Listening — Lesson 2 SB page 11','secListening2',storyCard('Podcast: Community projects',listening2,'secListening2')));
    sections.push(section('❓ Suggested Questions','secQuestions',`<div class="rules-grid">${questions.map((q,i)=>makeRuleItem('❓','secQuestions',i,q,'',q)).join('')}</div>`));
    container.innerHTML=sections.join('');
}
// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
let voiceLoadAttempt = 0;
const MAX_VOICE_LOAD_ATTEMPTS = 6;
const VOICE_RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];

const normalizeVoiceLang = (lang) => String(lang || '').replace('_', '-');
const isVoiceLangMatch = (voiceLang, targetLang) => {
    const normalized = normalizeVoiceLang(voiceLang).toLowerCase();
    const target = targetLang.toLowerCase();
    return normalized === target || normalized.startsWith(target + '-');
};
const voiceQualityScore = (voice) => {
    const name = String(voice.name || '').toLowerCase();
    let score = 0;
    if (name.includes('google')) score += 30;
    if (name.includes('microsoft')) score += 25;
    if (name.includes('samantha')) score += 20;
    if (voice.localService) score += 2;
    return score;
};
const sortVoicesByQuality = (voiceList) => [...voiceList].sort((a, b) => {
    const scoreDifference = voiceQualityScore(b) - voiceQualityScore(a);
    return scoreDifference || String(a.name || '').localeCompare(String(b.name || ''));
});

function loadVoices() {
    const availableVoices = window.speechSynthesis.getVoices();
    if (availableVoices.length) {
        voices = availableVoices;
        voiceLoadAttempt = 0;
        populateVoiceSelect();
        return;
    }

    if (voiceLoadAttempt < MAX_VOICE_LOAD_ATTEMPTS) {
        const delay = VOICE_RETRY_DELAYS[voiceLoadAttempt] || VOICE_RETRY_DELAYS[VOICE_RETRY_DELAYS.length - 1];
        voiceLoadAttempt++;
        window.setTimeout(loadVoices, delay);
    }
}

function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    if (!vs || !voices.length) return;

    const englishVoices = voices.filter(v =>
        isVoiceLangMatch(v.lang, 'en-US') || isVoiceLangMatch(v.lang, 'en-GB')
    );
    const displayedVoices = englishVoices.length ? sortVoicesByQuality(englishVoices) :
        sortVoicesByQuality(voices.filter(v => normalizeVoiceLang(v.lang).toLowerCase().startsWith('en')));

    if (!displayedVoices.length) {
        note.textContent = '⚠️ No English voice found.';
        return;
    }

    note.textContent = englishVoices.length ? '' : '⚠️ No US/UK voice found; showing English voices.';
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    vs.innerHTML = displayedVoices.map((voice) => {
        const lang = normalizeVoiceLang(voice.lang);
        const label = `${isVoiceLangMatch(lang, 'en-US') ? '🇺🇸 American' : isVoiceLangMatch(lang, 'en-GB') ? '🇬🇧 British' : 'English'} — ${voice.name} (${lang})`;
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = label;
        option.dataset.lang = lang;
        return option.outerHTML;
    }).join('');

    const savedOption = [...vs.options].find(option => option.value === savedURI) ||
        [...vs.options].find(option => option.dataset.lang === savedLang);
    vs.value = savedOption ? savedOption.value : vs.options[0].value;
    const selected = voices.find(v => v.voiceURI === vs.value) || displayedVoices[0];
    localStorage.setItem('voiceURI', selected.voiceURI);
    localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
}

document.getElementById('voiceSelect').addEventListener('change', function() {
    const selected = voices.find(v => v.voiceURI === this.value);
    if (selected) {
        localStorage.setItem('voiceURI', selected.voiceURI);
        localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
    }
});

function getSelectedVoice() {
    const select = document.getElementById('voiceSelect');
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    const selectedURI = savedURI || (select && select.value);
    return voices.find(v => v.voiceURI === selectedURI) ||
        voices.find(v => savedLang && normalizeVoiceLang(v.lang) === savedLang) ||
        voices.find(v => select && v.voiceURI === select.value) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}

function showFab(show) {
    if (show) fabPause.classList.add('show');
    else fabPause.classList.remove('show');
}

function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        fabPause.innerHTML = '⏸️';
    } else if (window.speechSynthesis.paused) {
        fabPause.innerHTML = '▶️';
    } else {
        fabPause.innerHTML = '⏯️';
    }
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights();
        showFab(false);
        return;
    }
    const item = window._q[window._qi];
    if (item.pause) {
        window.setTimeout(() => { window._qi++; playQueue(); }, 450);
        return;
    }
    
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }

    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    // Set the language explicitly; several browsers otherwise ignore the selected voice.
    u.lang = voice ? normalizeVoiceLang(voice.lang) : (localStorage.getItem('voiceLang') || 'en-US');
    if (voice) u.voice = voice;

    u.onstart = () => {
        showFab(true);
        updateFabIcon();
    };

    u.onend = function() {
        window._qi++;
        playQueue();
    };

    u.onerror = function(e) {
        console.warn('Speech error', e);
        window._qi++;
        playQueue();
    };

    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => {
        const trimmed = p.trim();
        if (trimmed) {
            window._q.push({id: id, text: trimmed, pause: trimmed === '[pause]'});
        }
    });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() {
    pauseAll();
}

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
