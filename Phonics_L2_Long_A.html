<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 - Long Vowels: Letter A</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8; --card-color: #ffffff; --accent-color: #2e7d32;
            --text-color: #212121; --highlight-color: #c8e6c9; --speak-highlight: #1b5e20;
            --play-all-btn: #4caf50; --play-shadow: #388e3c; --soft-bg: #e8f5e9;
            --secondary-text-color: #424242; --border-color: #81c784;
            --speech-glow: #ffeb3b;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; text-align: center; color: var(--text-color); transition: background-color 0.3s; }
        .container { max-width: 1000px; margin: 0 auto 50px auto; background-color: var(--card-color); border-radius: 25px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); padding: 40px; border: 8px solid var(--accent-color); transition: border-color 0.3s; }
        h1 { color: var(--accent-color); font-size: 2.3em; margin-bottom: 10px; }
        h2 { color: var(--speak-highlight); border-bottom: 2px solid var(--border-color); display: inline-block; padding-bottom: 5px; }
        h3 { background-color: var(--highlight-color); padding: 12px; border-radius: 10px; margin-top: 30px; text-align: right; direction: ltr; font-size: 1.5em; }

        .speech-controls { background: var(--soft-bg); padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        #speed-value { min-width: 32px; display: inline-block; font-weight: bold; color: var(--accent-color); }
        .theme-switcher { display: flex; gap: 8px; align-items: center; }
        .theme-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 1px #999; }
        .theme-dot.active { box-shadow: 0 0 0 3px #333; }

        .play-btn { background-color: var(--play-all-btn); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-size: 1.05em; box-shadow: 0 5px var(--play-shadow); margin: 10px 6px; transition: 0.1s; font-family: 'Cairo', sans-serif; }
        .play-btn:active { transform: translateY(3px); box-shadow: 0 2px var(--play-shadow); }

        .speaking-highlight {
            background-color: var(--speak-highlight) !important;
            color: white !important;
            border-color: var(--speech-glow) !important;
            box-shadow: 0 0 15px var(--speech-glow);
            transform: scale(1.02);
        }
        .speaking-highlight * { color: #fff !important; }
        .speaking-highlight .hl { color: var(--speech-glow) !important; }

        /* ---------- comparison tables (book: Letter Group + 4 columns) ---------- */
        .note-box { display: flex; align-items: center; gap: 12px; background: var(--soft-bg); border-right: 6px solid var(--accent-color); border-radius: 10px; padding: 8px 12px; margin-top: 12px; text-align: right; direction: ltr; }
        .note-box .dirtag { font-family: 'Roboto', sans-serif; font-weight: 900; color: #1a237e; white-space: nowrap; }
        .note-box .nt { flex: 1; direction: rtl; text-align: right; font-size: .95em; }
        .table-wrap { width: 100%; overflow-x: auto; }
        table.cmp { width: 100%; min-width: 700px; border-collapse: separate; border-spacing: 0; margin-top: 12px; direction: ltr; border-radius: 14px; overflow: hidden; table-layout: fixed; }
        table.cmp th { color: #fff; padding: 11px 10px; font-family: 'Roboto', sans-serif; font-size: .95em; text-align: left; cursor: pointer; user-select: none; }
        table.cmp th.gh { background: var(--accent-color); text-align: center; cursor: default; width: 13%; }
        table.cmp th.colh:hover { filter: brightness(1.12); }
        table.cmp td { border: 1px solid #e3e8ef; padding: 8px 10px; vertical-align: top; background: #fff; text-align: left; }
        table.cmp td.grp { background: #f3f6fb; font-family: 'Roboto', sans-serif; font-weight: 900; color: #1a237e; text-align: center; vertical-align: middle; cursor: pointer; }
        table.cmp td.grp:hover { background: var(--highlight-color); }
        .wp { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; margin: 1px 6px 1px 0; padding: 2px 6px; border-radius: 8px; border: 2px solid transparent; transition: .15s; }
        .wp:hover { background: var(--highlight-color); }
        .wp .w { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 1.15em; }
        .wp.c0 .w { color: #c62828; }
        .wp.cl .w { color: #00875a; }
        .wp .note { font-family: 'Roboto', sans-serif; font-weight: 700; color: #00875a; font-size: .85em; }
        .wp .e { font-size: 1.2em; }
        .mean { direction: rtl; text-align: right; color: #666; font-size: .78em; margin-top: 2px; }
        .rules { text-align: right; direction: rtl; background: #fafbfc; border: 1px solid #e3e8ef; border-radius: 12px; padding: 10px 16px; margin-top: 12px; }
        .rules .rt { font-weight: 900; color: var(--accent-color); margin-bottom: 4px; }
        .rules ul { margin: 0; padding: 0 20px 0 0; }
        .rules li { margin: 3px 0; font-size: .92em; }
        .rules li i { font-family: 'Roboto', sans-serif; direction: ltr; unicode-bidi: embed; }

        /* ---------- tab + card lessons ---------- */
        .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0 6px; }
        .tab { border: 2px solid var(--tc); background: #fff; color: var(--tc); font-family: 'Roboto', 'Cairo', sans-serif; font-weight: 900; font-size: .95em; padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: .15s; }
        .tab.on { background: var(--tc); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
        .sec { display: none; }
        .sec.active { display: block; }
        .sec-head { background: var(--sc); color: #fff; border-radius: 16px; padding: 14px 20px; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; text-align: left; }
        .sec-head .t { font-family: 'Roboto', 'Cairo', sans-serif; font-weight: 900; font-size: 2em; line-height: 1.15; unicode-bidi: plaintext; }
        .sec-head .s { direction: rtl; font-size: 1.02em; opacity: .96; margin-top: 2px; text-align: left; unicode-bidi: plaintext; }
        .sec-play { background: #fff; color: var(--sc); border: none; border-radius: 999px; padding: 9px 18px; font-family: 'Cairo', sans-serif; font-weight: 900; cursor: pointer; box-shadow: 0 4px rgba(0,0,0,.25); }
        .sec-play:active { transform: translateY(2px); box-shadow: 0 2px rgba(0,0,0,.25); }
        .infobox { margin: 14px 0 4px; border: 2px dashed var(--sc); border-radius: 14px; padding: 8px 12px; background: #fff; text-align: left; }
        .irow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
        .badge { background: var(--sc); color: #fff; font-weight: 700; font-size: .85em; padding: 3px 14px; border-radius: 999px; white-space: nowrap; }
        .itx { font-weight: 700; unicode-bidi: plaintext; font-size: 1.02em; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .snd { cursor: pointer; background: var(--sc-bg); border: 2px solid var(--sc); border-radius: 10px; padding: 3px 12px; display: inline-flex; gap: 6px; align-items: center; transition: .15s; font-weight: 700; }
        .snd:hover { transform: translateY(-2px); }
        .snd .en { font-family: 'Roboto', sans-serif; font-weight: 900; }
        .snd .ar { direction: rtl; }
        .cards { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 10px; margin-top: 14px; direction: ltr; }
        .card { display: flex; align-items: center; gap: 10px; background: var(--sc-bg); border: 2px solid var(--sc); border-radius: 14px; padding: 8px 12px; cursor: pointer; text-align: left; transition: .15s; min-height: 64px; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.14); }
        .card .em { font-size: 2.1em; line-height: 1; flex: 0 0 auto; min-width: 1.3em; text-align: center; }
        .card .em.txt { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 1em; background: var(--sc); color: #fff; width: 2.4em; height: 2.4em; min-width: 2.4em; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .card .tx { min-width: 0; }
        .card .en { font-family: 'Roboto', sans-serif; font-weight: 900; font-size: 1.28em; color: #151515; overflow-wrap: anywhere; line-height: 1.15; }
        .card .ar { direction: rtl; text-align: left; color: #555; font-size: .88em; margin-top: 2px; unicode-bidi: plaintext; }
        .hl { color: #d81b60; }
        table.t2 { width: 100%; border-collapse: collapse; margin-top: 16px; direction: ltr; }
        table.t2 td { border: 2px solid var(--sc); padding: 12px 10px; font-size: 1.3em; width: 50%; text-align: center; background: #fff; }
        table.t2 td.k { background: var(--sc-bg); color: var(--sc); font-family: 'Roboto', sans-serif; font-weight: 900; }
        table.t2 td.v { direction: rtl; font-weight: 700; }

        /* ---------- stop + quiz (same as Level 1) ---------- */
        .floating-stop-btn { position: fixed; bottom: 25px; right: 25px; z-index: 1000; background:#d32f2f; color:white; border:none; border-radius:50%; width:64px; height:64px; font-size:1.6em; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; transition: transform 0.15s; }
        .floating-stop-btn:active { transform: scale(0.92); }
        .quiz-question { background:#f9f9f9; border:2px solid var(--border-color); border-radius:12px; padding:15px; margin-bottom:15px; text-align:left; direction:ltr; }
        .quiz-question p.q-text { font-size:1.15em; font-weight:bold; margin:0 0 10px 0; color:var(--text-color); direction: rtl; text-align: right; }
        .quiz-options { display:flex; flex-direction:column; gap:8px; }
        .quiz-option { background:#fff; border:2px solid var(--border-color); border-radius:8px; padding:10px 15px; cursor:pointer; text-align:left; font-family:'Roboto','Cairo',sans-serif; font-weight:700; transition:0.2s; direction:ltr; }
        .quiz-option:hover { background: var(--highlight-color); }
        .quiz-option.correct { background:#a5d6a7 !important; border-color:#2e7d32; color: #1b5e20; }
        .quiz-option.wrong { background:#ef9a9a !important; border-color:#c62828; text-decoration: line-through; }
        .quiz-option.show-correct { background:#a5d6a7 !important; border-color:#2e7d32; }
        .quiz-score { font-size:1.3em; font-weight:bold; color:var(--accent-color); margin-top:15px; }
        #quiz-progress { font-weight:bold; color:var(--secondary-text-color); margin-bottom:8px; }
        .quiz-feedback { font-size:1.4em; font-weight:bold; margin-top:10px; min-height:1.4em; }
        .quiz-feedback.correct { color:#2e7d32; }
        .quiz-feedback.wrong { color:#c62828; }
        .listen { background: var(--play-all-btn); color:#fff; border:none; border-radius:10px; padding:5px 14px; cursor:pointer; font-family:'Cairo',sans-serif; margin-inline-start: 8px; }
        .confetti-piece { position:absolute; top:10%; width:8px; height:8px; opacity:0.95; pointer-events:none; animation: confetti-fall 1.1s ease-out forwards; }
        @keyframes confetti-fall { to { transform: translate(var(--x), 200px) rotate(720deg); opacity:0; } }

        @media (max-width: 700px) {
            body { padding: 10px; }
            .container { padding: 20px 12px; border-radius: 18px; border-width: 5px; }
            h1 { font-size: 1.5em; }
            h3 { font-size: 1.15em; padding: 10px; }
            .speech-controls { padding: 10px; gap: 10px; }
            .control-group { font-size: 0.9em; }
            .play-btn { padding: 10px 18px; font-size: 1em; width: 100%; margin: 6px 0; }
            .note-box { flex-direction: column; align-items: flex-end; gap: 4px; }
            .sec-head .t { font-size: 1.5em; }
            .cards { gap: 6px; }
            .card { flex-direction: column; text-align: center; gap: 2px; padding: 8px 4px; }
            .card .em { font-size: 1.7em; }
            .card .en { font-size: 1em; }
            .card .ar { font-size: .78em; text-align: center; }
            .floating-stop-btn { width: 52px; height: 52px; font-size: 1.3em; bottom: 15px; right: 15px; }
        }
    
        /* ---- footer: under construction + contact ---- */
        .site-footer { max-width: 1000px; margin: 0 auto 90px auto; padding: 26px 20px 24px; border-radius: 25px; background: var(--speak-highlight, #1b5e20); color: #fff; text-align: center; box-shadow: 0 10px 24px rgba(0,0,0,0.18); }
        .site-footer .sf-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.4; margin: 0 0 14px; }
        .site-footer .sf-name { font-family: 'Roboto', 'Cairo', sans-serif; font-weight: 700; font-size: 1.15rem; margin-bottom: 12px; letter-spacing: .3px; }
        .site-footer .sf-links { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; }
        .site-footer .sf-links a { font-family: 'Cairo', 'Roboto', sans-serif; text-decoration: none; font-weight: 700; font-size: 1rem; padding: 8px 22px; border-radius: 50px; background: #fff; color: var(--speak-highlight, #1b5e20); }
        .site-footer .sf-links a.wa { background: #25d366; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="main-title">📚 Loading...</h1>
    <h2 id="sub-title"></h2>

    <div class="speech-controls">
        <div class="control-group"><label>🗣️ اللكنة:</label>
            <select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select>
        </div>
        <div class="control-group"><label>⚡ السرعة:</label>
            <input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1">
            <span id="speed-value">0.9x</span>
        </div>
        <div class="theme-switcher">
            <label>🎨</label>
            <span class="theme-dot active" data-theme="book"></span>
            <span class="theme-dot" data-theme="green" style="background:#2e7d32;"></span>
            <span class="theme-dot" data-theme="blue" style="background:#1565c0;"></span>
            <span class="theme-dot" data-theme="orange" style="background:#ef6c00;"></span>
            <span class="theme-dot" data-theme="pink" style="background:#d81b60;"></span>
        </div>
    </div>

    <div id="top-actions"></div>
    <div id="content"></div>

    <h3 id="quiz-title">📝 Quick Quiz (اختبار سريع)</h3>
    <div id="quiz-progress"></div>
    <div id="quiz-container"></div>
    <div id="quiz-feedback" class="quiz-feedback"></div>
    <div id="quiz-score" class="quiz-score"></div>
    <button id="quiz-reset-btn" class="play-btn" style="display:none;">🔄 إعادة الاختبار</button>
</div>

<button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button>

<script>
    // ============================================================
    // Lesson data (transcribed from: Level 2 - Step by Step Master Booklet)
    // ============================================================
    const lessonData = {"type": "compare", "meta": {"mainTitle": "🧁 Level 2 - Long Vowels: Letter A", "subTitle": "Phonics Master Series - Level 2: Step by Step", "color": "#4a3ad0", "letter": "A"}, "colLabels": ["1. Short A (/æ/)", "2. Long A (ay)", "3. Long A (ai)", "4. Long A (a_e)"], "colColors": ["#b71c1c", "#0b7a55", "#d97706", "#5b3fd6"], "parts": [{"title": "Part 1", "ar": "الجزء الأول", "note": "<b>طريقة القراءة:<\/b> يتم البدء بالقراءة من اليسار (العمود الأول: Short A) والمقارنة أفقيًا مع باقي أنماط Long A.", "rows": [{"g": "Group M", "cells": [[{"en": "Man", "em": "👨", "ar": "رجل"}], [{"en": "May", "em": "🗓️", "ar": "شهر مايو"}], [{"en": "Main", "em": "⭐", "ar": "رئيسي"}], [{"en": "Make", "em": "🛠️", "ar": "يصنع"}]]}, {"g": "Group B", "cells": [[{"en": "Bag", "em": "🎒", "ar": "حقيبة"}], [{"en": "Bay", "em": "🌅", "ar": "خليج"}], [{"en": "Bait", "em": "🪱", "ar": "طعم الصيد"}], [{"en": "Bake", "em": "🧁", "ar": "يخبز"}]]}, {"g": "Group C", "cells": [[{"en": "Cap", "em": "🧢", "ar": "قبعة"}], [{"en": "Clay", "em": "🏺", "ar": "صلصال"}], [{"en": "Chain", "em": "⛓️", "ar": "سلسلة"}], [{"en": "Cape", "em": "🦸", "ar": "عباءة / رداء"}]]}, {"g": "Group D", "cells": [[{"en": "Dam", "em": "🏗️", "ar": "سد"}], [{"en": "Day", "em": "🌞", "ar": "يوم"}], [{"en": "Daily", "em": "📅", "ar": "يومي"}], [{"en": "Date", "em": "🌴", "ar": "تمر / تاريخ"}]]}, {"g": "Group G", "cells": [[{"en": "Gas", "em": "⛽", "ar": "غاز"}], [{"en": "Gay", "em": "😊", "ar": "مبتهج"}], [{"en": "Gain", "em": "📈", "ar": "كسب / ربح"}], [{"en": "Gate", "em": "🚪", "ar": "بوابة"}]]}, {"g": "Group H", "cells": [[{"en": "Hat", "em": "👒", "ar": "قبعة"}], [{"en": "Hay", "em": "🌾", "ar": "قش / تبن"}], [{"en": "Hail", "em": "🌨️", "ar": "مطر ثلجي"}], [{"en": "Hate", "em": "😠", "ar": "يكره"}]]}, {"g": "Group L", "cells": [[{"en": "Lad", "em": "👦", "ar": "صبي"}], [{"en": "Lay", "em": "🛏️", "ar": "يستلقي"}], [{"en": "Laid", "em": "🥚", "ar": "وضع / بيض"}], [{"en": "Late", "em": "⏰", "ar": "متأخر"}]]}], "rules": ["قواعد وتوضيحات سريعة لـ Letter A:", ["<b>Short A:<\/b> ينطق بصوت مفتوح قصير (/æ/) مثل <i>man, hat, bag<\/i>.", "<b>Long A (ay / ai / a_e):<\/b> تعطي كلها صوت A الممدود الصريح (/eɪ/) مثل <i>day, rain, make<\/i>."]]}, {"title": "Part 2", "ar": "الجزء الثاني", "note": "<b>تتمة المجموعات:<\/b> الحفاظ على نفس ترتيب المقارنة من اليسار (Short A) إلى اليمين.", "rows": [{"g": "Group S", "cells": [[{"en": "Sad", "em": "😢", "ar": "حزين"}], [{"en": "Say", "em": "🗣️", "ar": "يقول"}], [{"en": "Sail", "em": "⛵", "ar": "يبحر"}], [{"en": "Same", "em": "👯", "ar": "نفس الشيء"}]]}, {"g": "Group T", "cells": [[{"en": "Tap", "em": "🚰", "ar": "صنبور"}], [{"en": "Way", "em": "🛣️", "ar": "طريق", "note": "W"}], [{"en": "Tail", "em": "🐕", "ar": "ذيل"}], [{"en": "Tape", "em": "📼", "ar": "شريط"}]]}, {"g": "Group P", "cells": [[{"en": "Pad", "em": "📝", "ar": "دفتر"}], [{"en": "Play", "em": "🎮", "ar": "يلعب"}], [{"en": "Paint", "em": "🎨", "ar": "دهان / يلون"}], [{"en": "Pale", "em": "🫥", "ar": "شاحب"}]]}, {"g": "Group B", "cells": [[{"en": "Bat", "em": "🦇", "ar": "خفاش / مضرب"}], [{"en": "Bray", "em": "🫏", "ar": "ينهق"}], [{"en": "Brain", "em": "🧠", "ar": "مخ / عقل"}], [{"en": "Base", "em": "🏛️", "ar": "قاعدة"}]]}, {"g": "Group C", "cells": [[{"en": "Cat", "em": "🐱", "ar": "قطة"}], [{"en": "Gray", "em": "🩶", "ar": "رمادي"}], [{"en": "Claim", "em": "📢", "ar": "يدعي"}], [{"en": "Cave", "em": "🦇", "ar": "كهف"}]]}, {"g": "Group D", "cells": [[{"en": "Dad", "em": "👨", "ar": "أب"}], [{"en": "Delay", "em": "⏳", "ar": "تأخير"}], [{"en": "Drain", "em": "🚰", "ar": "تصريف"}], [{"en": "Daze", "em": "💫", "ar": "ذهول"}]]}, {"g": "Group F", "cells": [[{"en": "Fan", "em": "🪭", "ar": "مروحة"}], [{"en": "Stray", "em": "🐕", "ar": "ضال", "note": "St"}], [{"en": "Faint", "em": "😵", "ar": "إغماء"}], [{"en": "Face", "em": "😀", "ar": "وجه"}]]}], "rules": ["تذكرة سريعة:", ["يأتي التركيب <b>ai<\/b> دائمًا في وسط الكلمة مثل <i>rain, pain, tail<\/i>.", "يأتي التركيب <b>ay<\/b> في نهاية الكلمة غالبًا مثل <i>day, play, say<\/i>."]]}]};

    // ============================================================
    // Engine (same engine as the Level 1 lessons)
    // ============================================================
    const $ = (id) => document.getElementById(id);
    const synth = window.speechSynthesis || { speak(){}, cancel(){}, getVoices(){ return []; } };
    let availableVoices = [];
    let voiceLoadAttempt = 0;
    const MAX_VOICE_ATTEMPTS = 6;
    const RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];

    function lsGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    function loadAvailableVoices() {
        const vList = synth.getVoices();
        if (vList.length) {
            availableVoices = vList;
            voiceLoadAttempt = 0;
            populateVoiceDropdown();
            return;
        }
        if (voiceLoadAttempt < MAX_VOICE_ATTEMPTS) {
            const delay = RETRY_DELAYS[voiceLoadAttempt] || 2500;
            voiceLoadAttempt++;
            setTimeout(loadAvailableVoices, delay);
        }
    }
    function voiceQualityScore(v) {
        const name = (v.name || '').toLowerCase();
        let score = 0;
        if (name.includes('google')) score += 30;
        if (name.includes('microsoft')) score += 25;
        if (name.includes('samantha')) score += 20;
        if (v.localService) score += 2;
        return score;
    }
    function populateVoiceDropdown() {
        const vs = $('voice-select');
        if (!vs || !availableVoices.length) return;
        const normLang = (l) => String(l||'').replace('_','-').toLowerCase();
        const enVoices = availableVoices.filter(v => {
            const lang = normLang(v.lang);
            return lang.startsWith('en-us') || lang.startsWith('en-gb');
        });
        if (!enVoices.length) return;
        enVoices.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));
        const savedLang = lsGet('lesson_voice', 'en-US');
        const savedVoiceURI = lsGet('lesson_voiceURI', '');
        vs.innerHTML = '';
        enVoices.forEach(v => {
            const lang = String(v.lang||'').replace('_','-');
            const isUS = lang.toLowerCase().startsWith('en-us');
            const flag = isUS ? '🇺🇸 American' : '🇬🇧 British';
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.dataset.lang = lang;
            opt.textContent = flag + ' — ' + v.name;
            vs.appendChild(opt);
        });
        const savedOpt = [...vs.options].find(o => o.value === savedVoiceURI) ||
                         [...vs.options].find(o => o.dataset.lang.toLowerCase().startsWith(savedLang.toLowerCase()));
        if (savedOpt) vs.value = savedOpt.value;
    }
    function getBestVoice() {
        const vs = $('voice-select');
        if (!vs) return null;
        const found = availableVoices.find(v => v.voiceURI === vs.value);
        if (found) return found;
        const targetLang = vs.options[vs.selectedIndex]?.dataset?.lang || vs.value || 'en-US';
        const normTarget = targetLang.toLowerCase().replace('_','-');
        const matches = availableVoices.filter(v => {
            const vl = String(v.lang||'').replace('_','-').toLowerCase();
            return vl === normTarget || vl.startsWith(normTarget + '-') || vl.startsWith(normTarget.split('-')[0] + '-' + normTarget.split('-')[1]);
        });
        if (matches.length) {
            matches.sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));
            return matches[0];
        }
        return null;
    }
    function getSelectedLang() {
        const vs = $('voice-select');
        if (!vs) return 'en-US';
        const opt = vs.options[vs.selectedIndex];
        return (opt && opt.dataset && opt.dataset.lang) || vs.value || 'en-US';
    }
    loadAvailableVoices();
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadAvailableVoices;

    let speechQueue = [];
    let isPlaying = false;
    let currentSpeakingElement = null;

    // ---------- theme (default = the colour used in the book for this lesson) ----------
    const BASE = lessonData.meta.color;
    function hex2rgb(h) { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }
    function rgb2hex(r) { return '#' + r.map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }
    function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v,i) => v*(1-t) + B[i]*t)); }
    const themeColors = { book: BASE, green:'#2e7d32', blue:'#1565c0', orange:'#ef6c00', pink:'#d81b60' };
    function applyTheme(t) {
        const base = themeColors[t] || BASE;
        const root = document.documentElement.style;
        root.setProperty('--accent-color', base);
        root.setProperty('--highlight-color', mix(base, '#ffffff', 0.8));
        root.setProperty('--speak-highlight', mix(base, '#000000', 0.35));
        root.setProperty('--play-all-btn', base);
        root.setProperty('--play-shadow', mix(base, '#000000', 0.3));
        root.setProperty('--border-color', mix(base, '#ffffff', 0.45));
        root.setProperty('--soft-bg', mix(base, '#ffffff', 0.9));
    }
    function loadPrefs() {
        const speed = lsGet('lesson_speed', '0.9');
        const theme = lsGet('lesson2_theme', 'book');
        $('speed-slider').value = speed;
        $('speed-value').innerText = speed + 'x';
        applyTheme(theme);
        document.querySelectorAll('.theme-dot').forEach(d => {
            if (d.dataset.theme === 'book') d.style.background = BASE;
            d.classList.toggle('active', d.dataset.theme === theme);
        });
    }
    function savePrefs() {
        lsSet('lesson_voice', getSelectedLang());
        lsSet('lesson_voiceURI', $('voice-select').value);
        lsSet('lesson_speed', $('speed-slider').value);
        lsSet('lesson2_theme', document.querySelector('.theme-dot.active')?.dataset?.theme || 'book');
    }

    // ---------- speech ----------
    function clearHighlight() {
        if (currentSpeakingElement) {
            currentSpeakingElement.classList.remove('speaking-highlight');
            currentSpeakingElement = null;
        }
    }
    function cancelSpeech() {
        synth.cancel();
        isPlaying = false;
        speechQueue = [];
        clearHighlight();
    }
    function makeUtter(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = getSelectedLang();
        const v = getBestVoice(); if (v) utter.voice = v;
        utter.rate = parseFloat($('speed-slider').value);
        return utter;
    }
    function speakText(text, element) {
        if (!text) return;
        cancelSpeech();
        const utter = makeUtter(text);
        if (element) {
            element.classList.add('speaking-highlight');
            currentSpeakingElement = element;
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            utter.onend = utter.onerror = () => { clearHighlight(); isPlaying = false; };
        }
        synth.speak(utter);
        isPlaying = true;
    }
    function playQueue(elements) {
        cancelSpeech();
        if (!elements || elements.length === 0) return;
        let index = 0;
        speechQueue = [...elements];
        isPlaying = true;
        function next() {
            if (!isPlaying || index >= speechQueue.length) { isPlaying = false; clearHighlight(); return; }
            const el = speechQueue[index];
            const text = (el.dataset.say || el.innerText).trim();
            if (!text) { index++; next(); return; }
            const utter = makeUtter(text);
            el.classList.add('speaking-highlight');
            currentSpeakingElement = el;
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const done = () => { clearHighlight(); index++; if (isPlaying) next(); else isPlaying = false; };
            utter.onend = done;
            utter.onerror = done;
            synth.speak(utter);
        }
        next();
    }

    // ============================================================
    // Type 1: comparison tables (Letter Group + 4 columns, as in the book)
    // ============================================================
    function makeWp(item, cls) {
        const wp = document.createElement('span');
        wp.className = 'wp ' + cls;
        wp.dataset.say = item.en;
        const w = document.createElement('span'); w.className = 'w'; w.textContent = item.en;
        wp.appendChild(w);
        if (item.note) {
            const n = document.createElement('span'); n.className = 'note'; n.textContent = '*(' + item.note + ')*';
            wp.appendChild(n);
        }
        const e = document.createElement('span'); e.className = 'e'; e.textContent = item.em;
        wp.appendChild(e);
        wp.onclick = () => speakText(item.en, wp);
        return wp;
    }

    function renderCompare() {
        const d = lessonData, root = $('content');
        const allEls = [], shortEls = [], longEls = [];
        const L = d.meta.letter;

        d.parts.forEach((part, pi) => {
            const h3 = document.createElement('h3');
            h3.textContent = '🔤 ' + (pi === 0 ? 'I' : 'II') + '. Comparison Table - ' + part.title + ' (' + part.ar + ')';
            root.appendChild(h3);

            const nb = document.createElement('div');
            nb.className = 'note-box';
            nb.innerHTML = '<span class="dirtag">Left → Right</span><span class="nt">' + part.note + '</span>';
            root.appendChild(nb);

            const wrap = document.createElement('div'); wrap.className = 'table-wrap';
            const table = document.createElement('table'); table.className = 'cmp';
            const colEls = d.colLabels.map(() => []);

            // header: Letter Group + 4 pattern columns
            const thead = document.createElement('thead');
            const hr = document.createElement('tr');
            const th0 = document.createElement('th'); th0.className = 'gh'; th0.textContent = 'Letter Group';
            hr.appendChild(th0);
            d.colLabels.forEach((lab, ci) => {
                const th = document.createElement('th');
                th.className = 'colh';
                th.style.background = d.colColors[ci];
                th.textContent = lab + ' 🔊';
                th.title = 'اضغط لسماع كل كلمات العمود';
                th.onclick = () => playQueue(colEls[ci]);
                hr.appendChild(th);
            });
            thead.appendChild(hr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            part.rows.forEach(r => {
                const tr = document.createElement('tr');
                const rowEls = [];
                const tg = document.createElement('td'); tg.className = 'grp'; tg.textContent = r.g;
                tg.title = 'اضغط لسماع الصف كاملاً';
                tg.onclick = () => playQueue(rowEls);
                tr.appendChild(tg);
                r.cells.forEach((items, ci) => {
                    const td = document.createElement('td');
                    const line = document.createElement('div');
                    items.forEach(it => {
                        const wp = makeWp(it, ci === 0 ? 'c0' : 'cl');
                        line.appendChild(wp);
                        rowEls.push(wp); colEls[ci].push(wp); allEls.push(wp);
                        (ci === 0 ? shortEls : longEls).push(wp);
                    });
                    td.appendChild(line);
                    const m = document.createElement('div'); m.className = 'mean';
                    m.textContent = '(' + items.map(i => i.ar).join(' / ') + ')';
                    td.appendChild(m);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            wrap.appendChild(table);
            root.appendChild(wrap);

            const rb = document.createElement('div'); rb.className = 'rules';
            rb.innerHTML = '<div class="rt">' + part.rules[0] + '</div><ul>' +
                part.rules[1].map(x => '<li>' + x + '</li>').join('') + '</ul>';
            root.appendChild(rb);
        });

        const act = $('top-actions');
        [['▶️ نطق الجدول كاملاً', allEls], ['▶️ نطق Short ' + L + ' فقط', shortEls], ['▶️ نطق Long ' + L + ' فقط', longEls]]
            .forEach(([label, els]) => {
                const b = document.createElement('button');
                b.className = 'play-btn'; b.textContent = label;
                b.onclick = () => playQueue(els);
                act.appendChild(b);
            });
    }

    // ============================================================
    // Type 2: tabs + cards (3 columns, a few pages have 2 - as in the book)
    // ============================================================
    function tint(hex) { return mix(hex, '#ffffff', 0.9); }

    function hlNode(word, pat) {
        const frag = document.createDocumentFragment();
        if (!pat) { frag.appendChild(document.createTextNode(word)); return frag; }
        const low = word.toLowerCase();
        let i = low.indexOf(pat);
        if (i < 0) { frag.appendChild(document.createTextNode(word)); return frag; }
        let len = pat.length;
        if (len === 1) { while (low[i + len] === pat) len++; }
        frag.appendChild(document.createTextNode(word.slice(0, i)));
        const s = document.createElement('span'); s.className = 'hl'; s.textContent = word.slice(i, i + len);
        frag.appendChild(s);
        frag.appendChild(document.createTextNode(word.slice(i + len)));
        return frag;
    }

    function renderCards() {
        const d = lessonData, root = $('content');
        const tabs = document.createElement('div'); tabs.className = 'tabs'; root.appendChild(tabs);
        const holder = document.createElement('div'); root.appendChild(holder);
        const secEls = [], tabEls = [];

        d.sections.forEach((s, si) => {
            const tab = document.createElement('button');
            tab.className = 'tab'; tab.style.setProperty('--tc', s.color); tab.textContent = s.tab;
            tab.onclick = () => { showSection(si); tabs.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
            tabs.appendChild(tab); tabEls.push(tab);

            const sec = document.createElement('div');
            sec.className = 'sec';
            sec.style.setProperty('--sc', s.color);
            sec.style.setProperty('--sc-bg', tint(s.color));
            const secCards = [];

            const head = document.createElement('div'); head.className = 'sec-head';
            const hl = document.createElement('div');
            hl.innerHTML = '<div class="t"></div><div class="s"></div>';
            hl.querySelector('.t').textContent = s.title;
            hl.querySelector('.s').textContent = s.sub;
            head.appendChild(hl);
            const playBtn = document.createElement('button');
            playBtn.className = 'sec-play'; playBtn.textContent = '▶️ نطق الكلمات';
            head.appendChild(playBtn);
            sec.appendChild(head);

            if (s.type === 'table2') {
                playBtn.style.display = 'none';
                const t = document.createElement('table'); t.className = 't2';
                s.rows.forEach(r => {
                    const tr = document.createElement('tr');
                    const k = document.createElement('td'); k.className = 'k'; k.textContent = r[0];
                    const v = document.createElement('td'); v.className = 'v'; v.textContent = r[1];
                    tr.append(k, v); t.appendChild(tr);
                });
                sec.appendChild(t);
            } else {
                s.blocks.forEach(b => {
                    const blk = document.createElement('div');
                    if (b.color) { blk.style.setProperty('--sc', b.color); blk.style.setProperty('--sc-bg', tint(b.color)); }
                    if ((b.sounds && b.sounds.length) || (b.info && b.info.length)) {
                        const ib = document.createElement('div'); ib.className = 'infobox';
                        if (b.sounds && b.sounds.length) {
                            const row = document.createElement('div'); row.className = 'irow';
                            const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'النطق';
                            const chips = document.createElement('div'); chips.className = 'chips';
                            b.sounds.forEach(sn => {
                                const c = document.createElement('span'); c.className = 'snd'; c.dataset.say = sn[2];
                                c.innerHTML = '<span class="en"></span><span>=</span><span class="ar"></span>';
                                c.querySelector('.en').textContent = sn[0];
                                c.querySelector('.ar').textContent = sn[1];
                                c.onclick = () => speakText(sn[2], c);
                                chips.appendChild(c);
                            });
                            row.append(bd, chips); ib.appendChild(row);
                        }
                        (b.info || []).forEach(inf => {
                            const row = document.createElement('div'); row.className = 'irow';
                            const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = inf.b;
                            const tx = document.createElement('span'); tx.className = 'itx'; tx.textContent = inf.t;
                            row.append(bd, tx); ib.appendChild(row);
                        });
                        blk.appendChild(ib);
                    }
                    const grid = document.createElement('div'); grid.className = 'cards';
                    grid.style.setProperty('--cols', b.cols || 3);
                    b.cards.forEach(c => {
                        const el = document.createElement('div'); el.className = 'card'; el.dataset.say = c.en;
                        const em = document.createElement('div'); em.className = 'em'; em.textContent = c.em;
                        if (/^[0-9]+(st|nd|rd|th)?$/.test(c.em)) em.classList.add('txt');
                        const tx = document.createElement('div'); tx.className = 'tx';
                        const en = document.createElement('div'); en.className = 'en'; en.appendChild(hlNode(c.en, b.hl));
                        const ar = document.createElement('div'); ar.className = 'ar'; ar.textContent = c.ar;
                        tx.append(en, ar); el.append(em, tx);
                        el.onclick = () => speakText(c.en, el);
                        grid.appendChild(el); secCards.push(el);
                    });
                    blk.appendChild(grid);
                    sec.appendChild(blk);
                });
                playBtn.onclick = () => playQueue(secCards);
            }
            holder.appendChild(sec); secEls.push(sec);
        });

        function showSection(i) {
            cancelSpeech();
            secEls.forEach((el, j) => el.classList.toggle('active', j === i));
            tabEls.forEach((el, j) => el.classList.toggle('on', j === i));
        }
        showSection(0);
    }

    // ============================================================
    // Quiz
    // ============================================================
    let quizPool = [], quizItems = [], quizIndex = 0, quizScore = 0;

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function fireConfetti(container) {
        const colors = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
        for (let i = 0; i < 28; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti-piece';
            conf.style.left = (35 + Math.random() * 30) + '%';
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDelay = (Math.random() * 0.25) + 's';
            conf.style.setProperty('--x', (Math.random() * 220 - 110) + 'px');
            container.appendChild(conf);
            setTimeout(() => conf.remove(), 1400);
        }
    }
    function collectPool() {
        const pool = [], seen = new Set();
        const add = (en, ar, col) => {
            const k = en.toLowerCase();
            if (seen.has(k)) return;
            seen.add(k); pool.push({ en, ar, col });
        };
        if (lessonData.type === 'compare') {
            lessonData.parts.forEach(p => p.rows.forEach(r => r.cells.forEach((items, ci) =>
                items.forEach(it => add(it.en, it.ar, ci)))));
        } else {
            lessonData.sections.forEach(s => {
                if (s.type === 'table2') return;
                s.blocks.forEach(b => b.cards.forEach(c => { if (!c.f) add(c.en, c.ar, -1); }));
            });
        }
        return pool;
    }
    function buildQuiz() {
        quizPool = collectPool();
        quizItems = shuffle([...quizPool]).slice(0, Math.min(10, quizPool.length));
        quizIndex = 0; quizScore = 0;
        $('quiz-score').innerText = '';
        $('quiz-reset-btn').style.display = 'none';
        showQuizQuestion();
    }
    function showQuizQuestion() {
        const quizBox = $('quiz-container'), progress = $('quiz-progress'),
              feedback = $('quiz-feedback'), scoreDiv = $('quiz-score');
        feedback.innerText = ''; feedback.className = 'quiz-feedback';
        quizBox.innerHTML = '';

        if (quizIndex >= quizItems.length) {
            progress.innerText = '';
            scoreDiv.innerText = `🏆 انتهى الاختبار! نتيجتك: ${quizScore} / ${quizItems.length}`;
            $('quiz-reset-btn').style.display = 'inline-block';
            return;
        }
        progress.innerText = `سؤال ${quizIndex + 1} من ${quizItems.length}`;
        const item = quizItems[quizIndex];
        const L = (lessonData.meta.letter || '').toUpperCase();
        const soundQ = lessonData.type === 'compare' && Math.random() < 0.4;

        const qDiv = document.createElement('div'); qDiv.className = 'quiz-question'; qDiv.style.position = 'relative';
        const q = document.createElement('p'); q.className = 'q-text';
        const wordSpan = '<span style="color:var(--accent-color); font-family:Roboto,sans-serif; direction:ltr; display:inline-block">' + item.en + '</span>';
        q.innerHTML = soundQ
            ? `الكلمة "${wordSpan}" — صوت حرف <b>${L}</b> فيها:`
            : `ما معنى كلمة "${wordSpan}"؟`;
        const lb = document.createElement('button'); lb.className = 'listen'; lb.type = 'button'; lb.textContent = '🔊 استمع';
        lb.onclick = () => speakText(item.en);
        q.appendChild(lb);
        qDiv.appendChild(q);

        let options, isCorrect;
        if (soundQ) {
            options = [`Short ${L} — صوت قصير`, `Long ${L} — صوت طويل`];
            const right = item.col === 0 ? options[0] : options[1];
            isCorrect = (o) => o === right;
        } else {
            const seen = new Set([item.ar]); const distractors = [];
            for (const p of shuffle([...quizPool])) {
                if (!seen.has(p.ar)) { seen.add(p.ar); distractors.push(p.ar); }
                if (distractors.length === 3) break;
            }
            options = shuffle([item.ar, ...distractors]);
            isCorrect = (o) => o === item.ar;
        }

        const optWrap = document.createElement('div'); optWrap.className = 'quiz-options';
        let locked = false;
        options.forEach(opt => {
            const optBtn = document.createElement('div');
            optBtn.className = 'quiz-option';
            optBtn.innerText = opt;
            optBtn.onclick = () => {
                if (locked) return;
                locked = true;
                optWrap.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');
                if (isCorrect(opt)) {
                    optBtn.classList.add('correct');
                    feedback.innerText = '🎉 إجابة صحيحة!'; feedback.className = 'quiz-feedback correct';
                    fireConfetti(qDiv);
                    speakText('Correct!');
                    quizScore++;
                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 1200);
                } else {
                    optBtn.classList.add('wrong');
                    optWrap.querySelectorAll('.quiz-option').forEach(b => { if (isCorrect(b.innerText)) b.classList.add('show-correct'); });
                    const right = options.find(isCorrect);
                    feedback.innerText = `❌ خطأ! الإجابة الصحيحة: "${right}"`;
                    feedback.className = 'quiz-feedback wrong';
                    speakText('Wrong!');
                    setTimeout(() => { quizIndex++; showQuizQuestion(); }, 2000);
                }
            };
            optWrap.appendChild(optBtn);
        });
        qDiv.appendChild(optWrap);
        quizBox.appendChild(qDiv);
    }

    // ============================================================
    // Init
    // ============================================================
    function initLesson() {
        $('main-title').innerText = lessonData.meta.mainTitle;
        $('sub-title').innerText = lessonData.meta.subTitle;
        if (lessonData.type === 'compare') renderCompare(); else renderCards();
        $('stop-btn').onclick = cancelSpeech;
        buildQuiz();
        $('quiz-reset-btn').onclick = buildQuiz;

        $('voice-select').onchange = savePrefs;
        $('speed-slider').oninput = () => {
            $('speed-value').innerText = $('speed-slider').value + 'x';
            savePrefs();
        };
        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                applyTheme(dot.dataset.theme);
                savePrefs();
            };
        });
    }
    window.onload = () => { loadPrefs(); initLesson(); };
</script>
