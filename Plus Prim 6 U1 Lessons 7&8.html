</style></head><body><div class="container"><div class="lesson-badge">PLUS PRIM 6 • UNIT 1 • Lessons 7 &amp; 8</div><h1 id="main-title">Writing a report / Story: Behind the camera</h1><h2 id="sub-title">Unit 1</h2><div class="speech-controls"><div class="control-group"><label>🗣️ اللكنة:</label><select id="voice-select"><option value="en-US">American (US) 🇺🇸</option><option value="en-GB">British (UK) 🇬🇧</option></select></div><div class="control-group"><label>⚡ السرعة:</label><input type="range" id="speed-slider" min="0.5" max="1.2" value="0.9" step="0.1"><span id="speed-value">0.9x</span></div><div class="theme-switcher"><label>🎨</label><span class="theme-dot active" data-theme="blue" style="background:#0569b3" title="Blue"></span><span class="theme-dot" data-theme="yellow" style="background:#d89000" title="Yellow"></span><span class="theme-dot" data-theme="purple" style="background:#9333a8" title="Purple"></span></div></div><button id="play-all-vocab-btn" class="play-btn">▶️ نطق جميع الكلمات والتعبيرات</button><div id="lesson-content"></div></div><button id="stop-btn" class="floating-stop-btn" title="إيقاف النطق">⏹️</button><script>
const lessonId="unit1_lessons7_8",data={"lesson_title": "Writing a report / Story: Behind the camera", "unit_title": "Unit 1", "lessons_label": "Lessons 7 & 8", "section_order": ["key_vocabulary", "extra_vocabulary", "verbs", "definitions", "expressions", "main_points", "texts"], "key_vocabulary": [{"en": "lump", "ar": "كتلة"}, {"en": "clay", "ar": "صلصال"}, {"en": "pottery wheel", "ar": "عجلة فخارية"}, {"en": "advertisement", "ar": "إعلان"}, {"en": "apron", "ar": "مريلة"}, {"en": "kiln", "ar": "فرن [للخزف]"}, {"en": "decorate", "ar": "يزين"}, {"en": "play", "ar": "يعزف / مسرحية"}, {"en": "choir", "ar": "كورال"}, {"en": "exhibition", "ar": "معرض"}, {"en": "edit", "ar": "يعدل"}, {"en": "costumes", "ar": "أزياء خاصة"}], "activities": [], "extra_vocabulary": [{"en": "bowl", "ar": "سلطانية"}, {"en": "photographer", "ar": "مصور"}, {"en": "photography", "ar": "تصوير"}, {"en": "cupboard", "ar": "خزانة"}, {"en": "website", "ar": "موقع إلكتروني"}, {"en": "craft", "ar": "حرفة يدوية"}, {"en": "acting", "ar": "تمثيل"}, {"en": "props", "ar": "أدوات الديكور"}], "main_points": [{"topic": "My pottery project", "word": "lump", "sentence": "We started our pottery project with a lump of clay."}, {"topic": "My pottery project", "word": "pottery wheel", "sentence": "The teacher showed us how to use a pottery wheel."}, {"topic": "My pottery project", "word": "apron", "sentence": "We put on aprons over our clothes."}, {"topic": "My pottery project", "word": "kiln", "sentence": "The teacher put the bowl in a kiln."}, {"topic": "My pottery project", "word": "decorate", "sentence": "I used special paint to decorate my bowl."}, {"topic": "The school show", "word": "school show", "sentence": "Everybody was excited about the school show except Magdy."}, {"topic": "The school show", "word": "piano", "sentence": "Waleed is going to play the piano."}, {"topic": "The school show", "word": "choir - songs", "sentence": "The choir is going to sing beautiful songs."}, {"topic": "The school show", "word": "costumes", "sentence": "Dalia is going to make costumes for the choir."}, {"topic": "The school show", "word": "singing - acting", "sentence": "Magdy doesn't like singing or acting and he can't play an instrument."}, {"topic": "The school show", "word": "photographs - perform", "sentence": "Magdy can take photographs while the class are performing."}], "texts": [{"type": "reading", "title": "My pottery project by Amal", "paragraphs": [{"heading": "1", "en": "My class worked on a pottery project at school this week.", "ar": "عمل فصلي على مشروع فخار في المدرسة هذا الأسبوع."}, {"heading": "1", "en": "We started with a lump of clay, and we chose what to make.", "ar": "بدأنا بكتلة من الصلصال، واخترنا ما سنصنعه."}, {"heading": "1", "en": "I wanted to make a bowl.", "ar": "أردت أن أصنع سلطانية."}, {"heading": "2", "en": "First, the teacher showed us how to use a pottery wheel.", "ar": "أولاً، أظهر لنا المعلم كيفية استخدام عجلة الفخار."}, {"heading": "2", "en": "Then, it was our turn.", "ar": "ثم جاء دورنا."}, {"heading": "2", "en": "We put on aprons over our clothes.", "ar": "ارتدينا مآزر فوق ملابسنا."}, {"heading": "2", "en": "When I put my clay on the wheel, it went fast.", "ar": "عندما وضعت الصلصال على العجلة، دارت بسرعة."}, {"heading": "2", "en": "It was difficult, and I got messy.", "ar": "كان الأمر صعباً، واتسخت ملابسي."}, {"heading": "3", "en": "When my bowl was finished, the teacher put it in a kiln.", "ar": "عندما انتهت سلطانيتي، وضعها المعلم في الفرن."}, {"heading": "3", "en": "This is a special oven which gets very hot.", "ar": "هذا فرن خاص يسخن جداً."}, {"heading": "3", "en": "It makes the clay hard and strong.", "ar": "إنه يجعل الصلصال صلباً وقوياً."}, {"heading": "4", "en": "Finally, the bowl was ready and the teacher took it out.", "ar": "أخيراً، كانت السلطانية جاهزة وأخرجها المعلم."}, {"heading": "4", "en": "We waited for the bowl to be cool, and then I used special paint to decorate my bowl.", "ar": "انتظرنا حتى تبرد السلطانية، ثم استخدمت طلاءً خاصاً لتزيين سلطانيتي."}, {"heading": "5", "en": "I painted it pink all over first, and waited for the paint to dry.", "ar": "دهنتها باللون الوردي بالكامل أولاً، وانتظرت حتى يجف الطلاء."}, {"heading": "5", "en": "Then I used different colors of paint to make circles all over it.", "ar": "ثم استخدمت ألواناً مختلفة من الطلاء لعمل دوائر في كل مكان عليها."}, {"heading": "6", "en": "I really enjoyed making my bowl!", "ar": "لقد استمتعت حقاً بصنع سلطانيتي!"}, {"heading": "6", "en": "When I finished my bowl, I gave it to my mom for her birthday.", "ar": "عندما انتهيت من سلطانيتي، أعطيتها لأمي في عيد ميلادها."}, {"heading": "6", "en": "She loved it!", "ar": "لقد أحبتها!"}], "dialogue": []}, {"type": "reading", "title": "Behind the camera", "paragraphs": [{"heading": "", "en": "Everybody was excited about the school show, except Magdy.", "ar": "كان الجميع متحمسين للعرض المدرسي، باستثناء مجدي."}, {"heading": "", "en": "\"I'm going to play the piano,\" said Waleed.", "ar": "قال وليد: \"سأعزف على البيانو\"."}, {"heading": "", "en": "\"The choir is going to sing beautiful songs,\" said Nesma.", "ar": "قالت نسمة: \"الكورال سيغني أغاني جميلة\"."}, {"heading": "", "en": "\"And I'm going to make costumes for the choir,\" said Dalia.", "ar": "قالت داليا: \"وسأقوم بصنع أزياء للكورال\"."}, {"heading": "", "en": "\"I've written a funny play!\" said Samir.", "ar": "قال سمير: \"لقد كتبت مسرحية مضحكة!\"."}, {"heading": "", "en": "Magdy was worried. \"I can't play an instrument or sing. What am I going to do?\" he thought.", "ar": "كان مجدي قلقاً. وفكر قائلاً: \"لا أستطيع العزف على آلة أو الغناء. ماذا سأفعل؟\"."}, {"heading": "", "en": "On the way home, Magdy saw an advertisement for a photography exhibition at the museum.", "ar": "في طريق العودة إلى المنزل، رأى مجدي إعلاناً لمعرض تصوير فوتوغرافي في المتحف."}, {"heading": "", "en": "A black and white photo showed a man playing the piano on stage.", "ar": "أظهرت صورة بالأبيض والأسود رجلاً يعزف على البيانو على المسرح."}, {"heading": "", "en": "\"That's amazing,\" thought Magdy.", "ar": "فكر مجدي: \"هذا مذهل\"."}, {"heading": "", "en": "At home, Magdy started looking in cupboards.", "ar": "في المنزل، بدأ مجدي بالبحث في الخزانات."}, {"heading": "", "en": "\"What are you doing?\" asked Mom.", "ar": "سألت الأم: \"ماذا تفعل؟\"."}, {"heading": "", "en": "\"Dad has a good camera, doesn't he?\"", "ar": "\"أبي لديه كاميرا جيدة، أليس كذلك؟\"."}, {"heading": "", "en": "\"Yes,\" said Mom, \"It's in this box. He hasn't used it for a long time.\"", "ar": "قالت الأم: \"نعم، إنها في هذا الصندوق. لم يستخدمها منذ فترة طويلة\"."}, {"heading": "", "en": "Magdy found his dad's photography books.", "ar": "وجد مجدي كتب التصوير الخاصة بوالده."}, {"heading": "", "en": "Then he learned how to use the camera and edit the photos on the computer.", "ar": "ثم تعلم كيفية استخدام الكاميرا وتعديل الصور على الكمبيوتر."}, {"heading": "", "en": "Magdy was excited. On the weekend, his mom and dad took him to a photography exhibition.", "ar": "كان مجدي متحمساً. وفي عطلة نهاية الأسبوع، اصطحبه والده ووالدته إلى معرض للتصوير الفوتوغرافي."}, {"heading": "", "en": "After the exhibition, they walked around the city and he took photos.", "ar": "بعد المعرض، تجولوا في المدينة والتقط هو صوراً."}, {"heading": "", "en": "The next day, Magdy spoke to his teacher.", "ar": "في اليوم التالي، تحدث مجدي إلى معلمته."}, {"heading": "", "en": "\"Miss Salwa, I don't like singing or acting, and I can't play an instrument, but I could be the photographer!\"", "ar": "\"آنسة سلوى، أنا لا أحب الغناء أو التمثيل، ولا أستطيع العزف على آلة موسيقية، ولكن يمكنني أن أكون المصور!\"."}, {"heading": "", "en": "\"I can take photographs while the class are performing. Then I can edit the photos for our school website,\" said Magdy.", "ar": "قال مجدي: \"يمكنني التقاط الصور بينما يؤدي الفصل. ثم يمكنني تعديل الصور لموقع مدرستنا الإلكتروني\"."}, {"heading": "", "en": "Miss Salwa smiled, \"That's a great idea, Magdy!\"", "ar": "ابتسمت الآنسة سلوى قائلة: \"هذه فكرة رائعة يا مجدي!\"."}, {"heading": "", "en": "Magdy took lots of photos during the show.", "ar": "التقط مجدي الكثير من الصور أثناء العرض."}, {"heading": "", "en": "The next week, Magdy's photos were on the school website.", "ar": "في الأسبوع التالي، كانت صور مجدي على موقع المدرسة الإلكتروني."}, {"heading": "", "en": "\"You're going to be a great photographer,\" said his dad.", "ar": "قال والده: \"ستكون مصوراً رائعاً\"."}], "dialogue": []}, {"type": "dialogue", "title": "Who does Samir help in the school show?", "paragraphs": [], "dialogue": [{"speaker": "Samir", "en": "Hi, Grandma. I've come to visit you.", "ar": "مرحباً يا جدتي. لقد جئت لزيارتك."}, {"speaker": "Grandma", "en": "Hello, Samir. How was the school show? Were you in a play?", "ar": "أهلاً يا سمير. كيف كان العرض المدرسي؟ هل كنت في مسرحية؟"}, {"speaker": "Samir", "en": "It was great, Grandma, but I wasn't in a play. Magdy and I don't like acting.", "ar": "كان رائعاً يا جدتي، لكنني لم أكن في مسرحية. أنا ومجدي لا نحب التمثيل."}, {"speaker": "Samir", "en": "Magdy was the photographer for the school show, but my job was better than that. I helped Mr Ibrahim make the props.", "ar": "كان مجدي هو المصور للعرض المدرسي، لكن وظيفتي كانت أفضل من ذلك. لقد ساعدت السيد إبراهيم في صنع الأدوات."}, {"speaker": "Grandma", "en": "What are props?", "ar": "ما هي الأدوات؟"}, {"speaker": "Samir", "en": "Props are the things that actors need on stage to make the play look real.", "ar": "الأدوات هي الأشياء التي يحتاجها الممثلون على المسرح لجعل المسرحية تبدو حقيقية."}, {"speaker": "Samir", "en": "If the play is about a family at home in the living room, you need some furniture - like a couch, a lamp, or some pictures for the wall.", "ar": "إذا كانت المسرحية عن عائلة في المنزل في غرفة المعيشة، فأنت بحاجة إلى بعض الأثاث - مثل أريكة، أو مصباح، أو بعض الصور للحائط."}, {"speaker": "Samir", "en": "Sometimes we get the things we need from parents. But sometimes we make them!", "ar": "أحياناً نحصل على الأشياء التي نحتاجها من الوالدين. ولكن أحياناً نصنعها!"}, {"speaker": "Grandma", "en": "You make them?", "ar": "تصنعونها؟"}, {"speaker": "Samir", "en": "Yes, I love making things, Grandma. We use wood, cardboard, colored paper.. anything!", "ar": "نعم، أنا أحب صنع الأشياء يا جدتي. نحن نستخدم الخشب، والكرتون، والورق الملون.. أي شيء!"}, {"speaker": "Samir", "en": "My teacher Mr Ibrahim is very good at making things and he shows me what to do.", "ar": "معلمي السيد إبراهيم بارع جداً في صنع الأشياء وهو يوضح لي ما يجب فعله."}, {"speaker": "Grandma", "en": "That sounds exciting, Samir. I'd like to see some of the things you made.", "ar": "يبدو هذا مثيراً يا سمير. أود رؤية بعض الأشياء التي صنعتها."}, {"speaker": "Samir", "en": "That's easy. Magdy put his photos on the school website. I'll get my phone and I'll show you!", "ar": "هذا سهل. وضع مجدي صوره على موقع المدرسة. سأحضر هاتفي وسأريك!"}]}, {"type": "reading", "title": "Tip to write a report", "paragraphs": [{"heading": "Sequencing words", "en": "Use sequencing words to order your ideas: First, Next, Then, and Finally.", "ar": "استخدم كلمات التتابع لترتيب أفكارك: أولاً، التالي، ثم وفي النهاية."}, {"heading": "Using 'when'", "en": "We can use 'when' to talk about the order in which things happen. Both parts of the sentence are in the same tense.", "ar": "يمكننا أن نستخدم 'When' للحديث عن الترتيب الذي تحدث به الأشياء. كلا الجزئين من الجملة في نفس الزمن."}, {"heading": "Example", "en": "When my bowl was finished, my teacher put it in a kiln.", "ar": "عندما انتهت سلطانيتي، وضعها معلمي في الفرن."}, {"heading": "Visuals", "en": "Draw pictures to illustrate each stage of the report.", "ar": "ارسم صوراً لتوضيح كل مرحلة في التقرير."}], "dialogue": []}], "verbs": [{"present": "choose", "past": "chose", "pp": "chosen", "ar": "يختار"}, {"present": "speak", "past": "spoke", "pp": "spoken", "ar": "يتحدث"}], "definitions": [{"word": "lump", "definition": "a solid object without a clear shape"}, {"word": "wheel", "definition": "a round flat circle which turns around"}, {"word": "kiln", "definition": "a very hot oven for making pottery hard and strong"}, {"word": "clay", "definition": "a natural material you can use to make pots, vases, or sculptures"}, {"word": "apron", "definition": "you wear this to keep your clothes clean"}, {"word": "choir", "definition": "a group of people who sing together"}, {"word": "edit", "definition": "to change photos to make them better"}, {"word": "a play", "definition": "a story that you watch at the theater"}, {"word": "advertisement", "definition": "this tells people about an event, so they want to see it"}, {"word": "photography", "definition": "the activity or job of taking photographs"}, {"word": "exhibition", "definition": "a group of artwork in one place for people to see"}, {"word": "costumes", "definition": "special clothes that people wear at festivals or on stage"}], "expressions": [{"en": "put on", "ar": "يرتدي"}, {"en": "wait for", "ar": "ينتظر"}, {"en": "walk around", "ar": "يتجول حول"}, {"en": "cut up pieces of", "ar": "يقطع قطعاً من"}, {"en": "take .. out", "ar": "يخرج"}, {"en": "all over it", "ar": "حوله بالكامل"}, {"en": "work on a project", "ar": "يقوم بأداء مشروع"}]},synth=window.speechSynthesis;let voices=[],queue=[],playing=false,current=null;
const themes={blue:{a:'#0569b3',d:'#034a80',h:'#fff0a8',s:'#075985',b:'#f2b705',bs:'#bd8500',br:'#76b9e8',bg:'#eef7ff',so:'#e4f2ff',ro:'#f7fbff',rd:'#fffdf2',g:'#ffd43b',sh:'rgba(3,74,128,.16)'},yellow:{a:'#b45309',d:'#7c2d12',h:'#fde68a',s:'#92400e',b:'#f59e0b',bs:'#b45309',br:'#f5c451',bg:'#fffbeb',so:'#fef3c7',ro:'#fffdf2',rd:'#fffaf0',g:'#fb7185',sh:'rgba(146,64,14,.16)'},purple:{a:'#9333a8',d:'#701a75',h:'#f5d0fe',s:'#86198f',b:'#d946ef',bs:'#a21caf',br:'#d8a4e3',bg:'#fdf4ff',so:'#fae8ff',ro:'#fffaff',rd:'#fff8ff',g:'#f0abfc',sh:'rgba(112,26,117,.16)'}};
function theme(n){const t=themes[n],r=document.documentElement.style;r.setProperty('--accent',t.a);r.setProperty('--dark',t.d);r.setProperty('--highlight',t.h);r.setProperty('--speak',t.s);r.setProperty('--button',t.b);r.setProperty('--button-shadow',t.bs);r.setProperty('--border',t.br);r.setProperty('--bg',t.bg);r.setProperty('--soft',t.so);r.setProperty('--row',t.ro);r.setProperty('--reading',t.rd);r.setProperty('--glow',t.g);r.setProperty('--shadow',t.sh)}
function lang(){return document.getElementById('voice-select').value||'en-US'}function loadVoices(){voices=synth.getVoices()}function clear(){if(current)current.classList.remove('speaking-highlight');current=null}function stop(){synth.cancel();queue=[];playing=false;clear()}function say(text,el){if(!text)return;stop();const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);if(el){el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'})}u.onend=clear;u.onerror=clear;synth.speak(u)}
function play(items){stop();if(!items.length)return;queue=[...items];playing=true;let i=0;function next(){if(!playing||i>=queue.length){playing=false;clear();return}const el=queue[i++],text=el.innerText.trim();if(!text){next();return}const u=new SpeechSynthesisUtterance(text);u.lang=lang();const v=voices.find(x=>x.lang.toLowerCase()===lang().toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(lang().split('-')[0]));if(v)u.voice=v;u.rate=parseFloat(document.getElementById('speed-slider').value);el.classList.add('speaking-highlight');current=el;el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{clear();next()};u.onerror=()=>{clear();next()};synth.speak(u)}next()}
function cell(text,cls='vocab-element'){const s=document.createElement('span');s.className=cls;s.innerText=text;s.onclick=()=>say(text,s);return s}
function pairTable(items,headers){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(x=>{const th=document.createElement('th');th.innerText=x;tr.appendChild(th)});head.appendChild(tr);t.appendChild(head);const body=document.createElement('tbody');items.forEach(x=>{const r=document.createElement('tr'),en=document.createElement('td');en.className='english-cell';en.appendChild(cell(x.en));const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;r.append(en,ar);body.appendChild(r)});t.appendChild(body);w.appendChild(t);return w}
function mainPoints(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Topic','Guiding word','Sentence'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.innerText=x.topic;const c=document.createElement('td');c.className='english-cell';c.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.sentence,'english-sentence'));tr.append(a,c,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function verbs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Present\nالمضارع','Past\nالماضي','P.P.\nالتصريف الثالث','المعنى'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');['present','past','pp'].forEach(k=>{const td=document.createElement('td');td.className='english-cell';td.appendChild(cell(x[k]));tr.appendChild(td)});const ar=document.createElement('td');ar.className='arabic-cell';ar.innerText=x.ar;tr.appendChild(ar);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function defs(items){const w=document.createElement('div');w.className='table-wrap';const t=document.createElement('table'),h=document.createElement('thead'),r=document.createElement('tr');['Word\nالكلمة','Definition\nالتعريف'].forEach(x=>{const th=document.createElement('th');th.innerText=x;r.appendChild(th)});h.appendChild(r);t.appendChild(h);const b=document.createElement('tbody');items.forEach(x=>{const tr=document.createElement('tr');const a=document.createElement('td');a.className='english-cell';a.appendChild(cell(x.word));const d=document.createElement('td');d.className='english-cell';d.appendChild(cell(x.definition));tr.append(a,d);b.appendChild(tr)});t.appendChild(b);w.appendChild(t);return w}
function textBlock(x){const box=document.createElement('div');box.className='reading-block';const title=document.createElement('div');title.className='reading-heading';title.innerText=x.title;box.appendChild(title);const items=[];const btn=document.createElement('button');btn.className='play-btn text-play-btn';btn.innerText=x.type==='dialogue'?'▶️ نطق المحادثة كاملة':'▶️ نطق النص كاملًا';box.appendChild(btn);let lastHeading=x.title||'';(x.paragraphs||[]).forEach(p=>{const line=document.createElement('div');if(p.heading&&p.heading!==x.title&&p.heading!==lastHeading){lastHeading=p.heading;const hh=document.createElement('div');hh.className='reading-heading';hh.innerText=p.heading;line.appendChild(hh)}if(p.en){const en=cell(p.en,'english-sentence');line.appendChild(en);items.push(en)}if(p.ar){const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar)}box.appendChild(line)});(x.dialogue||[]).forEach(p=>{const line=document.createElement('div');line.className='dialogue-line';const sp=document.createElement('span');sp.className='speaker'+(p.speaker.toLowerCase().includes('hesham')?' alt':'');sp.innerText=p.speaker+':';const en=cell(p.en,'dialogue-text');line.append(sp,en);const ar=document.createElement('span');ar.className='arabic-translation';ar.innerText=p.ar;line.appendChild(ar);box.appendChild(line);items.push(en)});btn.onclick=()=>play(items);return box}
const labels={key_vocabulary:'📚 Key Vocabulary (الكلمات الأساسية)',activities:'🎨 Activities & Arts (الأنشطة والفنون)',extra_vocabulary:'➕ Extra Vocabulary (مفردات إضافية)',main_points:'🔗 Main Points on Listening and Reading Texts (نقاط هامة على نصوص الاستماع والقراءة)',texts:'📖 Listening and Reading Texts (نصوص الاستماع والقراءة)',verbs:'🔄 Conjugation of Irregular Verbs (تصريف الأفعال غير المنتظمة)',definitions:'📘 Study These Definitions (ادرس تلك التعريفات)',expressions:'🔗 Important Expressions and Prepositions (تعبيرات وحروف جر هامة)'};
const content=document.getElementById('lesson-content'),all=[];let n=0;data.section_order.forEach(key=>{const val=data[key];if(!val||!val.length)return;const h=document.createElement('h3');h.innerHTML='<span class="section-number">'+(++n)+'.</span> '+(labels[key]||key);content.appendChild(h);if(key==='key_vocabulary'||key==='activities'||key==='extra_vocabulary'){const node=pairTable(val,['English','المعنى']);content.appendChild(node);val.forEach(x=>all.push(...[x.en].map(t=>cell(t))))}else if(key==='main_points'){content.appendChild(mainPoints(val))}else if(key==='verbs'){content.appendChild(verbs(val))}else if(key==='definitions'){content.appendChild(defs(val));val.forEach(x=>{all.push(cell(x.word));all.push(cell(x.definition))})}else if(key==='expressions'){content.appendChild(pairTable(val,['English','المعنى']))}else if(key==='texts'){val.forEach(x=>content.appendChild(textBlock(x)))}});
document.getElementById('play-all-vocab-btn').onclick=()=>{const els=[...document.querySelectorAll('#lesson-content .vocab-element')];play(els)};document.getElementById('stop-btn').onclick=stop;document.getElementById('voice-select').onchange=()=>localStorage.setItem(lessonId+'_voice',lang());document.getElementById('speed-slider').oninput=e=>{document.getElementById('speed-value').innerText=e.target.value+'x';localStorage.setItem(lessonId+'_speed',e.target.value)};document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{document.querySelectorAll('.theme-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');theme(d.dataset.theme);localStorage.setItem(lessonId+'_theme',d.dataset.theme)});const savedTheme=localStorage.getItem(lessonId+'_theme')||'blue',savedSpeed=localStorage.getItem(lessonId+'_speed')||'0.9',savedVoice=localStorage.getItem(lessonId+'_voice')||'en-US';theme(savedTheme);document.getElementById('speed-slider').value=savedSpeed;document.getElementById('speed-value').innerText=savedSpeed+'x';document.getElementById('voice-select').value=savedVoice;loadVoices();if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=loadVoices;
</script></body></html>
